            const [y, m] = selectedMonth.split('-');

            const active = masterCourses.filter(c => {
                if(!c.startDate || !c.endDate) return false;
                const s = new Date(c.startDate);
                const e = new Date(c.endDate);
                const startM = s.getFullYear() * 12 + s.getMonth();
                const endM = e.getFullYear() * 12 + e.getMonth();
                const targetM = targetYear * 12 + targetMonth;
                return targetM >= startM && targetM <= endM;
            });

            return { active, totalStudents };

                            <button onClick={() => setYear(y => y + 1)} className="p-2.5 hover:bg-slate-700 rounded-xl text-slate-400 hover:text-white transition-all shadow-sm"><Icons.ChevronRight /></button>

                            {months.map(m => (<div key={m} className="flex-1 text-center text-sm font-bold text-slate-400 border-r border-slate-800/50 last:border-0">{m}月</div>))}

                            {validCourses.sort((a,b) => new Date(a.startDate) - new Date(b.startDate)).map(course => {
                                const start = new Date(course.startDate);
                                const end = new Date(course.endDate);
                                if (start.getFullYear() !== year && end.getFullYear() !== year) return null;
                                const yearStart = new Date(year, 0, 1).getTime();
                                const yearEnd = new Date(year, 11, 31).getTime();
                                const duration = yearEnd - yearStart;
                                const cStart = Math.max(start.getTime(), yearStart);
                                const cEnd = Math.min(end.getTime(), yearEnd);
                                if (cEnd < cStart) return null;
                                const left = ((cStart - yearStart) / duration) * 100;
                                const width = ((cEnd - cStart) / duration) * 100;

                                    <div key={course.id} className="relative h-10 z-10 hover:z-20 group">
                                        <div className={`absolute h-8 rounded-lg shadow-md text-xs flex items-center px-3 cursor-pointer transition-all duration-300 hover:scale-[1.03] hover:shadow-lg bg-gradient-to-r ${getCourseColor(course.type)}`} style={{ left: `${left}%`, width: `${width}%`, minWidth: '60px' }} title={`${course.name} (${course.startDate} ~ ${course.endDate})`}>
                                            <span className="truncate font-bold drop-shadow-sm">{course.name} {course.batch && <span className="opacity-80 font-normal ml-1">({course.batch})</span>}</span>

                return Array.from({length: daysInMonth}, (_, i) => new Date(year, month, i + 1));
            } else {
                const start = new Date(selectedMonth);
                const day = start.getDay();
                const offset = day === 6 ? 0 : -(day + 1);
                start.setDate(start.getDate() + offset); 
                return Array.from({length: 7}, (_, i) => {

                                                        <input type="number" value={tag.count} onChange={e => { const updated = [...editingPerson.customTags]; updated[idx].count = parseInt(e.target.value) || 0; setEditingPerson({...editingPerson, customTags: updated}); }} className="w-16 bg-slate-950/50 border border-slate-700 rounded-lg p-1.5 text-xs font-bold text-center text-slate-300 outline-none" title="次數" />

        const getPositionStyle = (startStr, endStr) => {
            const s = new Date(startStr);
            const e = new Date(endStr);
            if (isNaN(s) || isNaN(e)) return { display: 'none' };
            const leftPct = ((s - minDate) / totalMs) * 100;
            const widthPct = ((e - s) / totalMs) * 100;
            return { left: `${Math.max(0, leftPct)}%`, width: `${Math.max(0.5, widthPct)}%` };
        };

        const months = [];
        let currentMonth = new Date(minDate);

                                <div className="flex-1 relative">
                                    {months.map((m, i) => {
                                        const left = ((m - minDate) / totalMs) * 100;
                                        if (left > 100 || left < 0) return null;

                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            </div>
        );
    });


    const App = () => {

          const [showCategoryModal, setShowCategoryModal] = useState(false);
          const [showTaskTypeModal, setShowTaskTypeModal] = useState(false);

          // PM Modals Control

          const [newTaskForm, setNewTaskForm] = useState({ id: '', label: '', color: 'bg-indigo-600 text-indigo-50', targetCategory: '' });
          const [newCourse, setNewCourse] = useState({ name: '透視', type: 'regular', batch: '', students: 0, startDate: '', duration: 70, endDate: '' });
          const [wsSearchTerm, setWsSearchTerm] = useState("");
          const [wsBatchForm, setWsBatchForm] = useState({ personId: '', startDate: '', endDate: '', type: 'persp_group', context: '' });

          const [collapsedMonths, setCollapsedMonths] = useState({});
          const [errorMsg, setErrorMsg] = useState('');
          const [confirmDialog, setConfirmDialog] = useState({ show: false, message: '', onConfirm: null });

          const fileInputRef = useRef(null);
          const categories = useMemo(() => (categoryGroups || []).flatMap(g => g.items || []), [categoryGroups]);
          
          // ==========================================
          // Supabase Setup

          useEffect(() => {
              if (!supabase) { 
                  setLoading(false); 
                  setSyncStatus('⚠️ 離線模式'); 
                  return; 
              }

              const loadData = async () => {
                  setSyncStatus('連線中...');
                  try {
                      const { data, error } = await supabase.from('app_settings').select('*');
                      if (error) throw error;
                      if (data && data.length > 0) {
                          const state = {};
                          data.forEach(row => { state[row.key] = row.value; });
                          
                          // Load HR Data
                          if (state.categoryGroups) setCategoryGroups(state.categoryGroups);
                          if (state.taskTypes) setTaskTypes(state.taskTypes);
                          if (state.personnel) {
                              const merged = {};
                              const catsToUse = state.categoryGroups ? state.categoryGroups.flatMap(g=>g.items||[]) : categories;
                              catsToUse.forEach(c => {
                                  merged[c.id] = (state.personnel[c.id] || []).map(p => ({ ...p, customTags: p.customTags || [] }));
                              });
                              setPersonnel(merged);
                          }
                          if (state.masterCourses) setMasterCourses(state.masterCourses);
                          if (state.attendanceData) setAttendanceData(state.attendanceData);
                          if (state.manualStats) { try { setManualStats(typeof state.manualStats === 'string' ? JSON.parse(state.manualStats) : state.manualStats); } catch(e) {} }
                          if (state.monthlyData) { try { setMonthlyData(typeof state.monthlyData === 'string' ? JSON.parse(state.monthlyData) : state.monthlyData); } catch(e) {} }
                          if (state.courseMappings) { try { setCourseMappings(typeof state.courseMappings === 'string' ? JSON.parse(state.courseMappings) : state.courseMappings); } catch(e) {} }
                          if (state.adminPassword) setAdminPassword(state.adminPassword);

                          // Load PM Data
                          if (state.pmProjects) setPmProjects(state.pmProjects);
                          if (state.pmTasks) setPmTasks(state.pmTasks);
                          if (state.pmInstructors) setPmInstructors(state.pmInstructors);
                          if (state.pmTeam) setPmTeam(state.pmTeam);
                          if (state.kanbanCols) setKanbanCols(state.kanbanCols);
                      }
                      setSyncStatus('✅ 已同步');
                  } catch (err) {
                      setSyncStatus('❌ 連線失敗');
                  } finally {
                      setLoading(false);
                  }
              };
              loadData();

              const channel = supabase.channel('schema-db-changes')
                  .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, (payload) => {
                      const { key, value } = payload.new;
                      if (!key) return;
                      // HR Sync
                      if (key === 'categoryGroups') setCategoryGroups(value);
                      else if (key === 'taskTypes') setTaskTypes(value);
                      else if (key === 'personnel') setPersonnel(value);
                      else if (key === 'masterCourses') setMasterCourses(value);
                      else if (key === 'attendanceData') setAttendanceData(value);
                      else if (key === 'manualStats') { try { setManualStats(typeof value === 'string' ? JSON.parse(value) : value); } catch(e){} }
                      else if (key === 'monthlyData') { try { setMonthlyData(typeof value === 'string' ? JSON.parse(value) : value); } catch(e){} }
                      else if (key === 'courseMappings') { try { setCourseMappings(typeof value === 'string' ? JSON.parse(value) : value); } catch(e){} }
                      else if (key === 'adminPassword') setAdminPassword(value);
                      // PM Sync
                      else if (key === 'pmProjects') setPmProjects(value);
                      else if (key === 'pmTasks') setPmTasks(value);
                      else if (key === 'pmInstructors') setPmInstructors(value);
                      else if (key === 'pmTeam') setPmTeam(value);
                      else if (key === 'kanbanCols') setKanbanCols(value);
                  })
                  .subscribe();
              return () => { supabase.removeChannel(channel); };
          }, []);

          const saveData = useCallback(async (key, data) => {

              setSyncStatus('同步中...');
              try {
                  const { error } = await supabase.from('app_settings').upsert({ key: key, value: data }, { onConflict: 'key' });
                  if (error) throw error;
                  setSyncStatus('✅ 已同步');
              } catch (e) {
                  setSyncStatus('❌ 儲存失敗');

          // ==============================
          const schedule = useMemo(() => {
              const newSchedule = Array.from({ length: 12 }, (_, i) => ({
                  month: `${i + 1}月`,
                  monthly: monthlyData[i] || [{ name: '月月繪', type: 'monthlyActivity', students: 0, batch: '常駐' }],
                  early: [], mid: [], late: []
              }));
              (masterCourses || []).forEach(course => {
                  if (!course.startDate || !course.endDate) return;
                  const start = new Date(course.startDate);
                  const end = new Date(course.endDate);
                  for (let m = 0; m < 12; m++) {
                      const periods = [{ key: 'early', s: 1, e: 10 }, { key: 'mid', s: 11, e: 20 }, { key: 'late', s: 21, e: 31 }];
                      periods.forEach(p => {
                          const testStart = new Date(start.getFullYear(), m, p.s);
                          const testEnd = new Date(start.getFullYear(), m, p.e);
                          if (start <= testEnd && end >= testStart) {
                              newSchedule[m][p.key].push({ name: course.name, type: course.type, students: course.students, batch: course.batch });
                          }
                      });
                  }
              });
              return newSchedule;
          }, [masterCourses, monthlyData]);

          const calculateManpower = useCallback((courseName, students) => {
              if (!students || students <= 0) return { frontline: 0 };
              let frontline = 0;
              if (courseName.includes('透視')) frontline = Math.ceil(students / 270);
              else if (courseName.includes('構成') || (courseName.includes('色彩') && !courseName.includes('營'))) frontline = Math.ceil(students / 250);
              else if (courseName.includes('速寫') || courseName.includes('線條訓練營') || courseName.includes('色彩訓練營')) {
                  if (students <= 3000) frontline = 8;
                  else if (students <= 4000) frontline = 10;
                  else if (students <= 5000) frontline = 12;
                  else if (students <= 6000) frontline = 13;
                  else frontline = 13 + Math.ceil((students - 6000) / 1000) * 2; 
              } else if (courseName.includes('月月繪')) frontline = 1;
              else frontline = Math.ceil(students / 250);
              return { frontline };
          }, []);

          const getHealthStatus = useCallback((required, available) => {
              if (required === 0) return { text: '無需', class: 'text-slate-500 bg-slate-800/50 border-slate-700/50' };
              if (available >= required) return { text: '充足', class: 'text-emerald-300 bg-emerald-900/40 border-emerald-500/50 shadow-[0_0_10px_rgba(52,211,153,0.15)]' };
              if (available >= required * 0.75) return { text: '吃緊', class: 'text-amber-300 bg-amber-900/40 border-amber-500/50 shadow-[0_0_10px_rgba(251,191,36,0.15)]' };
              return { text: '不足', class: 'text-rose-300 bg-rose-900/40 border-rose-500/50 shadow-[0_0_15px_rgba(244,63,94,0.3)] animate-pulse' };
          }, []);

          const calculateEndDate = (startStr, days) => { if (!startStr || !days) return ''; const d = new Date(startStr); d.setDate(d.getDate() + parseInt(days) - 1); return d.toISOString().split('T')[0]; };
          const calculateDuration = (startStr, endStr) => { if (!startStr || !endStr) return 0; const s = new Date(startStr), e = new Date(endStr); if (e < s) return 0; return Math.ceil(Math.abs(e - s) / (86400000)) + 1; };

          const movePersonToCategory = useCallback((empId, targetCatId) => {
              if (!targetCatId) return;
              setPersonnel(prevPersonnel => {
                  let currentCatId = null, personObj = null;
                  for (const [catId, list] of Object.entries(prevPersonnel || {})) {
                      const found = (list || []).find(p => p.id === empId);
                      if (found) { currentCatId = catId; personObj = found; break; }
                  }
                  if (personObj && currentCatId && currentCatId !== targetCatId) {
                      const newPersonnel = { ...prevPersonnel };
                      newPersonnel[currentCatId] = newPersonnel[currentCatId].filter(p => p.id !== empId);
                      if (!newPersonnel[targetCatId]) newPersonnel[targetCatId] = [];
                      newPersonnel[targetCatId] = [...newPersonnel[targetCatId], personObj];
                      saveData('personnel', newPersonnel); 
                      return newPersonnel;
                  }
                  return prevPersonnel;
              });
          }, [saveData]);

          const handleAddCourse = useCallback(() => { if (!newCourse.name || !newCourse.startDate) { setErrorMsg("請填寫必要資訊"); return; } const updated = [...masterCourses, { ...newCourse, id: generateId() }]; setMasterCourses(updated); saveData('masterCourses', updated); setNewCourse({ ...newCourse, batch: '', students: 0, startDate: '', endDate: '' }); setShowCourseModal(false); setErrorMsg(''); }, [masterCourses, newCourse, saveData]);
          const handleUpdateCourse = useCallback((id, field, val) => { const updated = masterCourses.map(c => { if (c.id !== id) return c; const nc = { ...c, [field]: val }; if (field === 'startDate') nc.endDate = calculateEndDate(val, nc.duration); if (field === 'duration') nc.endDate = calculateEndDate(nc.startDate, val); if (field === 'endDate') nc.duration = calculateDuration(nc.startDate, val); return nc; }); setMasterCourses(updated); saveData('masterCourses', updated); }, [masterCourses, saveData]);
          const handleDeleteCourse = useCallback((id) => { 
              setConfirmDialog({ show: true, message: "確定要刪除此課程嗎？", onConfirm: () => {

              }});
          }, [masterCourses, saveData]);
          
          const handleMonthlyChange = useCallback((mIdx, val) => { 
              const newData = [...monthlyData];

              monthArr[0] = { ...monthArr[0], students: val };

          const updateAttendance = useCallback(async (empId, date, status, context) => { 
              setAttendanceData(prev => {
                  const newData = { ...prev };
                  newData[empId] = { ...(newData[empId] || {}) };

          const batchUpdateAttendance = useCallback(async (records) => {

          const handleUpdatePersonnelState = useCallback((newPersonnelData) => {

          const handleSaveCategories = (newGroups) => { setCategoryGroups(newGroups); saveData('categoryGroups', newGroups); setShowCategoryModal(false); };
          const handleSaveTaskTypes = (newTypes) => { setTaskTypes(newTypes); saveData('taskTypes', newTypes); setShowTaskTypeModal(false); };


          // ==============================
          // PM Logic Functions
          // ==============================
          const handleOpenPmModal = (type, item = null) => {

              const newArr = [...array];
              if (direction === -1 && index > 0) [newArr[index - 1], newArr[index]] = [newArr[index], newArr[index - 1]];

          const handleMoveTask = (task, dir) => {

              let targetId = null;
              if (dir === -1 && siblingIndex > 0) targetId = siblingTasks[siblingIndex - 1].id;

          // ==============================
          // System Operations
          // ==============================
          const handleExport = () => { const data = { personnel, masterCourses, attendanceData, monthlyData: schedule.map(m => ({ month_index: parseInt(m.month), students: m.monthly[0].students })), settings: { categoryGroups, taskTypes, courseMappings }, pmProjects, pmTasks, pmInstructors, pmTeam, kanbanCols, timestamp: new Date().toISOString() }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `erp_backup.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };
          const handleImportClick = () => { fileInputRef.current.click(); }
          const handleFileChange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = async (event) => { try { const imported = JSON.parse(event.target.result);

                     } 
                     if (imported.personnel) { setPersonnel(imported.personnel); await saveData('personnel', imported.personnel); } 
                     if (imported.masterCourses) { setMasterCourses(imported.masterCourses); await saveData('masterCourses', imported.masterCourses); } 
                     if (imported.attendanceData) { setAttendanceData(imported.attendanceData); await saveData('attendanceData', imported.attendanceData); } 
                     if (imported.monthlyData) { await saveData('monthlyData', imported.monthlyData); } 
                     if (imported.manualStats) { setManualStats(imported.manualStats); await saveData('manualStats', imported.manualStats); }
                     if (imported.adminPassword) { setAdminPassword(imported.adminPassword); await saveData('adminPassword', imported.adminPassword); }
                     
                     // PM Import
                     if (imported.pmProjects) { setPmProjects(imported.pmProjects); await saveData('pmProjects', imported.pmProjects); }
                     if (imported.pmTasks) { setPmTasks(imported.pmTasks); await saveData('pmTasks', imported.pmTasks); }
                     if (imported.pmInstructors) { setPmInstructors(imported.pmInstructors); await saveData('pmInstructors', imported.pmInstructors); }
                     if (imported.pmTeam) { setPmTeam(imported.pmTeam); await saveData('pmTeam', imported.pmTeam); }
                     if (imported.kanbanCols) { setKanbanCols(imported.kanbanCols); await saveData('kanbanCols', imported.kanbanCols); }

                     setSyncStatus('✅ 匯入完成'); 
                     setForceRefresh(p=>p+1);
                }});
          } catch(e){} }; reader.readAsText(file); e.target.value=''; };
          

          // Calculated Stats
          const stats = useMemo(() => {
              let allocated = 0, unallocated = 0;
              categories.forEach(c => { const count = personnel[c.id]?.length || 0; if (c.id !== 'pool') allocated += count; else unallocated += count; });
              return { total: allocated + unallocated, allocated, unallocated };

          const dailyStats = useMemo(() => {
              const todayStr = new Date().toISOString().split('T')[0];

              Object.values(attendanceData || {}).forEach(records => {
                  const todayRecord = (records || {})[todayStr];

              });
              return { workingToday, leaveToday };
          }, [attendanceData]);

          if (loading) return <div className="h-screen flex items-center justify-center bg-slate-950 text-indigo-400 font-black tracking-widest text-2xl animate-pulse">載入中，請稍候...</div>;

                    <div className="hidden md:flex items-center gap-4 px-2 mb-6 mt-2">
                        <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-indigo-500/30">E</div>
                        <div className="flex flex-col">
                            <span className="font-black text-xl text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-400 tracking-tight leading-none">ERP Console</span>

                                        <span className={`${currentView === item.id ? 'text-amber-400' : 'text-slate-500 group-hover:text-slate-300'}`}>{item.icon}</span> 
                                        <span className="text-sm tracking-wide">{item.label}</span>
                                    </button>
                                ))}
                            </div>

                        <div className="md:hidden flex w-full justify-around">

                                { id: 'dashboard', icon: <Icons.Dashboard size={20} />, label: '儀表板' },

                                    {item.icon}
                                    <span className="text-[10px] tracking-wide">{item.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    {/* Settings & Auth */}
                    <div className="hidden md:block mt-auto pt-6 border-t border-slate-800/60 space-y-3">
                        <button onClick={() => isAdmin ? setIsAdmin(false) : setShowAuthModal(true)} className={`w-full flex items-center justify-center gap-2 text-xs font-bold py-3 rounded-xl text-center transition-colors border shadow-sm ${isAdmin ? 'bg-indigo-900/40 text-indigo-300 border-indigo-500/30 hover:bg-indigo-900/60' : 'bg-slate-800/50 text-slate-400 border-slate-700/50 hover:bg-slate-700'}`}>
                            {isAdmin ? <><Icons.Unlock /> 管理員已解鎖</> : <><Icons.Lock /> 訪客模式 (僅檢視)</>}
                        </button>
                        {isAdmin && (
                            <button onClick={() => setShowPasswordModal(true)} className="w-full flex items-center justify-center gap-2 text-xs font-bold bg-slate-800/50 hover:bg-slate-700/80 text-slate-300 py-2.5 rounded-xl transition-colors border border-slate-700/50 shadow-sm">
                                <Icons.Key /> 變更密碼

                            <button onClick={handleImportClick} className="flex items-center justify-center gap-1.5 text-xs font-bold bg-slate-800/50 hover:bg-emerald-900/40 text-slate-300 hover:text-emerald-300 py-3 rounded-xl transition-colors border border-slate-700/50 hover:border-emerald-500/30 active:scale-95 shadow-sm" title="匯入還原"><Icons.Upload /> 匯入</button>
                            <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept=".json" />
                        </div>
                    </div>
                </nav>

                <main className="flex-1 p-4 md:p-8 md:px-10 pb-24 md:pb-8 overflow-y-auto h-screen relative">
                    <div className="absolute top-0 left-0 w-full h-[600px] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950 pointer-events-none -z-10"></div>

                    {/* HR Views */}
                    {currentView === 'dashboard' && <DashboardView masterCourses={masterCourses} courseMappings={courseMappings} personnel={personnel} calculateManpower={calculateManpower} getHealthStatus={getHealthStatus} />}
                    {currentView === 'forecast' && <ForecastView stats={stats} schedule={schedule} courseMappings={courseMappings} personnel={personnel} calculateManpower={calculateManpower} getHealthStatus={getHealthStatus} monthlyData={monthlyData} handleMonthlyChange={handleMonthlyChange} collapsedMonths={collapsedMonths} setCollapsedMonths={setCollapsedMonths} categories={categories} isAdmin={isAdmin} />}
                    {currentView === 'timeline' && <TimelineView masterCourses={masterCourses} />}
                    {currentView === 'database' && <DatabaseView

                        taskTypes={taskTypes} setShowTaskTypeModal={setShowTaskTypeModal} attendanceData={attendanceData} updateAttendance={updateAttendance} batchUpdateAttendance={batchUpdateAttendance} wsSearchTerm={wsSearchTerm} setWsSearchTerm={setWsSearchTerm} dailyStats={dailyStats} wsShowBatchModal={wsShowBatchModal} setWsShowBatchModal={setWsShowBatchModal} wsBatchForm={wsBatchForm} setWsBatchForm={setWsBatchForm} isAdmin={isAdmin}

                    {currentView === 'pm_tasks' && <TasksKanbanView projects={pmProjects} tasks={pmTasks} kanbanCols={kanbanCols} handleOpenModal={handleOpenPmModal} handleDelete={handlePmDelete} moveProject={handleMoveProject} moveColumn={handleMoveColumn} moveTask={handleMoveTask} />}

            {/* PM Modals */}
            {pmModalConfig.isOpen && (() => {
                if (pmModalConfig.type === 'projectDetails') {

                                    />
                                    ))}
                                </div>
                            </div>

                            <div className="flex gap-4">
                            <div className="w-full">
                                <label className="block text-xs font-bold text-slate-400 mb-1.5 ml-1">開始時間</label>
                                <input required type="time" name="startTime" value={pmFormData.startTime || ''} onChange={handlePmInputChange} className="w-full p-3 bg-slate-950/50 border border-slate-600 text-slate-200 rounded-xl focus:border-indigo-500 outline-none transition-all font-bold cursor-pointer" />
                            </div>
                            <div className="w-full">
                                <label className="block text-xs font-bold text-slate-400 mb-1.5 ml-1">結束時間</label>
                                <input required type="time" name="endTime" value={pmFormData.endTime || ''} onChange={handlePmInputChange} className="w-full p-3 bg-slate-950/50 border border-slate-600 text-slate-200 rounded-xl focus:border-indigo-500 outline-none transition-all font-bold cursor-pointer" />
                            </div>
                            </div>
                            <input required name="task" value={pmFormData.task || ''} placeholder="負責事項 (例: 正課直播授課、作業點評)" onChange={handlePmInputChange} className="w-full p-3 bg-slate-950/50 border border-slate-600 text-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 outline-none transition-all font-bold placeholder-slate-600" />
                        </>
                        )}
                        {pmModalConfig.type === 'team' && (
                        <>
                            <input required name="name" value={pmFormData.name || ''} placeholder="成員姓名" onChange={handlePmInputChange} className="w-full p-3 bg-slate-950/50 border border-slate-600 text-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 outline-none transition-all font-bold placeholder-slate-600" />
                            <input required name="role" value={pmFormData.role || ''} placeholder="職位/角色" onChange={handlePmInputChange} className="w-full p-3 bg-slate-950/50 border border-slate-600 text-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 outline-none transition-all font-bold placeholder-slate-600" />
                        </>
                        )}
                        
                        <div className="flex justify-end gap-3 mt-8 pt-4 border-t border-slate-800/80">
                        <button type="button" onClick={handleClosePmModal} className="px-5 py-2.5 text-sm font-bold text-slate-300 bg-slate-800 rounded-xl hover:bg-slate-700 transition-colors">取消</button>
                        <button type="submit" className="px-6 py-2.5 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-500 shadow-lg active:scale-95 transition-all">儲存內容</button>
                        </div>
                    </form>
                    </div>
                </div>
                );
            })()}

            {/* 登入 Modal */}
            {showAuthModal && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[120] flex items-center justify-center p-4 animate-in fade-in duration-200">
                    <div className="bg-slate-900/90 backdrop-blur-2xl rounded-3xl p-8 w-full max-w-sm shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] border border-slate-700/50">
                        <div className="flex justify-center mb-4 text-indigo-400 scale-150"><Icons.Lock /></div>
                        <h3 className="font-black text-xl text-center text-slate-100 mb-2 tracking-wide">管理員解鎖</h3>
                        <p className="text-slate-400 text-xs text-center mb-6 font-medium">請輸入管理員密碼以啟用編輯功能<br/><span className="text-[10px] opacity-70">(預設為 admin，登入後可於左下角變更)</span></p>
                        <input 
                            type="password" 
                            autoFocus
                            value={authInput} 
                            onChange={e => { setAuthInput(e.target.value); setAuthError(false); }} 
                            onKeyDown={e => {
                                if (e.key === 'Enter') {
                                    if (authInput === adminPassword) { setIsAdmin(true); setShowAuthModal(false); setAuthInput(''); setAuthError(false); }
                                    else { setAuthError(true); }
                                }
                            }}
                            className={`w-full bg-slate-950/50 border ${authError ? 'border-rose-500 ring-1 ring-rose-500/50' : 'border-slate-600'} rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 mb-2 text-center tracking-widest transition-all`} 
                            placeholder="請輸入密碼..." 
                        />
                        <div className="h-6 mb-4 flex justify-center items-center">
                            {authError && <span className="text-rose-400 text-xs font-bold animate-pulse">密碼錯誤，請重試！</span>}
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => { setShowAuthModal(false); setAuthInput(''); setAuthError(false); }} className="flex-1 py-3 rounded-xl font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 transition-all">取消</button>
                            <button onClick={() => { 
                                if (authInput === adminPassword) { setIsAdmin(true); setShowAuthModal(false); setAuthInput(''); setAuthError(false); }
                                else { setAuthError(true); }
                            }} className="flex-1 py-3 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-500 shadow-lg active:scale-95 transition-all">確認解鎖</button>
                        </div>
                    </div>
                </div>
            )}

            {/* 設定新密碼 Modal */}
            {showPasswordModal && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[120] flex items-center justify-center p-4 animate-in fade-in duration-200">
                    <div className="bg-slate-900/90 backdrop-blur-2xl rounded-3xl p-8 w-full max-w-sm shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] border border-slate-700/50">
                        <div className="flex justify-center mb-4 text-indigo-400 scale-150"><Icons.Key /></div>
                        <h3 className="font-black text-xl text-center text-slate-100 mb-2 tracking-wide">變更管理員密碼</h3>
                        <p className="text-slate-400 text-xs text-center mb-6 font-medium">請輸入您想設定的新密碼，此密碼將同步至雲端。</p>
                        <input 
                            type="text" 
                            autoFocus
                            value={newPasswordInput} 
                            onChange={e => setNewPasswordInput(e.target.value)} 
                            onKeyDown={e => {
                                if (e.key === 'Enter' && newPasswordInput.trim()) {
                                    setAdminPassword(newPasswordInput.trim());
                                    saveData('adminPassword', newPasswordInput.trim());
                                    setShowPasswordModal(false);
                                    setNewPasswordInput('');
                                }
                            }}
                            className="w-full bg-slate-950/50 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 mb-6 text-center tracking-widest transition-all" 
                            placeholder="輸入新密碼..." 
                        />
                        <div className="flex gap-4">
                            <button onClick={() => { setShowPasswordModal(false); setNewPasswordInput(''); }} className="flex-1 py-3 rounded-xl font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 transition-all">取消</button>
                            <button onClick={() => { 
                                if (newPasswordInput.trim()) {
                                    setAdminPassword(newPasswordInput.trim());
                                    saveData('adminPassword', newPasswordInput.trim());
                                    setShowPasswordModal(false);
                                    setNewPasswordInput('');
                                }
                            }} className="flex-1 py-3 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-500 shadow-lg active:scale-95 transition-all">儲存密碼</button>
                        </div>
                    </div>
                </div>
            )}
            </div>
      );
    }
    
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
