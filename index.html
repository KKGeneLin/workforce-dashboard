          useEffect(() => {
            const initializeData = async () => {
              setLoading(true); setSyncStatus('同步中...');
              const safeFetch = async (table, options = {}) => {
                  try {
                    const query = supabase.from(table).select('*');
                    if (options.order) query.order(options.order, { ascending: true });
                    const { data, error } = await query;
                    if (error) return []; 
                    return data || [];
                  } catch (e) { return []; }
              };
              try {
                const [pData, cData, mData, attData, settingsData] = await Promise.all([
                    safeFetch('personnel'), safeFetch('courses'), safeFetch('monthly_data', { order: 'month_index' }), safeFetch('attendance'), safeFetch('app_settings')
                ]);
                if (settingsData) {
                    const cats = settingsData.find(s => s.key === 'categories');
                    const tasks = settingsData.find(s => s.key === 'task_types');
                    if (cats && cats.value) setCategoryGroups(cats.value);
                    if (tasks && tasks.value) setTaskTypes(tasks.value);
                }
                const currentCats = (settingsData?.find(s => s.key === 'categories')?.value || DEFAULT_CATEGORY_GROUPS).flatMap(g => g.items);
                if (pData.length > 0) {
                    const grouped = {}; currentCats.forEach(c => grouped[c.id] = []);
                    pData.forEach(p => { if (grouped[p.category_id]) grouped[p.category_id].push({ id: p.id, name: p.name }); });
                    setPersonnel(grouped);
                } else { const grouped = {}; currentCats.forEach(c => grouped[c.id] = []); setPersonnel(grouped); }
                
                if (cData.length > 0) {
                    setMasterCourses(cData.map(c => ({ id: c.id, name: c.name, type: c.type, batch: c.batch, students: c.students, startDate: c.start_date, endDate: c.end_date, duration: c.duration })));
                }
                const initSchedule = Array.from({ length: 12 }, (_, i) => ({ month: `${i + 1}月`, monthly: [{ name: '月月繪', type: 'monthlyActivity', students: mData?.find(m => m.month_index === i)?.students || 0, batch: '常駐' }], early: [], mid: [], late: [] }));
                setSchedule(initSchedule);
                if (attData.length > 0) {
                    const attMap = {}; attData.forEach(record => { if (!attMap[record.employee_id]) attMap[record.employee_id] = {}; attMap[record.employee_id][record.date] = { status: record.status, context: record.context || '' }; });
                    setAttendanceData(attMap);
                }
                setSyncStatus('✅ 已同步');
              } catch (err) { setSyncStatus('⚠️ 部分功能受限'); } finally { setLoading(false); }
            };
            initializeData();
          }, [forceRefresh]);

          // --- Logic Hooks ---
          useEffect(() => {
              setSchedule(prev => {
                  const newSchedule = prev.length > 0 ? JSON.parse(JSON.stringify(prev)) : [];
                  if(newSchedule.length===0) return [];
                  newSchedule.forEach(m => { m.early = []; m.mid = []; m.late = []; });
                  masterCourses.forEach(course => {
                      if (!course.startDate || !course.endDate) return;
                      const start = new Date(course.startDate);
                      const end = new Date(course.endDate);
                      for (let m = 0; m < 12; m++) {
                          const periods = [{ key: 'early', s: 1, e: 10 }, { key: 'mid', s: 11, e: 20 }, { key: 'late', s: 21, e: 31 }];
                          periods.forEach(p => {
                              const testStart = new Date(start.getFullYear(), m, p.s);
                              const testEnd = new Date(start.getFullYear(), m, p.e);
                              if (start <= testEnd && end >= testStart) {
                                  newSchedule[m][p.key].push({ name: course.name, type: course.type, students: course.students, batch: course.batch });
                              }
                          });
                      }
                  });
                  return newSchedule;
              });
          }, [masterCourses]);

          const calculateEndDate = (startStr, days) => { if (!startStr || !days) return ''; const d = new Date(startStr); d.setDate(d.getDate() + parseInt(days) - 1); return d.toISOString().split('T')[0]; };
          const calculateDuration = (startStr, endStr) => { if (!startStr || !endStr) return 0; const s = new Date(startStr), e = new Date(endStr); if (e < s) return 0; return Math.ceil(Math.abs(e - s) / (86400000)) + 1; };
          const syncDB = async (table, data) => { 
              setSyncStatus('同步中...'); 
              try { 
                  if (table === 'app_settings') { await supabase.from('app_settings').upsert(data); } 
                  else { 
                      await supabase.from(table).delete().neq('id', '0'); 
                      let records = []; 
                      if (table === 'personnel') { Object.entries(data).forEach(([catId, list]) => list.forEach(p => records.push({ id: p.id, category_id: catId, name: p.name }))); } 
                      else if (table === 'courses') { records = data.map(c => ({ id: c.id, name: c.name, type: c.type, batch: c.batch, students: c.students, start_date: c.startDate, end_date: c.endDate, duration: c.duration })); } 
                      else if (table === 'monthly_data') { records = data.map((m, i) => ({ month_index: i, students: m[0]?.students || 0 })); } 
                      if (records.length) await supabase.from(table).insert(records); 
                  } 
                  setSyncStatus('✅ 已同步'); 
              } catch(e) { setSyncStatus('❌ 失敗'); } 
          };

          const handleAddCourse = () => { if (!newCourse.name || !newCourse.startDate) { setErrorMsg("請填寫必要資訊"); return; } const updated = [...masterCourses, { ...newCourse, id: generateId() }]; setMasterCourses(updated); syncDB('courses', updated); setNewCourse({ ...newCourse, batch: '', students: 0, startDate: '', endDate: '' }); setShowCourseModal(false); setErrorMsg(''); };
          const handleUpdateCourse = (id, field, val) => { const updated = masterCourses.map(c => { if (c.id !== id) return c; const nc = { ...c, [field]: val }; if (field === 'startDate') nc.endDate = calculateEndDate(val, nc.duration); if (field === 'duration') nc.endDate = calculateEndDate(nc.startDate, val); if (field === 'endDate') nc.duration = calculateDuration(nc.startDate, val); return nc; }); setMasterCourses(updated); syncDB('courses', updated); };
          const handleDeleteCourse = (id) => { if (!confirm("確定刪除？")) return; const updated = masterCourses.filter(c => c.id !== id); setMasterCourses(updated); syncDB('courses', updated); };
          const handleMonthlyChange = (mIdx, val) => { const newSched = [...schedule]; newSched[mIdx].monthly[0].students = val; setSchedule(newSched); syncDB('monthly_data', newSchedule.map(m => m.monthly)); };
          const handleConfirmAddPerson = () => { if (!tempName.trim() || !addingToCategory) return; const newP = { id: generateId(), name: tempName.trim() }; const newPersonnel = { ...personnel, [addingToCategory]: [...(personnel[addingToCategory] || []), newP] }; setPersonnel(newPersonnel); syncDB('personnel', newPersonnel); setTempName(''); setAddingToCategory(null); };
          const handleRemovePerson = () => { if (!deleteTarget) return; const newPersonnel = { ...personnel }; newPersonnel[deleteTarget.categoryId] = newPersonnel[deleteTarget.categoryId].filter(p => p.id !== deleteTarget.personId); setPersonnel(newPersonnel); syncDB('personnel', newPersonnel); setShowDeleteModal(false); };
          
          // --- Drag & Drop Handlers ---
          const clearDragStates = () => { setDraggedItem(null); setDragOverContainer(null); setDraggedGroupIdx(null); setDraggedCatInfo(null); };

          const onDragStart = (e, person, fromCategory) => { e.stopPropagation(); setDraggedItem({ person, fromCategory }); e.dataTransfer.effectAllowed = 'move'; };
          const onDragOver = (e, catId) => { e.preventDefault(); if (dragOverContainer !== catId) setDragOverContainer(catId); };
          const onDrop = (e, toCategory) => { e.preventDefault(); setDragOverContainer(null); if (!draggedItem || draggedItem.fromCategory === toCategory) return; const newPersonnel = { ...personnel }; newPersonnel[draggedItem.fromCategory] = newPersonnel[draggedItem.fromCategory].filter(p => p.id !== draggedItem.person.id); newPersonnel[toCategory] = [...(newPersonnel[toCategory] || []), draggedItem.person]; setPersonnel(newPersonnel); syncDB('personnel', newPersonnel); setDraggedItem(null); };
          
          const onGroupDragStart = (e, idx) => { e.stopPropagation(); setDraggedGroupIdx(idx); e.dataTransfer.effectAllowed = 'move'; };
          const onGroupDrop = (e, dropIdx) => { 
              e.preventDefault(); e.stopPropagation(); 
              if (draggedGroupIdx === null || draggedGroupIdx === dropIdx) { clearDragStates(); return; }
              const newGroups = [...categoryGroups]; 
              const [moved] = newGroups.splice(draggedGroupIdx, 1); 
              newGroups.splice(dropIdx, 0, moved); 
              handleSaveCategories(newGroups); 
              clearDragStates(); 
          };
          
          const onCatDragStart = (e, groupIdx, catIdx) => { e.stopPropagation(); setDraggedCatInfo({ groupIdx, catIdx }); e.dataTransfer.effectAllowed = 'move'; };
          const onCatDrop = (e, targetGroupIdx, targetCatIdx) => { 
              e.preventDefault(); e.stopPropagation(); 
              if (!draggedCatInfo) { clearDragStates(); return; }
              const { groupIdx: srcG, catIdx: srcC } = draggedCatInfo; 
              if (srcG === targetGroupIdx && srcC === targetCatIdx) { clearDragStates(); return; } 
              const newGroups = JSON.parse(JSON.stringify(categoryGroups)); 
              const [moved] = newGroups[srcG].items.splice(srcC, 1); 
              newGroups[targetGroupIdx].items.splice(targetCatIdx, 0, moved); 
              handleSaveCategories(newGroups); 
              clearDragStates(); 
          };

          const updateAttendance = async (empId, date, status, context) => { 
              setAttendanceData(prev => {
                  const newData = { ...prev };
                  if (!newData[empId]) newData[empId] = {};
                  if (!status) delete newData[empId][date]; else newData[empId][date] = { status, context };
                  return newData;
              });
              setSyncStatus('同步中...');
              if (status) {
                  const taskConfig = taskTypes.find(t => t.id === status);
                  if (taskConfig && taskConfig.targetCategory) movePersonToCategory(empId, taskConfig.targetCategory);
              }
              try { 
                  if (!status) await supabase.from('attendance').delete().match({ employee_id: empId, date: date }); 
                  else await supabase.from('attendance').upsert({ employee_id: empId, date: date, status: status, context: context }, { onConflict: 'employee_id, date' }); 
                  setSyncStatus('✅ 已同步');
              } catch(e) { setSyncStatus('❌ 儲存失敗'); } 
          };
          
          const batchUpdateAttendance = async (records) => { 
              setAttendanceData(prev => {
                  const newData = { ...prev };
                  records.forEach(r => { if (!newData[r.employee_id]) newData[r.employee_id] = {}; newData[r.employee_id][r.date] = { status: r.status, context: r.context }; });
                  return newData;
              });
              if (records.length > 0) {
                  const taskConfig = taskTypes.find(t => t.id === records[0].status);
                  if (taskConfig && taskConfig.targetCategory) movePersonToCategory(records[0].employee_id, taskConfig.targetCategory);
              }
              setSyncStatus('批量更新中...');
              try { 
                  await supabase.from('attendance').upsert(records, { onConflict: 'employee_id, date' }); 
                  setSyncStatus('✅ 批量完成');
              } catch(e) { setSyncStatus('❌ 批量失敗'); } 
          };

          const handleExport = () => { const data = { personnel, masterCourses, attendanceData, monthlyData: schedule.map(m => ({ month_index: parseInt(m.month), students: m.monthly[0].students })), settings: { categoryGroups, taskTypes }, timestamp: new Date().toISOString() }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `backup.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };
          const handleImportClick = () => { fileInputRef.current.click(); }
          const handleFileChange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = async (event) => { try { const imported = JSON.parse(event.target.result); if (confirm("匯入?")) { if (imported.settings) { if (imported.settings.categoryGroups) { setCategoryGroups(imported.settings.categoryGroups); await syncDB('app_settings', { key: 'categories', value: imported.settings.categoryGroups }); } if (imported.settings.taskTypes) { setTaskTypes(imported.settings.taskTypes); await syncDB('app_settings', { key: 'task_types', value: imported.settings.taskTypes }); } } if (imported.personnel) { setPersonnel(imported.personnel); await syncDB('personnel', imported.personnel); } if (imported.masterCourses) { setMasterCourses(imported.masterCourses); await syncDB('courses', imported.masterCourses); } if (imported.attendanceData) { setAttendanceData(imported.attendanceData); } if (imported.monthlyData) { await syncDB('monthly_data', imported.monthlyData); } alert("Done"); setForceRefresh(p=>p+1); } } catch(e){} }; reader.readAsText(file); e.target.value=''; };
          const handleSaveCategories = (newGroups) => { setCategoryGroups(newGroups); syncDB('app_settings', { key: 'categories', value: newGroups }); setShowCategoryModal(false); };
          const handleSaveTaskTypes = (newTypes) => { setTaskTypes(newTypes); syncDB('app_settings', { key: 'task_types', value: newTypes }); setShowTaskTypeModal(false); };

          const stats = useMemo(() => {
              let allocated = 0; let frontline = 0;
              categories.forEach(c => { const count = personnel[c.id]?.length || 0; if (c.id !== 'pool') allocated += count; if (c.type === 'frontline') frontline += count; });
              const total = allocated + (personnel['pool']?.length || 0);
              return { total, allocated, unallocated: personnel['pool']?.length || 0, frontline };
          }, [personnel, categories]);
          const studentStats = useMemo(() => { let total = 0; masterCourses.forEach(c => total += (parseInt(c.students) || 0)); return { total }; }, [masterCourses]);
          const dailyStats = useMemo(() => {
              const todayStr = new Date().toISOString().split('T')[0];
              let workingToday = 0;
              let leaveToday = 0;
              Object.values(attendanceData).forEach(records => {
                  const todayRecord = records[todayStr];
                  if (todayRecord) {
                      if (todayRecord.status === 'leave' || todayRecord.status === 'sick') leaveToday++;
                      else workingToday++;
                  }
              });
              return { workingToday, leaveToday };
          }, [attendanceData]);

          if (loading) return <div className="h-screen flex items-center justify-center bg-slate-950 text-slate-400 font-medium">載入中...</div>;

          return (
             <div className="flex min-h-screen">
                <nav className="fixed md:relative bottom-0 w-full md:w-64 bg-slate-900 border-t md:border-r border-slate-800 z-50 flex md:flex-col justify-around md:justify-start p-2 md:p-6 md:space-y-6 shadow-lg md:shadow-none">
                    <div className="hidden md:flex items-center gap-3 px-2 mb-4"><div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">M</div><span className="font-black text-xl text-slate-100 tracking-tight">人力儀表板</span></div>
                    <button onClick={() => setCurrentView('dashboard')} className={`nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${currentView === 'dashboard' ? 'bg-indigo-900 text-indigo-100 border-l-4 border-indigo-500' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}><Icons.Dashboard /> <span className="hidden md:inline">儀表板</span></button>
                    <button onClick={() => setCurrentView('attendance')} className={`nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${currentView === 'attendance' ? 'bg-indigo-900 text-indigo-100 border-l-4 border-indigo-500' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}><Icons.ClipboardCheck /> <span className="hidden md:inline">工作班表</span></button>
                    <button onClick={() => setCurrentView('timeline')} className={`nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${currentView === 'timeline' ? 'bg-indigo-900 text-indigo-100 border-l-4 border-indigo-500' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}><Icons.Calendar /> <span className="hidden md:inline">課程時間軸</span></button>
                    <button onClick={() => setCurrentView('personnel')} className={`nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${currentView === 'personnel' ? 'bg-indigo-900 text-indigo-100 border-l-4 border-indigo-500' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}><Icons.Users /> <span className="hidden md:inline">人員名單</span></button>
                    <button onClick={() => setCurrentView('analytics')} className={`nav-item flex items-center gap-3 px-4 py-3 rounded-xl font-bold transition-all ${currentView === 'analytics' ? 'bg-indigo-900 text-indigo-100 border-l-4 border-indigo-500' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}><Icons.BarChart /> <span className="hidden md:inline">數據分析</span></button>
                    
                    <div className="hidden md:block mt-auto pt-6 border-t border-slate-800">
                        <div className="flex items-center gap-2 text-xs font-bold text-slate-500 px-4 mb-2"><Icons.Cloud /> <span>{syncStatus}</span></div>
                        <button onClick={() => setForceRefresh(p=>p+1)} className="w-full text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 py-2 rounded text-center">重新整理</button>
                        
                        <div className="grid grid-cols-2 gap-2 px-1 mt-2">
                            <button onClick={handleExport} className="flex items-center justify-center gap-1 text-xs bg-slate-800 hover:bg-indigo-900 text-slate-300 py-2 rounded transition-colors" title="匯出備份"><Icons.Download /> 匯出</button>
                            <button onClick={handleImportClick} className="flex items-center justify-center gap-1 text-xs bg-slate-800 hover:bg-emerald-900 text-slate-300 py-2 rounded transition-colors" title="匯入還原"><Icons.Upload /> 匯入</button>
                            <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept=".json" />
                        </div>
                    </div>
                </nav>

                <main className="flex-1 p-4 md:p-8 pb-24 md:pb-8 overflow-y-auto h-screen bg-slate-950 relative">

                    {currentView === 'dashboard' && (
                        <div className="space-y-8 fade-in">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <KPICard title="助教總人數" value={stats.total} icon={<Icons.Users />} color="bg-slate-800 text-slate-400" />
                                <KPICard title="目前已分配" value={stats.allocated} icon={<div className="w-2 h-2 rounded-full bg-emerald-500"></div>} color="bg-emerald-900/50 text-emerald-400" />
                                <KPICard title="總學生數" value={studentStats.total} icon={<div className="w-2 h-2 rounded-full bg-indigo-500"></div>} color="bg-indigo-900/50 text-indigo-400" />
                            </div>
                            <div className="bg-slate-900 rounded-2xl shadow-sm border border-slate-800 overflow-hidden">
                                <div className="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                                    <div><h2 className="text-lg font-bold text-slate-100">年度課程總表</h2><p className="text-xs text-slate-500 mt-1">管理所有開設計畫與人數預估</p></div>
                                    <button onClick={() => setShowCourseModal(true)} className="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-900/50"><Icons.Plus /> 新增課程</button>
                                </div>
                                <div className="overflow-x-auto"><table className="w-full text-left text-xs text-slate-300"><thead className="bg-slate-800/50 text-slate-500 uppercase tracking-wider font-semibold"><tr><th className="p-3 pl-6">課程名稱</th><th className="p-3">期數</th><th className="p-3">開始日期</th><th className="p-3">服務天數</th><th className="p-3">結束日期</th><th className="p-3">預估人數</th><th className="p-3 text-right pr-6">操作</th></tr></thead><tbody className="bg-slate-900 divide-y divide-slate-800">{masterCourses.length === 0 ? (<tr><td colSpan="7" className="p-8 text-center text-slate-500 italic">尚未建立任何課程。</td></tr>) : masterCourses.map(c => <CourseRow key={c.id} course={c} onUpdate={handleUpdateCourse} onDelete={handleDeleteCourse} />)}</tbody></table></div>
                            </div>
                            <div>
                                <div className="flex justify-between items-end mb-4 px-1"><h2 className="text-lg font-bold text-slate-100">每月排程預覽</h2><div className="flex gap-2"><button onClick={() => setCollapsedMonths({})} className="text-xs bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-800 font-bold text-slate-300">全部展開</button><button onClick={() => { const all={}; schedule.forEach((_,i)=>all[i]=true); setCollapsedMonths(all); }} className="text-xs bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-800 font-bold text-slate-300">全部收合</button></div></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                    {schedule.map((m, idx) => (
                                        <div key={idx} className="bg-slate-900 rounded-xl shadow-sm border border-slate-800 overflow-hidden group hover:shadow-md transition-all">
                                            <div className="bg-slate-800 p-3 flex justify-between items-center cursor-pointer border-b border-slate-700" onClick={() => setCollapsedMonths(prev => ({...prev, [idx]: !prev[idx]}))}>
                                                <div className="font-black text-slate-200 text-lg flex items-center gap-2">{m.month}{collapsedMonths[idx] && <span className="text-[10px] bg-slate-700 text-slate-400 px-1.5 rounded">已收合</span>}</div>
                                                <div className="text-slate-500">{collapsedMonths[idx] ? <Icons.ChevronDown/> : <Icons.ChevronUp/>}</div>
                                            </div>
                                            {!collapsedMonths[idx] && (
                                                <div className="divide-y divide-slate-800 text-xs">
                                                    {['early', 'mid', 'late'].map(pKey => {
                                                        const hasCourse = m[pKey].length > 0;
                                                        return (
                                                            <div key={pKey} className={`p-3 ${hasCourse ? 'bg-slate-900' : 'bg-slate-800/30'}`}>
                                                                <div className="font-bold text-slate-500 text-[10px] uppercase mb-2 tracking-wider">{pKey === 'early' ? '上旬 (1-10)' : pKey === 'mid' ? '中旬 (11-20)' : '下旬 (21+)'}</div>
                                                                <div className="space-y-1.5">
                                                                    {m[pKey].map((p, i) => (
                                                                        <div key={i} className="flex justify-between items-center bg-indigo-900/30 p-1.5 rounded border border-indigo-900/50">
                                                                            <span className="font-bold text-slate-300">{p.name} <span className="font-normal text-slate-500 scale-90 inline-block">{p.batch}</span></span>
                                                                            <span className="font-bold text-indigo-400 bg-slate-800 px-1.5 rounded shadow-sm">{p.students}</span>
                                                                        </div>
                                                                    ))}
                                                                    {!hasCourse && <div className="text-slate-600 text-[10px] text-center italic">- 空閒 -</div>}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                    <div className="p-3 bg-slate-800 flex justify-between items-center">
                                                        <span className="font-bold text-slate-400">月月繪</span>
                                                        <input type="number" value={m.monthly[0].students} onChange={e => handleMonthlyChange(idx, parseInt(e.target.value)||0)} className="w-16 text-center bg-slate-900 border border-slate-700 rounded px-1 py-0.5 outline-none focus:border-indigo-500 font-bold text-indigo-400 text-slate-200" />
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {currentView === 'attendance' && <WorkScheduleView 
                        personnel={personnel} 
                        categoryGroups={categoryGroups} 
                        attendanceData={attendanceData}
                        onUpdateAttendance={updateAttendance}
                        onBatchUpdate={batchUpdateAttendance}
                        taskTypes={taskTypes}
                        setShowTaskTypeModal={setShowTaskTypeModal}
                        wsSearchTerm={wsSearchTerm} setWsSearchTerm={setWsSearchTerm}
                        wsShowBatchModal={wsShowBatchModal} setWsShowBatchModal={setWsShowBatchModal}
                        wsBatchForm={wsBatchForm} setWsBatchForm={setWsBatchForm}
                        dailyStats={dailyStats}
                    />}
                    
                    {currentView === 'personnel' && <PersonnelView 
                        personnel={personnel}
                        categoryGroups={categoryGroups}
                        setAddingToCategory={setAddingToCategory}
                        setTempName={setTempName}
                        addingToCategory={addingToCategory}
                        tempName={tempName}
                        handleConfirmAddPerson={handleConfirmAddPerson}
                        setDeleteTarget={setDeleteTarget}
                        setShowDeleteModal={setShowDeleteModal}
                        onPersonDragStart={onDragStart}
                        onDragOver={onDragOver}
                        onPersonDrop={onDrop}
                        dragOverContainer={dragOverContainer}
                        setShowCategoryModal={setShowCategoryModal}
                        setCollapsedPersonnelGroups={setCollapsedPersonnelGroups}
                        collapsedPersonnelGroups={collapsedPersonnelGroups}
                        draggedItem={draggedItem}
                        draggedCatInfo={draggedCatInfo}
                        draggedGroupIdx={draggedGroupIdx}
                        onGroupDragStart={onGroupDragStart}
                        onGroupDrop={onGroupDrop}
                        onCatDragStart={onCatDragStart}
                        onCatDrop={onCatDrop}
                        clearDragStates={clearDragStates}
                    />}
                    
                    {currentView === 'timeline' && <TimelineView masterCourses={masterCourses} />}

                    {currentView === 'analytics' && <AnalyticsView 
                        personnel={personnel} 
                        attendanceData={attendanceData} 
                        taskTypes={taskTypes} 
                        categoryGroups={categoryGroups} 
                    />}
            </main>

            {/* Modals */}
            {showCourseModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg p-6 animate-in zoom-in-95 duration-200 border border-slate-800">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-slate-100">新增課程計畫</h3><button onClick={() => setShowCourseModal(false)} className="text-slate-400 hover:text-slate-200"><Icons.X /></button></div>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">課程名稱</label><select value={newCourse.name} onChange={e => { const sel = COURSE_TYPES.find(c => c.label === e.target.value); setNewCourse({...newCourse, name:e.target.value, type:sel.value, duration:sel.days}); }} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200">{COURSE_TYPES.map(c => <option key={c.label} value={c.label}>{c.label}</option>)}</select></div>
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">期數 (如 S1)</label><input type="text" value={newCourse.batch} onChange={e => setNewCourse({...newCourse, batch:e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200" placeholder="S1" /></div>
                            </div>
                            <div className="grid grid-cols-3 gap-4">
                                <div className="col-span-1"><label className="block text-xs font-bold text-slate-400 mb-1">開始日期</label><input type="date" value={newCourse.startDate} onChange={e => setNewCourse({...newCourse, startDate:e.target.value, endDate: calculateEndDate(e.target.value, newCourse.duration)})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200" /></div>
                                <div className="col-span-1"><label className="block text-xs font-bold text-slate-500 mb-1">天數</label><input type="number" value={newCourse.duration} onChange={e => setNewCourse({...newCourse, duration:e.target.value, endDate: calculateEndDate(newCourse.startDate, e.target.value)})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200" /></div>
                                <div className="col-span-1"><label className="block text-xs font-bold text-slate-500 mb-1">結束日期 (自動)</label><input type="date" value={newCourse.endDate} readOnly className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-600 outline-none cursor-not-allowed" /></div>
                            </div>
                            <div><label className="block text-xs font-bold text-slate-400 mb-1">預估人數</label><input type="number" value={newCourse.students} onChange={e => setNewCourse({...newCourse, students:parseInt(e.target.value)||0})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-indigo-400" placeholder="0" /></div>
                            {errorMsg && <div className="text-rose-400 text-xs font-bold bg-rose-900/30 p-2 rounded">{errorMsg}</div>}
                            <div className="pt-4 flex gap-3"><button onClick={() => setShowCourseModal(false)} className="flex-1 py-3 rounded-xl font-bold text-slate-400 hover:bg-slate-800 transition-colors">取消</button><button onClick={handleAddCourse} className="flex-1 py-3 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-900/50 transition-all transform active:scale-95">確認新增</button></div>
                        </div>
                    </div>
                </div>
            )}
            
            {showCategoryModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg p-6 animate-in zoom-in-95 duration-200 border border-slate-800 max-h-[80vh] overflow-y-auto custom-scrollbar">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-slate-100">管理人員分類</h3><button onClick={() => setShowCategoryModal(false)} className="text-slate-400 hover:text-slate-200"><Icons.X /></button></div>
                        <div className="space-y-6">
                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                <h4 className="font-bold text-slate-300 text-sm mb-3">新增大分類 (Group)</h4>
                                <div className="flex gap-2">
                                    <input value={newGroupForm} onChange={e=>setNewGroupForm(e.target.value)} placeholder="分類名稱 (如: 實習)" className="flex-1 bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-200 outline-none" />
                                    <button onClick={() => {
                                        if(!newGroupForm) return;
                                        const newGroups = [...categoryGroups, { name: newGroupForm, items: [] }];
                                        handleSaveCategories(newGroups);
                                        setNewGroupForm('');
                                    }} className="bg-indigo-600 text-white px-3 py-2 rounded text-xs font-bold hover:bg-indigo-700">新增</button>
                                </div>
                            </div>

                            {categoryGroups.map((group, idx) => (
                                <div key={idx} className="border-b border-slate-800 pb-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="font-bold text-indigo-400">{group.name}</h4>
                                        <button onClick={() => {
                                            if(!confirm('確定刪除此分類群組？')) return;
                                            const newGroups = categoryGroups.filter((_, i) => i !== idx);
                                            handleSaveCategories(newGroups);
                                        }} className="text-rose-500 text-xs hover:text-rose-400">刪除群組</button>
                                    </div>
                                    <div className="space-y-2">
                                        {group.items.map(cat => (
                                            <div key={cat.id} className="flex justify-between items-center bg-slate-800 p-2 rounded">
                                                <span className="text-xs text-slate-300">{cat.label} <span className="text-slate-500">({cat.id})</span></span>
                                                <button onClick={() => {
                                                    if(!confirm('確定刪除此職能？')) return;
                                                    const newGroups = [...categoryGroups];
                                                    newGroups[idx].items = newGroups[idx].items.filter(c => c.id !== cat.id);
                                                    handleSaveCategories(newGroups);
                                                }} className="text-slate-500 hover:text-rose-500"><Icons.Trash /></button>
                                            </div>
                                        ))}
                                        <div className="flex gap-2 mt-2">
                                            <input value={newCatForm.id} onChange={e=>setNewCatForm({...newCatForm, id:e.target.value})} placeholder="ID (英數)" className="w-1/3 bg-slate-900 border border-slate-600 rounded p-1.5 text-xs text-slate-200" />
                                            <input value={newCatForm.label} onChange={e=>setNewCatForm({...newCatForm, label:e.target.value})} placeholder="名稱" className="flex-1 bg-slate-900 border border-slate-600 rounded p-1.5 text-xs text-slate-200" />
                                            <button onClick={() => {
                                                if(!newCatForm.id || !newCatForm.label) return;
                                                const newGroups = [...categoryGroups];
                                                newGroups[idx].items.push({ id: newCatForm.id, label: newCatForm.label, type: 'frontline' }); // Default type
                                                handleSaveCategories(newGroups);
                                                setNewCatForm({ groupIdx: 0, label: '', id: '' });
                                            }} className="bg-slate-700 text-slate-300 px-3 rounded text-xs hover:bg-slate-600">+</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )}
            
            {showTaskTypeModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg p-6 animate-in zoom-in-95 duration-200 border border-slate-800 max-h-[80vh] overflow-y-auto custom-scrollbar">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-slate-100">管理工作類型</h3><button onClick={() => setShowTaskTypeModal(false)} className="text-slate-400 hover:text-slate-200"><Icons.X /></button></div>
                        
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6">
                            <h4 className="font-bold text-slate-300 text-sm mb-3">新增類型</h4>
                            <div className="grid grid-cols-2 gap-3 mb-3">
                                <input value={newTaskForm.id} onChange={e=>setNewTaskForm({...newTaskForm, id:e.target.value})} placeholder="ID (如: meeting)" className="bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-200 outline-none" />
                                <input value={newTaskForm.label} onChange={e=>setNewTaskForm({...newTaskForm, label:e.target.value})} placeholder="名稱 (如: 會議)" className="bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-200 outline-none" />
                            </div>
                            <div className="grid grid-cols-2 gap-3 mb-3">
                                <input value={newTaskForm.color} onChange={e=>setNewTaskForm({...newTaskForm, color:e.target.value})} placeholder="Tailwind Color (如: bg-red-500 text-white)" className="bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-200 outline-none" />
                                <select value={newTaskForm.targetCategory} onChange={e=>setNewTaskForm({...newTaskForm, targetCategory:e.target.value})} className="bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-200 outline-none">
                                    <option value="">(無連動)</option>
                                    {categories.map(c => <option key={c.id} value={c.id}>連動到: {c.label}</option>)}
                                </select>
                            </div>
                            <button onClick={() => {
                                if(!newTaskForm.id || !newTaskForm.label) return;
                                const newTypes = [...taskTypes, newTaskForm];
                                handleSaveTaskTypes(newTypes);
                                setNewTaskForm({ id: '', label: '', color: 'bg-indigo-600 text-indigo-50 shadow-sm', targetCategory: '' });
                            }} className="w-full bg-indigo-600 text-white py-2 rounded font-bold hover:bg-indigo-700">新增</button>
                        </div>

                        <div className="space-y-2">
                            {taskTypes.map(task => (
                                <div key={task.id} className="flex justify-between items-center bg-slate-800 p-3 rounded border border-slate-700">
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <span className={`text-[10px] px-2 py-0.5 rounded ${task.color}`}>{task.label}</span>
                                            <span className="text-xs text-slate-500">ID: {task.id}</span>
                                        </div>
                                        {task.targetCategory && <div className="text-[10px] text-emerald-400 mt-1">連動 ➔ {categories.find(c=>c.id===task.targetCategory)?.label || task.targetCategory}</div>}
                                    </div>
                                    <button onClick={() => {
                                        if(!confirm('刪除？')) return;
                                        const newTypes = taskTypes.filter(t => t.id !== task.id);
                                        handleSaveTaskTypes(newTypes);
                                    }} className="text-slate-500 hover:text-rose-500"><Icons.Trash /></button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )}
            
            {showDeleteModal && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div className="bg-slate-900 rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-in zoom-in-95 border border-slate-800">
                  <h3 className="font-bold text-lg text-slate-100 mb-2">確認刪除?</h3>
                  <p className="text-slate-400 text-sm mb-6">此動作無法復原，請確認是否要移除此項目。</p>
                  <div className="flex gap-3"><button onClick={() => setShowDeleteModal(false)} className="flex-1 py-2.5 rounded-xl font-bold text-slate-400 hover:bg-slate-800">取消</button><button onClick={handleRemovePerson} className="flex-1 py-2.5 rounded-xl font-bold bg-rose-600 text-white hover:bg-rose-700 shadow-lg shadow-rose-900/50">刪除</button></div>
                </div>
              </div>
            )}
         </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
