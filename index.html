    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .dragging { opacity: 0.5; }

      UserIcon: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

    // --- Defaults ---
    const DEFAULT_CATEGORY_GROUPS = [
        { name: '管理', items: [{ id: 'supervisor', label: '主管', type: 'admin' }, { id: 'leader', label: '組長', type: 'admin' }] },
        { name: '專項', items: [{ id: 'marketing', label: '社群', type: 'admin' }, { id: 'content', label: '內容', type: 'admin' }, { id: 'instructor', label: '講師', type: 'teaching' }, { id: 'captain', label: '隊長', type: 'frontline' }, { id: 'innovation', label: '創新', type: 'admin' }]},
        { name: '專案', items: [{ id: 'bootcamp', label: '線條訓練營', type: 'frontline' }, { id: 'camp_color', label: '色彩訓練營', type: 'frontline' }, { id: 'sketch', label: '速寫團練', type: 'frontline' }, { id: 'monthly', label: '月月繪', type: 'frontline' }]},

    const DEFAULT_TASK_TYPES = [
        { id: 'persp_group', label: '透視群', color: 'bg-blue-600 text-blue-50 shadow-sm shadow-blue-900/50', targetCategory: 'regular' },

        { id: 'comp_group', label: '構成群', color: 'bg-amber-600 text-amber-50 shadow-sm shadow-amber-900/50', targetCategory: 'reg_comp' },

        { id: 'line_camp', label: '線條營', color: 'bg-emerald-600 text-emerald-50 shadow-sm shadow-emerald-900/50', targetCategory: 'bootcamp' },
        { id: 'color_camp', label: '色彩營', color: 'bg-purple-600 text-purple-50 shadow-sm shadow-purple-900/50', targetCategory: 'camp_color' },
        { id: 'monthly_paint', label: '月月繪', color: 'bg-cyan-600 text-cyan-50 shadow-sm shadow-cyan-900/50', targetCategory: 'monthly' },
        { id: 'leave', label: '休假', color: 'bg-rose-600 text-rose-50 shadow-sm shadow-rose-900/50', targetCategory: null }, 
    ];

    const COURSE_TYPES = [
        { label: '透視', value: 'regular', days: 70 },
        { label: '構成', value: 'regular', days: 70 },
        { label: '色彩', value: 'regular', days: 70 },
        { label: '線條訓練營', value: 'camp30', days: 49 },
        { label: '色彩訓練營', value: 'camp30', days: 49 },
        { label: '速寫團練', value: 'sketch', days: 60 },
    ];

    // --- Components ---
    const KPICard = ({ title, value, icon, color }) => (
        <div className="bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-800 flex items-center gap-4 hover:scale-[1.02] transition-transform">
            <div className={`p-3 rounded-lg ${color}`}>{icon}</div>
            <div>
                <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">{title}</div>
                <div className="text-2xl font-black text-white">{value}</div>
            </div>
        </div>
    );

    const CourseRow = ({ course, onUpdate, onDelete, isEditingAllowed }) => (
        <tr className="border-b border-slate-800 last:border-0 hover:bg-slate-800/50 transition-colors">
            <td className="p-3 font-bold text-slate-200">{course.name}</td>
            <td className="p-3 text-slate-400">{course.batch || '-'}</td>
            <td className="p-3"><input type="date" value={course.startDate} disabled={!isEditingAllowed} onChange={e => onUpdate(course.id, 'startDate', e.target.value)} className="bg-transparent border-b border-dashed border-slate-600 focus:border-indigo-400 outline-none w-28 text-sm text-slate-300 disabled:opacity-50 disabled:border-transparent" /></td>
            <td className="p-3"><input type="number" value={course.duration} disabled={!isEditingAllowed} onChange={e => onUpdate(course.id, 'duration', e.target.value)} className="bg-transparent border-b border-dashed border-slate-600 focus:border-indigo-400 outline-none w-12 text-center text-sm text-slate-300 disabled:opacity-50 disabled:border-transparent" /></td>
            <td className="p-3"><input type="date" value={course.endDate} disabled={!isEditingAllowed} onChange={e => onUpdate(course.id, 'endDate', e.target.value)} className="bg-transparent border-b border-dashed border-slate-600 focus:border-indigo-400 outline-none w-28 text-sm text-slate-300 disabled:opacity-50 disabled:border-transparent" /></td>
            <td className="p-3"><input type="number" value={course.students} disabled={!isEditingAllowed} onChange={e => onUpdate(course.id, 'students', parseInt(e.target.value) || 0)} className="bg-transparent font-bold text-indigo-400 border-b border-dashed border-indigo-900 focus:border-indigo-400 outline-none w-16 text-center disabled:opacity-50 disabled:border-transparent" /></td>
            <td className="p-3 text-right">
                {isEditingAllowed && <button onClick={() => onDelete(course.id)} className="text-slate-500 hover:text-rose-500 p-1"><Icons.Trash /></button>}
            </td>
        </tr>
    );

    const TimelineView = ({ masterCourses }) => {
        const [year, setYear] = useState(new Date().getFullYear());
        const months = Array.from({length: 12}, (_, i) => i + 1);
        const getCourseColor = (type) => {
            if (type === 'regular') return 'bg-blue-600 text-white';
            if (type === 'sketch') return 'bg-orange-600 text-white';
            if (type === 'camp30') return 'bg-emerald-600 text-white';
            return 'bg-slate-600 text-white';
        };
        return (
            <div className="bg-slate-900 rounded-xl shadow-sm border border-slate-800 p-4 overflow-x-auto fade-in">
                <div className="min-w-[800px]">
                    <div className="flex items-center justify-between mb-4 px-2">
                        <button onClick={() => setYear(y => y - 1)} className="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white"><Icons.ChevronLeft /></button>
                        <h2 className="text-lg font-bold text-slate-100">{year} 年課程時間軸</h2>
                        <button onClick={() => setYear(y => y + 1)} className="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white"><Icons.ChevronRight /></button>
                    </div>
                    <div className="flex border-b border-slate-800 pb-2 mb-2 sticky top-0 bg-slate-900 z-10">
                        {months.map(m => (<div key={m} className="flex-1 text-center text-xs font-bold text-slate-400 border-r border-slate-800 last:border-0">{m}月</div>))}
                    </div>
                    <div className="space-y-3 relative h-[500px] overflow-y-auto">
                        <div className="absolute inset-0 flex pointer-events-none z-0">{months.map(m => <div key={m} className="flex-1 border-r border-slate-800 last:border-0 h-full"></div>)}</div>
                        {masterCourses.length === 0 && <div className="text-center text-slate-600 py-10">尚無課程資料</div>}
                        {masterCourses.sort((a,b) => new Date(a.startDate) - new Date(b.startDate)).map(course => {
                            if (!course.startDate || !course.endDate) return null;
                            const start = new Date(course.startDate);
                            const end = new Date(course.endDate);
                            if (start.getFullYear() !== year && end.getFullYear() !== year) return null;
                            const yearStart = new Date(year, 0, 1).getTime();
                            const yearEnd = new Date(year, 11, 31).getTime();
                            const duration = yearEnd - yearStart;
                            const cStart = Math.max(start.getTime(), yearStart);
                            const cEnd = Math.min(end.getTime(), yearEnd);
                            if (cEnd < cStart) return null;
                            const left = ((cStart - yearStart) / duration) * 100;
                            const width = ((cEnd - cStart) / duration) * 100;
                            return (
                                <div key={course.id} className="relative h-8 z-10 hover:z-20 group">
                                    <div className={`absolute h-6 rounded-md shadow-sm text-[10px] flex items-center px-2 cursor-pointer transition-all hover:scale-105 ${getCourseColor(course.type)}`} style={{ left: `${left}%`, width: `${width}%`, minWidth: '40px' }} title={course.name}>
                                        <span className="truncate font-bold">{course.name} {course.batch && `(${course.batch})`}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    };

    const WorkScheduleView = ({ personnel, categoryGroups, attendanceData, onUpdateAttendance, onBatchUpdate, taskTypes, setShowTaskTypeModal, wsSearchTerm, setWsSearchTerm, dailyStats, wsShowBatchModal, setWsShowBatchModal, wsBatchForm, setWsBatchForm, isEditingAllowed }) => {
        const [selectedMonth, setSelectedMonth] = useState(new Date());
        const [viewMode, setViewMode] = useState('week'); 
        const [expandedGroups, setExpandedGroups] = useState({});
        const [popover, setPopover] = useState(null);
        const [popoverContext, setPopoverContext] = useState("");
        
        useEffect(() => {
           if (Object.keys(expandedGroups).length === 0 && categoryGroups.length > 0) {
               setExpandedGroups(categoryGroups.reduce((acc, g) => ({...acc, [g.name]: true}), {}));
           }
        }, [categoryGroups]);

        const daysInMonth = new Date(selectedMonth.getFullYear(), selectedMonth.getMonth() + 1, 0).getDate();
        const days = Array.from({length: daysInMonth}, (_, i) => i + 1);

        const datesToShow = useMemo(() => {
            if (viewMode === 'month') {
                const year = selectedMonth.getFullYear();
                const month = selectedMonth.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                return Array.from({length: daysInMonth}, (_, i) => new Date(year, month, i + 1));
            } else {
                const start = new Date(selectedMonth);
                const day = start.getDay();
                start.setDate(start.getDate() - day); 
                return Array.from({length: 7}, (_, i) => {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    return d;
                });
            }
        }, [viewMode, selectedMonth]);

        const title = viewMode === 'month' 
           ? `${selectedMonth.getFullYear()}年 ${selectedMonth.getMonth()+1}月`
           : `${datesToShow[0].getMonth()+1}/${datesToShow[0].getDate()} - ${datesToShow[6].getMonth()+1}/${datesToShow[6].getDate()}`;

        const filteredGroups = categoryGroups.map(g => {
            const filteredItems = g.items.map(cat => ({
                ...cat,
                people: (personnel[cat.id] || []).filter(p => p.name.includes(wsSearchTerm))
            })).filter(cat => cat.people.length > 0);
            return { ...g, items: filteredItems };
        }).filter(g => g.items.length > 0);
        
        const handleNavigate = (dir) => {
           const d = new Date(selectedMonth);
           if(viewMode === 'month') d.setMonth(d.getMonth() + dir);
           else d.setDate(d.getDate() + dir * 7);
           setSelectedMonth(d);
        };

        const handleCellClick = (e, empId, dateStr, context) => {
            if (!isEditingAllowed) return; // Restrict editing
            const rect = e.target.getBoundingClientRect();
            setPopover({ empId, dateStr, x: rect.left, y: rect.bottom + window.scrollY });
            setPopoverContext(context || "");
        };

        const handleSaveCell = (status) => {
           if (popover) {
              onUpdateAttendance(popover.empId, popover.dateStr, status, popoverContext);
              setPopover(null);
              setPopoverContext("");
           }
        };
        
        const handleBatchSubmit = () => {
           if (!wsBatchForm.personId) return;
           const start = new Date(wsBatchForm.startDate);
           const end = new Date(wsBatchForm.endDate);
           const records = [];
           for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                records.push({
                    employee_id: wsBatchForm.personId,
                    date: d.toISOString().split('T')[0],
                    status: wsBatchForm.type,
                    context: wsBatchForm.context
                });
           }
           onBatchUpdate(records);
           setWsShowBatchModal(false);
        };

        return (
            <div className="fade-in space-y-4 pb-20">
                <div className="bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-800 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div className="flex items-center gap-4">
                        <button onClick={() => handleNavigate(-1)} className="p-2 hover:bg-slate-800 rounded-full text-slate-300"><Icons.ChevronLeft /></button>
                        <div className="text-lg font-bold text-slate-100 min-w-[120px] text-center">{title}</div>
                        <button onClick={() => handleNavigate(1)} className="p-2 hover:bg-slate-800 rounded-full text-slate-300"><Icons.ChevronRight /></button>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={() => setViewMode('week')} className={`px-3 py-1.5 text-xs font-bold rounded-lg border ${viewMode === 'week' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>週檢視</button>
                        <button onClick={() => setViewMode('month')} className={`px-3 py-1.5 text-xs font-bold rounded-lg border ${viewMode === 'month' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>月檢視</button>
                    </div>
                    <div className="flex items-center gap-4">
                         {isEditingAllowed && <button onClick={() => setShowTaskTypeModal(true)} className="text-xs text-indigo-400 hover:text-indigo-300 font-bold border border-indigo-900 px-2 py-1 rounded">⚙️ 設定</button>}
                         {isEditingAllowed && <button onClick={() => setWsShowBatchModal(true)} className="flex items-center gap-2 bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-700 shadow-md"><Icons.Plus /> 新增紀錄</button>}
                         <div className="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700"><Icons.Search /><input className="bg-transparent border-none outline-none text-sm w-32 text-slate-200" placeholder="搜尋姓名..." value={wsSearchTerm} onChange={e => setWsSearchTerm(e.target.value)} /></div>
                         <div className="flex gap-4 text-xs font-medium text-slate-400">
                             <span>今日工作: <span className="text-blue-400 font-bold">{dailyStats.workingToday}</span></span>
                             <span>休假: <span className="text-rose-400 font-bold">{dailyStats.leaveToday}</span></span>
                         </div>
                    </div>
                </div>

                <div className={`bg-slate-900 rounded-xl shadow-sm border border-slate-800 overflow-hidden relative ${viewMode === 'month' ? 'view-month' : ''}`}>
                    <div className="overflow-x-auto">
                        <table className="w-full text-xs border-collapse table-fixed">
                            <thead>
                                <tr>
                                    <th className="sticky left-0 bg-slate-900 z-20 border-b border-r border-slate-800 p-3 w-[150px] text-left font-bold text-slate-300">人員</th>
                                    {datesToShow.map(d => {
                                        const dayName = ['日','一','二','三','四','五','六'][d.getDay()];
                                        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                                        return (
                                            <th key={d.toISOString()} className={`border-b border-r border-slate-800 p-1 text-center font-medium ${isWeekend ? 'bg-slate-800/50 text-rose-300' : 'text-slate-400'}`} style={{width: viewMode==='week' ? '12%' : '36px'}}>
                                                <div className="text-[10px]">{d.getMonth()+1}/{d.getDate()}</div>
                                                <div className="text-[9px]">({dayName})</div>
                                            </th>
                                        );
                                    })}
                                </tr>
                            </thead>
                            <tbody>
                                {filteredGroups.map(group => (
                                    <React.Fragment key={group.name}>
                                        <tr className="bg-slate-800/50 cursor-pointer hover:bg-slate-800" onClick={() => setExpandedGroups(prev => ({...prev, [group.name]: !prev[group.name]}))}>
                                            <td className="sticky left-0 bg-slate-900 z-10 border-b border-r border-slate-800 p-2 font-bold text-indigo-400 pl-4 flex items-center gap-2" colSpan={datesToShow.length + 1}>{expandedGroups[group.name] ? <Icons.ChevronDown/> : <Icons.ChevronUp/>} {group.name}</td>
                                        </tr>
                                        {expandedGroups[group.name] && group.items.map(cat => (
                                            cat.people.map(p => (
                                                <tr key={p.id} className="hover:bg-slate-800/30 transition-colors">
                                                    <td className="sticky left-0 bg-slate-900 z-10 border-b border-r border-slate-800 p-2 pl-6 font-medium text-slate-300 shadow-sm"><div className="flex items-center justify-between"><span>{p.name}</span><span className="text-[9px] text-slate-400 bg-slate-800 px-1 rounded border border-slate-700">[{cat.label}]</span></div></td>
                                                    {datesToShow.map(d => {
                                                        const dateStr = d.toISOString().split('T')[0];
                                                        const record = attendanceData[p.id]?.[dateStr];
                                                        const statusConfig = taskTypes.find(t => t.id === record?.status);
                                                        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                                                        return (
                                                            <td key={dateStr} onClick={(e) => handleCellClick(e, p.id, dateStr, record?.context)} className={`border-b border-r border-slate-800 text-center attendance-cell relative ${isWeekend ? 'bg-slate-800/30' : ''} ${isEditingAllowed ? 'cursor-pointer' : 'cursor-default'}`}>
                                                                {statusConfig ? (
                                                                    <div className={`task-block ${statusConfig.color}`} data-tooltip={`${statusConfig.label} ${record.context ? '- '+record.context : ''}`}>
                                                                        {viewMode === 'week' ? (record.context || statusConfig.label) : (record.context ? record.context.substring(0,2) : statusConfig.label.substring(0,1))}
                                                                    </div>
                                                                ) : <div className="w-full h-full opacity-0 hover:opacity-100 text-slate-600 text-[10px] flex items-center justify-center">+</div>}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))
                                        ))}
                                    </React.Fragment>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    
                    {/* Popover */}
                    {popover && isEditingAllowed && (
                        <div className="fixed z-50 bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-3 w-48 animate-in zoom-in-95 duration-100 flex flex-col gap-2" style={{ top: popover.y + 5, left: Math.min(popover.x - 60, window.innerWidth - 200) }}>
                            <input type="text" placeholder="工作內容..." className="w-full text-xs bg-slate-900 border border-slate-700 rounded p-1.5 mb-1 outline-none focus:border-indigo-500 text-slate-200" autoFocus value={popoverContext} onChange={e => setPopoverContext(e.target.value)} />
                            <div className="grid grid-cols-2 gap-1.5">{taskTypes.map(type => (<button key={type.id} onClick={() => handleSaveCell(type.id)} className={`text-[10px] px-2 py-1.5 rounded text-center font-bold shadow-sm ${type.color} opacity-90 hover:opacity-100`}>{type.label}</button>))}</div>
                            <div className="h-px bg-slate-700 my-1"></div>
                            <button onClick={() => handleSaveCell(null)} className="text-xs px-2 py-1.5 rounded text-center font-medium text-slate-400 hover:bg-slate-700 w-full">清除紀錄</button>
                            <div className="fixed inset-0 z-[-1]" onClick={() => setPopover(null)}></div>
                        </div>
                    )}
                </div>
                
                {/* Batch Modal */}
                {wsShowBatchModal && isEditingAllowed && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                        <div className="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-md p-6 animate-in zoom-in-95 border border-slate-800">
                            <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-slate-100">新增紀錄</h3><button onClick={() => setWsShowBatchModal(false)} className="text-slate-400 hover:text-slate-200"><Icons.X /></button></div>
                            <div className="space-y-4">
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">人員</label><select className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200" value={wsBatchForm.personId} onChange={e => setWsBatchForm({...wsBatchForm, personId: e.target.value})}><option value="">請選擇...</option>{categoryGroups.map(g => (<optgroup key={g.name} label={g.name}>{g.items.map(cat => personnel[cat.id]?.map(p => <option key={p.id} value={p.id}>{p.name} ({cat.label})</option>))}</optgroup>))}</select></div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="block text-xs font-bold text-slate-400 mb-1">開始</label><input type="date" className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200" value={wsBatchForm.startDate} onChange={e => setWsBatchForm({...wsBatchForm, startDate: e.target.value})} /></div>
                                    <div><label className="block text-xs font-bold text-slate-400 mb-1">結束</label><input type="date" className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200" value={wsBatchForm.endDate} onChange={e => setWsBatchForm({...wsBatchForm, endDate: e.target.value})} /></div>
                                </div>
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">類型</label><div className="flex flex-wrap gap-2">{taskTypes.map(t => (<button key={t.id} onClick={() => setWsBatchForm({...wsBatchForm, type: t.id})} className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors shadow-sm ${wsBatchForm.type === t.id ? 'ring-2 ring-offset-1 ring-slate-400' : 'opacity-80 border-transparent'} ${t.color}`}>{t.label}</button>))}</div></div>
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">內容/備註</label><input type="text" className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200" placeholder="S1助教、備課..." value={wsBatchForm.context} onChange={e => setWsBatchForm({...wsBatchForm, context: e.target.value})} /></div>
                                <button onClick={handleBatchSubmit} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-lg mt-2 transition-colors">確認</button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const AnalyticsView = ({ personnel, attendanceData, taskTypes, categoryGroups }) => {
        const [activeTab, setActiveTab] = useState('overview'); // 'overview' | 'gantt' | 'personal'
        const [selectedMonth, setSelectedMonth] = useState(() => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        });
        const [selectedPersonId, setSelectedPersonId] = useState("");

        const flatCategories = useMemo(() => categoryGroups.flatMap(g => g.items), [categoryGroups]);

        const allPersonnelList = useMemo(() => {
            let list = [];
            Object.entries(personnel).forEach(([catId, arr]) => {
                arr.forEach(p => {
                    list.push({ ...p, categoryId: catId });
                });
            });
            return list;
        }, [personnel]);

        const analytics = useMemo(() => {
            if (!selectedMonth) return null;
            const [year, month] = selectedMonth.split('-').map(Number);
            
            let weekdays = 0;
            const daysInMonth = new Date(year, month, 0).getDate();
            const daysArray = Array.from({length: daysInMonth}, (_, i) => i + 1);

            for (let i = 1; i <= daysInMonth; i++) {
                const day = new Date(year, month - 1, i).getDay();
                if (day !== 0 && day !== 6) weekdays++;
            }

            const stats = [];
            const globalTaskCounts = {};
            let totalGlobalTasks = 0;

            allPersonnelList.forEach(p => {
                let workDays = 0;
                let leaveDays = 0;
                const personalTaskCounts = {};

                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const record = attendanceData[p.id]?.[dateStr];
                    
                    if (record && record.status) {
                        const isLeave = record.status === 'leave';
                        if (isLeave) {
                            leaveDays++;
                        } else {
                            workDays++;
                        }
                        personalTaskCounts[record.status] = (personalTaskCounts[record.status] || 0) + 1;
                        globalTaskCounts[record.status] = (globalTaskCounts[record.status] || 0) + 1;
                        totalGlobalTasks++;
                    }
                }

                stats.push({
                    ...p,
                    workDays,
                    leaveDays,
                    idleDays: Math.max(0, weekdays - workDays - leaveDays),
                    personalTaskCounts,
                    totalPersonalTasks: workDays + leaveDays
                });
            });

            const topActive = [...stats].sort((a, b) => b.workDays - a.workDays).slice(0, 5);
            const topIdle = [...stats].sort((a, b) => b.idleDays - a.idleDays);

            return { year, month, daysArray, weekdays, globalTaskCounts, totalGlobalTasks, stats, topActive, topIdle };
        }, [selectedMonth, allPersonnelList, attendanceData]);

        if (!analytics) return null;

        const selectedPersonStat = selectedPersonId ? analytics.stats.find(p => p.id === selectedPersonId) : null;
        
        let workloadRate = "-";
        let mostFrequentTask = "-";
        let idleDays = "-";
        let displayTaskCounts = analytics.globalTaskCounts;
        let totalForBar = analytics.totalGlobalTasks;
        let summaryTitle = "整體工作總結 (任務分佈)";

        if (selectedPersonStat) {
            const wDays = selectedPersonStat.workDays;
            workloadRate = analytics.weekdays > 0 ? Math.round((wDays / analytics.weekdays) * 100) : 0;
            idleDays = selectedPersonStat.idleDays;
            
            const tasks = Object.entries(selectedPersonStat.personalTaskCounts)
                                .filter(([taskId]) => taskId !== 'leave') 
                                .sort((a,b) => b[1] - a[1]);
            if (tasks.length > 0) {
                const tConfig = taskTypes.find(t => t.id === tasks[0][0]);
                mostFrequentTask = tConfig ? tConfig.label : tasks[0][0];
            } else {
                mostFrequentTask = "無排班";
            }

            displayTaskCounts = selectedPersonStat.personalTaskCounts;
            totalForBar = selectedPersonStat.totalPersonalTasks;
            summaryTitle = `${selectedPersonStat.name} 的工作總結 (任務分佈)`;
        }

        return (
            <div className="fade-in space-y-6 pb-20 max-w-6xl mx-auto">
                <div className="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-sm flex-wrap gap-4">
                    <div className="flex items-center gap-3">
                        <div className="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg"><Icons.BarChart /></div>
                        <h2 className="text-xl font-black text-slate-100">數據分析中心</h2>
                    </div>
                    <div className="flex items-center gap-4 flex-wrap">
                        <div className="flex items-center gap-2">
                            <span className="text-xs font-bold text-slate-400">分析成員:</span>
                            <select 
                                value={selectedPersonId} 
                                onChange={e => {
                                    setSelectedPersonId(e.target.value);
                                    if(e.target.value && activeTab !== 'personal') setActiveTab('personal');
                                }} 
                                className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 outline-none focus:border-indigo-500 transition-colors"
                            >
                                <option value="">-- 整體概況 (未指定) --</option>
                                {allPersonnelList.map(p => (
                                    <option key={p.id} value={p.id}>{p.name}</option>
                                ))}
                            </select>
                        </div>
                        <div className="flex items-center gap-2 border-l border-slate-700 pl-4">
                            <span className="text-xs font-bold text-slate-400">月份:</span>
                            <input 
                                type="month" 
                                value={selectedMonth} 
                                onChange={e => setSelectedMonth(e.target.value)} 
                                className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 outline-none focus:border-indigo-500 transition-colors"
                            />
                        </div>
                    </div>
                </div>

                {/* Sub-tab Navigation */}
                <div className="flex gap-4 border-b border-slate-800 pb-px mt-2">
                    <button onClick={()=>setActiveTab('overview')} className={`pb-2 text-sm font-bold border-b-2 transition-colors ${activeTab === 'overview' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>總覽數據</button>
                    <button onClick={()=>setActiveTab('gantt')} className={`pb-2 text-sm font-bold border-b-2 transition-colors ${activeTab === 'gantt' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>所有成員甘特圖</button>
                    <button onClick={()=>setActiveTab('personal')} className={`pb-2 text-sm font-bold border-b-2 transition-colors ${activeTab === 'personal' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>單一成員統計圖</button>
                </div>

                {/* Tab 1: Overview */}
                {activeTab === 'overview' && (
                    <div className="space-y-6 fade-in">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-sm flex flex-col justify-center items-center hover:border-slate-700 transition-colors">
                                <span className="text-xs text-slate-400 font-bold mb-1">本月總工作排班</span>
                                <span className="text-4xl font-black text-blue-400">{analytics.totalGlobalTasks} <span className="text-sm text-blue-500/50"> 人次</span></span>
                            </div>
                            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-sm flex flex-col justify-center items-center hover:border-slate-700 transition-colors text-center">
                                <span className="text-xs text-slate-400 font-bold mb-1">本月總休假</span>
                                <span className="text-rose-400 text-4xl font-black mt-2">
                                    {Object.values(analytics.stats).reduce((a, b) => a + b.leaveDays, 0)}
                                    <span className="text-sm text-rose-500/50 font-normal"> 人次</span>
                                </span>
                            </div>
                            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-sm flex flex-col justify-center items-center hover:border-slate-700 transition-colors">
                                <span className="text-xs text-slate-400 font-bold mb-1">平均閒置天數 (基準:{analytics.weekdays}天)</span>
                                <span className="text-4xl font-black text-amber-400">
                                    {analytics.stats.length ? (analytics.stats.reduce((acc, curr) => acc + curr.idleDays, 0) / analytics.stats.length).toFixed(1) : 0} 
                                    <span className="text-sm text-amber-500/50"> 天/人</span>
                                </span>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-sm">
                                <h3 className="font-bold text-slate-200 mb-6 flex items-center gap-2">
                                    <span className="w-1.5 h-5 bg-blue-500 rounded-full"></span>整體工作總結 (任務分佈)
                                </h3>
                                <div className="space-y-4">
                                    {Object.entries(analytics.globalTaskCounts).sort((a,b)=>b[1]-a[1]).map(([taskId, count]) => {
                                        const task = taskTypes.find(t => t.id === taskId);
                                        const label = task ? task.label : taskId;
                                        const colorClass = task ? task.color.split(' ')[0] : 'bg-slate-600'; 
                                        const percentage = totalForBar > 0 ? Math.round((count / analytics.totalGlobalTasks) * 100) : 0;
                                        return (
                                            <div key={taskId} className="group">
                                                <div className="flex justify-between text-xs mb-1.5">
                                                    <span className="text-slate-300 font-bold">{label}</span>
                                                    <span className="text-slate-400 font-mono">{count} 次 <span className="text-slate-500">({percentage}%)</span></span>
                                                </div>
                                                <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden flex">
                                                    <div className={`h-full rounded-full transition-all duration-500 ease-out group-hover:brightness-110 ${colorClass}`} style={{ width: `${percentage}%` }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    {Object.keys(analytics.globalTaskCounts).length === 0 && <div className="text-slate-500 text-sm text-center py-8 border border-dashed border-slate-700 rounded-lg">本月尚無任務紀錄</div>}
                                </div>
                            </div>

                            <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-sm">
                                <h3 className="font-bold text-slate-200 mb-6 flex items-center gap-2">
                                    <span className="w-1.5 h-5 bg-emerald-500 rounded-full"></span>人員效率 (最高排班 Top 5)
                                </h3>
                                <div className="space-y-3">
                                    {analytics.topActive.filter(p => p.workDays > 0).map((p, idx) => (
                                        <div key={p.id} className="flex items-center justify-between bg-slate-800/50 p-3.5 rounded-xl border border-slate-700/50 hover:bg-slate-800 transition-colors">
                                            <div className="flex items-center gap-4">
                                                <div className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-black shadow-inner ${idx === 0 ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : idx === 1 ? 'bg-slate-300/20 text-slate-300 border border-slate-300/30' : idx === 2 ? 'bg-orange-700/20 text-orange-400 border border-orange-700/30' : 'bg-slate-800 text-slate-500 border border-slate-700'}`}>
                                                    {idx + 1}
                                                </div>
                                                <div className="flex flex-col">
                                                    <span className="text-sm font-bold text-slate-200">{p.name}</span>
                                                    <span className="text-[10px] text-slate-500">{flatCategories.find(c => c.id === p.categoryId)?.label || '未知職位'}</span>
                                                </div>
                                            </div>
                                            <div className="flex flex-col items-end">
                                                <span className="text-blue-400 font-black text-lg leading-none">{p.workDays} <span className="text-[10px] text-slate-500 font-normal">天</span></span>
                                            </div>
                                        </div>
                                    ))}
                                    {analytics.topActive.filter(p => p.workDays > 0).length === 0 && <div className="text-slate-500 text-sm text-center py-8 border border-dashed border-slate-700 rounded-lg">無排班資料</div>}
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-xl border border-slate-800 shadow-sm overflow-hidden">
                            <div className="p-6 border-b border-slate-800">
                                <h3 className="font-bold text-slate-200 mb-2 flex items-center gap-2">
                                    <span className="w-1.5 h-5 bg-amber-500 rounded-full"></span>安排空窗期 (本月閒置人員名單)
                                </h3>
                                <p className="text-xs text-slate-400">根據本月平日基準 ({analytics.weekdays}天) 計算。優先顯示空窗天數最多的人員，方便您快速安排下一個專案任務。</p>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-800/80 text-slate-400 text-xs uppercase tracking-wider">
                                        <tr>
                                            <th className="px-6 py-3 font-medium">人員姓名</th>
                                            <th className="px-6 py-3 font-medium">所屬職位</th>
                                            <th className="px-6 py-3 font-medium text-center">排班天數</th>
                                            <th className="px-6 py-3 font-medium text-center">休假天數</th>

                      newPersonnel[targetCatId] = [...newPersonnel[targetCatId], personObj];
