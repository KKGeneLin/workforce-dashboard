<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>人力需求測算儀表板 (Supabase版)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 引入 Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dragging { opacity: 0.5; }
    .header-transition { transition: all 0.3s ease-in-out; }
    .stats-container {
      transition: max-height 0.3s ease-in-out, opacity 0.2s ease-in-out, margin 0.3s ease-in-out;
      overflow: hidden;
    }
    .stats-visible {
      max-height: 500px;
      opacity: 1;
      margin-bottom: 1.5rem;
    }
    .stats-hidden {
      max-height: 0;
      opacity: 0;
      margin-bottom: 0;
    }
    /* Timeline Styles */
    .timeline-grid {
      background-image: linear-gradient(to right, #f3f4f6 1px, transparent 1px);
      background-size: 8.33% 100%; /* 100% / 12 months */
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useMemo, useEffect } = React;

    // --- Supabase 配置 (使用您提供的設定) ---
    const SUPABASE_URL = 'https://vbhnboegowulvgckjlyg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8fAfsHCXZ45iJY6_t4rTLQ_uvJ6Izb2'; // 請確認此 Key 是否正確，通常是 eyJ 開頭
    // 初始化 Client
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const generateId = () => Math.random().toString(36).substr(2, 9);

    const COURSE_TYPES = [
        { label: '透視', value: 'regular', days: 70 },
        { label: '構成', value: 'regular', days: 70 },
        { label: '色彩', value: 'regular', days: 70 },
        { label: '線條訓練營', value: 'camp30', days: 49 },
        { label: '色彩訓練營', value: 'camp30', days: 49 },
        { label: '速寫團練', value: 'sketch', days: 60 },
    ];

    const App = () => {
      // --- State ---
      const [loading, setLoading] = useState(true);
      const [syncStatus, setSyncStatus] = useState('連線中...');
      
      const [currentView, setCurrentView] = useState('dashboard'); // 'dashboard' | 'timeline' | 'personnel'
      const [addingToCategory, setAddingToCategory] = useState(null);
      const [tempName, setTempName] = useState('');
      const [showDeleteModal, setShowDeleteModal] = useState(false);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [collapsedMonths, setCollapsedMonths] = useState({});
      const [isPersonnelCollapsed, setIsPersonnelCollapsed] = useState(false);
      const [isMasterCollapsed, setIsMasterCollapsed] = useState(false);
      const [isScrolled, setIsScrolled] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const [settings, setSettings] = useState({});
      const [masterCourses, setMasterCourses] = useState([]);
      const [schedule, setSchedule] = useState([]);
      const [draggedItem, setDraggedItem] = useState(null);
      const [dragOverContainer, setDragOverContainer] = useState(null);

      // --- 人員分類定義 (含群組與排序 - 保留 v29 的優化結構) ---
      const categoryGroups = useMemo(() => [
        {
          name: '管理',
          items: [
            { id: 'supervisor', label: '主管', type: 'admin' }
          ]
        },
        {
          name: '專項',
          items: [
            { id: 'marketing', label: '行銷', type: 'admin' },
            { id: 'content', label: '內容', type: 'admin' },
            { id: 'instructor', label: '講師', type: 'teaching' },
            { id: 'captain', label: '隊長', type: 'frontline' },
            { id: 'innovation', label: '創新', type: 'admin' }
          ]
        },
        {
          name: '專案',
          items: [
            { id: 'bootcamp', label: '透視訓練營', type: 'frontline' }, 
            { id: 'camp_color', label: '色彩訓練營', type: 'frontline' },
            { id: 'sketch', label: '速寫團練', type: 'frontline' },
            { id: 'monthly', label: '月月繪', type: 'frontline' }
          ]
        },
        {
          name: '正課',
          items: [
            { id: 'regular', label: '透視', type: 'frontline' }, 
            { id: 'reg_comp', label: '構成', type: 'frontline' },
            { id: 'reg_color', label: '色彩', type: 'frontline' },
            { id: 'dlc', label: 'DLC', type: 'frontline' }
          ]
        },
        {
          name: '待命',
          items: [
            { id: 'pool', label: '尚未分配', type: 'pool' }
          ]
        }
      ], []);

      // 扁平化 Categories 供邏輯使用
      const categories = useMemo(() => {
          return categoryGroups.flatMap(g => g.items);
      }, [categoryGroups]);

      const [personnel, setPersonnel] = useState(() => {
        const initial = {};
        categories.forEach(c => initial[c.id] = []);
        return initial;
      });

      const [newCourse, setNewCourse] = useState({
          name: '透視',
          type: 'regular',
          batch: '',
          students: 0,
          startDate: '',
          duration: 70,
          endDate: ''
      });

      // --- Effects ---
      
      // 1. 捲動偵測
      useEffect(() => {
        const handleScroll = () => {
            const currentScroll = window.scrollY;
            setIsScrolled(currentScroll > 10);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // 2. 初始化與 Supabase 資料載入
      useEffect(() => {
        const initializeData = async () => {
          try {
            setLoading(true);
            setSyncStatus('正在從雲端加載數據...');
            
            // A. 加載課程數據
            const { data: coursesData, error: coursesError } = await supabase
              .from('courses')
              .select('*');
            
            if (coursesError) throw coursesError;
            
            if (coursesData && coursesData.length > 0) {
              setMasterCourses(coursesData.map(c => ({
                id: c.id,
                name: c.name,
                type: c.type,
                batch: c.batch,
                students: c.students,
                startDate: c.start_date,
                endDate: c.end_date,
                duration: c.duration
              })));
            }

            // B. 加載人員數據
            const { data: personnelData, error: personnelError } = await supabase
              .from('personnel')
              .select('*');
            
            if (personnelError) throw personnelError;
            
            if (personnelData && personnelData.length > 0) {
              const grouped = {};
              categories.forEach(c => grouped[c.id] = []);
              personnelData.forEach(p => {
                if (grouped[p.category_id]) { // 注意: 確保 Supabase 欄位是 category_id
                  grouped[p.category_id].push({ id: p.id, name: p.name });
                } else if (p.category_id && !grouped[p.category_id]) {
                   // 若 Supabase 有舊分類，暫時放入 pool 或忽略，這裡選擇忽略以防錯誤
                }
              });
              // 確保所有分類都存在
              categories.forEach(c => { if(!grouped[c.id]) grouped[c.id] = []; });
              setPersonnel(grouped);
            }

            // C. 加載月度數據 (月月繪)
            const { data: monthlyData, error: monthlyError } = await supabase
              .from('monthly_data')
              .select('*')
              .order('month_index', { ascending: true });
            
            if (monthlyError) throw monthlyError;

            const initialSchedule = Array.from({ length: 12 }, (_, i) => ({
              month: `${i + 1}月`,
              monthly: [{ name: '月月繪', type: 'monthlyActivity', students: monthlyData?.find(m => m.month_index === i)?.students || 0, batch: '常駐' }],
              early: [], mid: [], late: []
            }));
            
            setSchedule(initialSchedule);
            setSyncStatus('✅ 已同步');
            setLoading(false);

          } catch (error) {
            console.error('加載數據失敗:', error);
            setSyncStatus('❌ 同步失敗');
            // 初始化空數據以免畫面全白
            const emptySchedule = Array.from({ length: 12 }, (_, i) => ({
               month: `${i + 1}月`,
               monthly: [{ name: '月月繪', type: 'monthlyActivity', students: 0, batch: '常駐' }],
               early: [], mid: [], late: []
            }));
            setSchedule(emptySchedule);
            setLoading(false);
          }
        };

        initializeData();
      }, []); // 只在掛載時執行一次

      // 3. 排程核心運算 (依日期自動分配 - 本地計算)
      useEffect(() => {
          // 不論是否有課程，都要執行以確保 Schedule 結構正確
          setSchedule(prev => {
              const newSchedule = prev.length > 0 ? JSON.parse(JSON.stringify(prev)) : Array.from({ length: 12 }, (_, i) => ({
                  month: `${i + 1}月`,
                  monthly: [{ name: '月月繪', type: 'monthlyActivity', students: 0, batch: '常駐' }],
                  early: [], mid: [], late: []
              }));

              // 清空自動計算欄位
              newSchedule.forEach(m => { m.early = []; m.mid = []; m.late = []; });

              masterCourses.forEach(course => {
                  if (!course.startDate || !course.endDate) return;
                  const start = new Date(course.startDate);
                  const end = new Date(course.endDate);
                  
                  for (let m = 0; m < 12; m++) {
                      const periods = [
                          { key: 'early', s: 1, e: 10 },
                          { key: 'mid', s: 11, e: 20 },
                          { key: 'late', s: 21, e: 31 }
                      ];

                      periods.forEach(p => {
                          // 使用課程開始日期的年份作為基準
                          const testStart = new Date(start.getFullYear(), m, p.s);
                          const testEnd = new Date(start.getFullYear(), m, p.e);
                          
                          if (start > end) return;
                          
                          // 判斷重疊
                          if (start <= testEnd && end >= testStart) {
                              newSchedule[m][p.key].push({
                                  name: course.name,
                                  type: course.type,
                                  students: course.students,
                                  batch: course.batch
                              });
                          }
                      });
                  }
              });
              return newSchedule;
          });
      }, [masterCourses]);

      // --- Helper Functions (Supabase Save) ---
      
      const savePersonnelData = async (newPersonnel) => {
        setSyncStatus('同步中...');
        try {
          // 策略：刪除所有 -> 重新插入 (適合小型數據集，確保一致性)
          // 注意：需確保 Supabase 沒有設 RLS 或允許匿名寫入，且 ID 欄位不為空
          
          // 1. 準備數據
          const personnelRecords = [];
          Object.entries(newPersonnel).forEach(([categoryId, people]) => {
            people.forEach(person => {
              personnelRecords.push({
                id: person.id,
                category_id: categoryId,
                name: person.name
              });
            });
          });

          // 2. 刪除舊資料 (這裡假設 delete all，若有 RLS 需調整)
          // 為了安全起見，建議 Supabase Table 設有 Policy
          const { error: delError } = await supabase.from('personnel').delete().neq('id', '00000000-0000-0000-0000-000000000000'); 
          if (delError) throw delError;

          // 3. 插入新資料
          if (personnelRecords.length > 0) {
            const { error: insError } = await supabase.from('personnel').insert(personnelRecords);
            if (insError) throw insError;
          }
          
          setSyncStatus('✅ 已同步');
        } catch (error) {
          console.error('保存人員數據失敗:', error);
          setSyncStatus('❌ 保存失敗');
        }
      };

      const saveMasterCourses = async (newCourses, monthlyData) => {
        setSyncStatus('同步中...');
        try {
          // 1. 處理課程
          const courseRecords = newCourses.map(c => ({
            id: c.id,
            name: c.name,
            type: c.type,
            batch: c.batch,
            students: c.students,
            start_date: c.startDate,
            end_date: c.endDate,
            duration: c.duration
          }));

          const { error: delCError } = await supabase.from('courses').delete().neq('id', '00000000-0000-0000-0000-000000000000');
          if (delCError) throw delCError;

          if (courseRecords.length > 0) {
             const { error: insCError } = await supabase.from('courses').insert(courseRecords);
             if (insCError) throw insCError;
          }

          // 2. 處理月度數據
          const monthlyRecords = monthlyData.map((m, idx) => ({
            month_index: idx,
            students: m[0]?.students || 0
          }));
          
          const { error: delMError } = await supabase.from('monthly_data').delete().neq('id', '00000000-0000-0000-0000-000000000000'); // 這裡假設 monthly_data 有 id 欄位，或者可以用 month_index 刪除
          // 如果 monthly_data 沒有 id，可以用 .gte('month_index', 0)
          
          if (monthlyRecords.length > 0) {
             const { error: insMError } = await supabase.from('monthly_data').insert(monthlyRecords);
             if (insMError) throw insMError;
          }

          setSyncStatus('✅ 已同步');
        } catch (error) {
          console.error('保存課程數據失敗:', error);
          setSyncStatus('❌ 保存失敗');
        }
      };

      const calculateEndDate = (startDateStr, days) => {
          if (!startDateStr || !days) return '';
          const date = new Date(startDateStr);
          date.setDate(date.getDate() + parseInt(days) - 1);
          return date.toISOString().split('T')[0];
      };

      const calculateDuration = (startDateStr, endDateStr) => {
          if (!startDateStr || !endDateStr) return '';
          const start = new Date(startDateStr);
          const end = new Date(endDateStr);
          if (end < start) return 0;
          const diffTime = Math.abs(end - start);
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; 
          return diffDays;
      };

      const getDayOfYear = (date) => {
        const start = new Date(date.getFullYear(), 0, 0);
        const diff = date - start;
        const oneDay = 1000 * 60 * 60 * 24;
        return Math.floor(diff / oneDay);
      };

      // --- Actions ---
      const toggleMonth = (idx) => setCollapsedMonths(prev => ({ ...prev, [idx]: !prev[idx] }));
      const expandAllMonths = () => setCollapsedMonths({});
      const collapseAllMonths = () => { const all = {}; schedule.forEach((_, i) => all[i] = true); setCollapsedMonths(all); };

      const handleAddCourse = () => {
          setErrorMsg('');
          if (!newCourse.name || !newCourse.startDate || !newCourse.endDate) {
              setErrorMsg("請填寫完整資訊");
              return;
          }
          const updatedCourses = [...masterCourses, { ...newCourse, id: generateId() }];
          setMasterCourses(updatedCourses);
          saveMasterCourses(updatedCourses, schedule.map(m => m.monthly));
          setNewCourse({ ...newCourse, batch: '', students: 0, startDate: '', endDate: '' });
      };

      const handleUpdateCourse = (id, field, value) => {
          const updatedCourses = masterCourses.map(c => {
              if (c.id !== id) return c;
              const updated = { ...c, [field]: value };
              if (field === 'startDate') {
                  if (c.duration) updated.endDate = calculateEndDate(value, c.duration);
                  else if (c.endDate) updated.duration = calculateDuration(value, c.endDate);
              } 
              else if (field === 'duration') {
                  if (c.startDate) updated.endDate = calculateEndDate(c.startDate, value);
              }
              else if (field === 'endDate') {
                  if (c.startDate) updated.duration = calculateDuration(c.startDate, value);
              }
              return updated;
          });
          setMasterCourses(updatedCourses);
          saveMasterCourses(updatedCourses, schedule.map(m => m.monthly));
      };

      const handleDeleteCourse = (id) => {
          if(!confirm("確定刪除此課程？")) return;
          const updatedCourses = masterCourses.filter(c => c.id !== id);
          setMasterCourses(updatedCourses);
          saveMasterCourses(updatedCourses, schedule.map(m => m.monthly));
      };

      const handleMonthlyChange = (mIdx, val) => {
          const newSchedule = [...schedule];
          newSchedule[mIdx].monthly[0].students = val;
          setSchedule(newSchedule);
          saveMasterCourses(masterCourses, newSchedule.map(m => m.monthly));
      };

      const handleAddClick = (id) => { setAddingToCategory(id); setTempName(''); };
      const handleConfirmAdd = () => {
        if (!tempName.trim() || !addingToCategory) return;
        const newPerson = { id: generateId(), name: tempName.trim() };
        const newPersonnel = { ...personnel, [addingToCategory]: [...(personnel[addingToCategory] || []), newPerson] };
        setPersonnel(newPersonnel); 
        savePersonnelData(newPersonnel); // Sync to Supabase
        setTempName(''); setAddingToCategory(null);
      };
      const handleCancelAdd = () => { setAddingToCategory(null); setTempName(''); };
      const handleRemoveClick = (cid, pid, name) => { setDeleteTarget({ categoryId: cid, personId: pid, name }); setShowDeleteModal(true); };
      const confirmRemovePerson = () => {
        if (!deleteTarget) return;
        const newPersonnel = { ...personnel, [deleteTarget.categoryId]: personnel[deleteTarget.categoryId].filter(p => p.id !== deleteTarget.personId) };
        setPersonnel(newPersonnel); 
        savePersonnelData(newPersonnel); // Sync to Supabase
        setShowDeleteModal(false); setDeleteTarget(null);
      };

      const handleDragStart = (e, person, fromCategory) => {
        setDraggedItem({ person, fromCategory });
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('application/json', JSON.stringify({ person, fromCategory }));
        setTimeout(() => e.target.classList.add('dragging'), 0);
      };
      const handleDragEnd = (e) => { e.target.classList.remove('dragging'); setDraggedItem(null); setDragOverContainer(null); };
      
      const handleDragOver = (e, categoryId) => { 
          e.preventDefault(); 
          e.stopPropagation(); 
          e.dataTransfer.dropEffect = 'move'; 
          if (dragOverContainer !== categoryId) {
            setDragOverContainer(categoryId); 
          }
      };

      const handleDrop = (e, toCategory) => {
        e.preventDefault(); e.stopPropagation();
        let targetPerson = null; let sourceCategory = null;
        if (draggedItem) { targetPerson = draggedItem.person; sourceCategory = draggedItem.fromCategory; } 
        else { try { const parsed = JSON.parse(e.dataTransfer.getData('application/json')); targetPerson = parsed.person; sourceCategory = parsed.fromCategory; } catch (err) {} }
        if (!targetPerson || !sourceCategory || sourceCategory === toCategory) return;
        const newPersonnel = { ...personnel };
        newPersonnel[sourceCategory] = newPersonnel[sourceCategory].filter(p => p.id !== targetPerson.id);
        newPersonnel[toCategory] = [...newPersonnel[toCategory], targetPerson];
        setPersonnel(newPersonnel); 
        savePersonnelData(newPersonnel); // Sync to Supabase
        setDraggedItem(null); setDragOverContainer(null);
      };

      // Stats
      const stats = useMemo(() => {
        let allocated = 0; let frontlineCount = 0;
        categories.forEach(cat => {
          const count = personnel[cat.id]?.length || 0;
          if (cat.id !== 'pool') allocated += count;
          if (cat.type === 'frontline') frontlineCount += count;
        });
        return { total: allocated + (personnel['pool']?.length||0), allocated, unallocated: personnel['pool']?.length||0, frontlineCount };
      }, [personnel, categories]);

      const studentStats = useMemo(() => {
        const counts = { total: 0, perspective: 0, composition: 0, color: 0, lineCamp: 0, colorCamp: 0, sketch: 0, monthly: 0 };
        masterCourses.forEach(c => {
            const n = parseInt(c.students) || 0;
            if (c.name === '透視') counts.perspective += n;
            else if (c.name === '構成') counts.composition += n;
            else if (c.name === '色彩') counts.color += n;
            else if (c.name === '線條訓練營') counts.lineCamp += n;
            else if (c.name === '色彩訓練營') counts.colorCamp += n;
            else if (c.name === '速寫團練') counts.sketch += n;
        });
        schedule.forEach(m => { counts.monthly += (parseInt(m.monthly[0]?.students) || 0); });
        counts.total = counts.perspective + counts.composition + counts.color + counts.lineCamp + counts.colorCamp + counts.sketch;
        return counts;
      }, [masterCourses, schedule]);

      // Calculations
      const calculateCampFrontline = (n) => {
        if (n <= 0) return 0;
        if (n <= 3000) return 8; 
        if (n <= 4000) return 8 + Math.ceil((n - 3000) / 1000 * 2);
        if (n <= 5000) return 10 + Math.ceil((n - 4000) / 1000 * 2);
        if (n <= 6000) return 12 + Math.ceil((n - 5000) / 1000 * 1);
        return 13 + Math.ceil((n - 6000) / 1000);
      };

      const calculateItem = (type, students, name) => {
        const n = Number(students) || 0;
        if (n <= 0) return { f: 0, i: 0 };
        if (type === 'regular') {
            let divisor = 250; 
            if (name && name.includes('透視')) { divisor = 270; }
            return { f: Math.ceil(n / divisor), i: 2 }; 
        }
        if (type === 'sketch') return { f: calculateCampFrontline(n), i: 4 }; 
        if (type === 'camp30' || type === 'camp49') return { f: calculateCampFrontline(n), i: 2 }; 
        if (type === 'monthlyActivity') return { f: 1, i: 1 };
        return { f: 0, i: 0 };
      };

      const scheduleTotals = useMemo(() => {
        return schedule.map(m => {
          let monthlyF = 0; let monthlyI = 0;
          const activeCourses = new Set();
          m.monthly.forEach(p => { const c = calculateItem(p.type, p.students, p.name); monthlyF += c.f; monthlyI += c.i; });
          
          const collect = (list) => list.forEach(p => { if((parseInt(p.students)||0)>0) activeCourses.add(p.name); });
          collect(m.monthly); collect(m.early); collect(m.mid); collect(m.late);

          const periods = {};
          ['early', 'mid', 'late'].forEach(pKey => {
             let f = monthlyF; let i = monthlyI;
             const activeInstructors = [];
             m[pKey].forEach(proj => {
                 const c = calculateItem(proj.type, proj.students, proj.name);
                 f += c.f; i += c.i;
                 if (proj.students > 0) {
                    if (['透視', '構成', '色彩'].includes(proj.name) && !activeInstructors.includes('K大、護衛艦')) activeInstructors.push('K大、護衛艦');
                    else if (proj.name === '速寫團練' && !activeInstructors.includes('K大、3位講師')) activeInstructors.push('K大、3位講師');
                    else if (proj.name.includes('訓練營') && !activeInstructors.includes('2位講師')) activeInstructors.push('2位講師');
                 }
             });
             periods[pKey] = { f, i, tags: activeInstructors };
          });
          return { ...periods, courseSummary: Array.from(activeCourses).join('、') };
        });
      }, [schedule]);

      const getFrontlineStatus = (req) => {
        const av = stats.frontlineCount;
        if (req <= av * 0.8) return { color: 'bg-green-50 text-green-700 border-green-200', text: '充裕' };
        if (req <= av) return { color: 'bg-yellow-50 text-yellow-700 border-yellow-200', text: '臨界' };
        return { color: 'bg-red-50 text-red-700 border-red-200', text: '超載' };
      };

      // --- Views ---
      const TimelineView = () => {
          const currentYear = new Date().getFullYear();
          const months = Array.from({length: 12}, (_, i) => i + 1);
          const getCourseColor = (type) => {
              if (type === 'regular') return 'bg-blue-500 text-white';
              if (type === 'sketch') return 'bg-orange-400 text-white';
              if (type === 'camp30') return 'bg-emerald-500 text-white';
              return 'bg-slate-400 text-white';
          };

          return (
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 overflow-x-auto">
                <div className="min-w-[800px]">
                    <div className="flex border-b border-slate-200 pb-2 mb-2 sticky top-0 bg-white z-10">
                        {months.map(m => (<div key={m} className="flex-1 text-center text-xs font-bold text-slate-500 border-r border-slate-100 last:border-0">{m}月</div>))}
                    </div>
                    <div className="space-y-3 relative h-[500px] overflow-y-auto">
                        <div className="absolute inset-0 flex pointer-events-none z-0">
                             {months.map(m => <div key={m} className="flex-1 border-r border-slate-100 last:border-0 h-full"></div>)}
                        </div>
                        {masterCourses.length === 0 && <div className="text-center text-slate-400 py-10">尚無課程資料</div>}
                        {masterCourses.sort((a,b) => new Date(a.startDate) - new Date(b.startDate)).map(course => {
                            if (!course.startDate || !course.endDate) return null;
                            const start = new Date(course.startDate);
                            const end = new Date(course.endDate);
                            const startDOY = getDayOfYear(start);
                            const endDOY = getDayOfYear(end);
                            const durationDays = endDOY - startDOY + 1;
                            const left = (startDOY / 365) * 100;
                            const width = (durationDays / 365) * 100;
                            return (
                                <div key={course.id} className="relative h-8 z-10 hover:z-20 group">
                                    <div className={`absolute h-6 rounded-md shadow-sm text-[10px] flex items-center px-2 cursor-pointer transition-all hover:scale-105 ${getCourseColor(course.type)}`}
                                        style={{ left: `${left}%`, width: `${width}%`, minWidth: '40px' }}
                                        title={`${course.name} (${course.startDate} ~ ${course.endDate})`}>
                                        <span className="truncate font-bold">{course.name} {course.batch && `(${course.batch})`}</span>
                                        <div className="hidden group-hover:block absolute bottom-full left-0 mb-1 bg-slate-800 text-white text-xs p-2 rounded shadow-lg whitespace-nowrap z-50">
                                            <div className="font-bold text-sm">{course.name}</div>
                                            <div>期數: {course.batch || '-'}</div>
                                            <div>日期: {course.startDate} ~ {course.endDate}</div>
                                            <div>人數: {course.students}</div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
          );
      };

      return (
        <div className="p-4 bg-slate-100 min-h-screen font-sans text-slate-900 text-[13px]">
          <div className="max-w-7xl mx-auto">
            {/* Header */}
            <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 sticky top-0 z-[50] header-transition ${isScrolled ? 'p-3 mb-4' : 'p-6 mb-6'}`}>
              <div className={`flex justify-between items-center ${isScrolled ? 'mb-0' : 'mb-6 border-b pb-6'}`}>
                 <div className="flex flex-col gap-2">
                     <div className="flex items-center gap-4">
                         <h1 className={`font-black text-slate-800 header-transition ${isScrolled ? 'text-lg' : 'text-2xl'}`}>人力需求測算儀表板</h1>
                         {isScrolled && (
                            <div className="flex gap-3 text-xs animate-in fade-in duration-300">
                                <span className="bg-slate-800 text-white px-2 py-1 rounded">總人力:{stats.total}</span>
                                <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded">總學生:{studentStats.total}</span>
                            </div>
                         )}
                     </div>
                     <div className="flex gap-2">
                        <button onClick={() => setCurrentView('dashboard')} className={`px-3 py-1 rounded-lg text-xs font-bold transition-colors ${currentView === 'dashboard' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>儀表板</button>
                        <button onClick={() => setCurrentView('timeline')} className={`px-3 py-1 rounded-lg text-xs font-bold transition-colors ${currentView === 'timeline' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>課程時間軸</button>
                        <button onClick={() => setCurrentView('personnel')} className={`px-3 py-1 rounded-lg text-xs font-bold transition-colors ${currentView === 'personnel' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>人員名單</button>
                     </div>
                 </div>
                 <div className="flex gap-2 items-center">
                    <span className="text-xs font-bold px-2 py-1 bg-emerald-100 text-emerald-700 rounded">{syncStatus}</span>
                    <span className="text-xs font-bold px-2 text-slate-400">☁️ Supabase</span>
                 </div>
              </div>

              {currentView === 'dashboard' && (
                  <div className={`stats-container ${isScrolled ? 'stats-hidden' : 'stats-visible'}`}>
                        <div className="grid grid-cols-3 gap-4 mb-6">
                            <div className="p-4 bg-slate-800 text-white rounded-xl text-center shadow"><div className="text-[10px] text-slate-400 font-bold mb-1">助教總人數</div><div className="text-4xl font-black">{stats.total}</div></div>
                            <div className="p-4 bg-emerald-50 text-emerald-800 rounded-xl text-center border border-emerald-100"><div className="text-[10px] text-emerald-600 font-bold mb-1">已分配</div><div className="text-3xl font-black">{stats.allocated}</div></div>
                            <div className="p-4 bg-amber-50 text-amber-800 rounded-xl text-center border border-amber-100"><div className="text-[10px] text-amber-600 font-bold mb-1">未分配</div><div className="text-3xl font-black">{stats.unallocated}</div></div>
                        </div>
                        <div className="bg-blue-50 rounded-xl p-4 border border-blue-100 overflow-x-auto"><div className="flex items-center gap-8 min-w-max"><div className="flex flex-col items-center px-6 border-r-2 border-blue-200"><span className="text-[10px] text-blue-500 font-bold uppercase tracking-wider">總學生數</span><span className="text-[9px] text-blue-400 mb-1">(不含月月繪)</span><span className="text-3xl font-black text-blue-700">{studentStats.total}</span></div><div className="flex gap-6">{[{ l: '透視', v: studentStats.perspective }, { l: '色彩', v: studentStats.color }, { l: '構成', v: studentStats.composition }, { l: '線條營', v: studentStats.lineCamp }, { l: '色彩營', v: studentStats.colorCamp }, { l: '速寫', v: studentStats.sketch }, { l: '月月繪', v: studentStats.monthly }].map((s, i) => (<div key={i} className="flex flex-col items-center min-w-[50px]"><span className="text-[10px] text-slate-500 font-bold mb-1">{s.l}</span><span className="text-xl font-bold text-slate-700">{s.v}</span></div>))}</div></div></div>
                  </div>
              )}
            </div>

            {currentView === 'personnel' && (
                <div className="space-y-6 pb-20">
                    {categoryGroups.map((group, idx) => (
                        <div key={idx} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-4">
                            <div className="p-3 bg-slate-50 border-b">
                                <h3 className="text-sm font-black text-slate-700 px-1 border-l-4 border-blue-500 pl-2">{group.name}</h3>
                            </div>
                            <div className="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                              {group.items.map((cat) => (
                                  <div key={cat.id} 
                                       onDragOver={(e) => handleDragOver(e, cat.id)} 
                                       onDrop={(e) => handleDrop(e, cat.id)} 
                                       className={`rounded-xl border-2 transition-all min-h-[140px] flex flex-col ${cat.id === 'pool' ? 'bg-slate-200 border-slate-300' : 'bg-white border-slate-100'} ${dragOverContainer === cat.id ? 'border-blue-400 bg-blue-50' : ''}`}>
                                    <div className="p-2 flex justify-between items-center border-b"><span className="font-bold text-xs">{cat.label} <span className="bg-white px-1.5 rounded-full text-[10px]">{personnel[cat.id]?.length||0}</span></span><button onClick={(e) => { e.stopPropagation(); handleAddClick(cat.id); }} className="text-blue-500 font-bold px-2">+</button></div>
                                    <div className="p-2 flex-1 flex flex-col gap-2 max-h-[200px] overflow-y-auto">
                                      {personnel[cat.id]?.map((p) => (
                                        <div key={p.id} draggable onDragStart={(e) => handleDragStart(e, p, cat.id)} onDragEnd={handleDragEnd} className="bg-white border p-2 rounded shadow-sm flex justify-between group cursor-grab">
                                          <span className="text-xs font-bold truncate">{p.name}</span>
                                          <button onClick={() => handleRemoveClick(cat.id, p.id, p.name)} className="hidden group-hover:block text-rose-500">×</button>
                                        </div>
                                      ))}
                                      {addingToCategory === cat.id && (
                                        <div className="mt-2"><input autoFocus value={tempName} onChange={(e) => setTempName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleConfirmAdd()} onBlur={() => tempName.trim() ? handleConfirmAdd() : handleCancelAdd()} className="w-full border-2 border-blue-400 rounded p-1 text-xs" placeholder="輸入姓名..." /></div>
                                      )}
                                    </div>
                                  </div>
                              ))}
                            </div>
                        </div>
                    ))}
                </div>
            )}
            
            {currentView === 'timeline' && <TimelineView />}
            
            {currentView === 'dashboard' && (
                <div className="space-y-6 pb-20">
                    {/* Master Course Schedule */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="p-3 bg-slate-50 border-b flex justify-between items-center cursor-pointer hover:bg-slate-100" onClick={() => setIsMasterCollapsed(!isMasterCollapsed)}>
                            <h3 className="text-sm font-black text-slate-700 px-1 border-l-4 border-indigo-500 pl-2">年度課程總表 (設定開課時間與人數)</h3>
                            <span className="text-xs text-slate-500 font-bold">{isMasterCollapsed ? '點擊展開 ▼' : '點擊收合 ▲'}</span>
                        </div>
                        {!isMasterCollapsed && (
                            <div className="p-4">
                                <div className="flex flex-wrap gap-2 mb-4 items-end bg-slate-50 p-3 rounded-lg border border-slate-200">
                                    <div className="flex flex-col"><span className="text-[10px] text-slate-500 font-bold mb-1">課程名稱</span><select value={newCourse.name} onChange={e => { const selected = COURSE_TYPES.find(c => c.label === e.target.value); setNewCourse({ ...newCourse, name: e.target.value, type: selected.value, duration: selected.days }); }} className="border rounded p-1.5 text-xs font-bold h-8">{COURSE_TYPES.map(c => <option key={c.label} value={c.label}>{c.label}</option>)}</select></div>
                                    <div className="flex flex-col"><span className="text-[10px] text-slate-500 font-bold mb-1">期數</span><input type="text" value={newCourse.batch} onChange={e => setNewCourse({ ...newCourse, batch: e.target.value })} className="border rounded p-1.5 text-xs w-20 h-8" placeholder="期數" /></div>
                                    <div className="flex flex-col"><span className="text-[10px] text-slate-500 font-bold mb-1">開始日期</span><input type="date" value={newCourse.startDate} onChange={e => setNewCourse({ ...newCourse, startDate: e.target.value, endDate: calculateEndDate(e.target.value, newCourse.duration) })} className="border rounded p-1.5 text-xs h-8" /></div>
                                    <div className="flex flex-col"><span className="text-[10px] text-slate-500 font-bold mb-1">服務天數</span><input type="number" value={newCourse.duration} onChange={e => setNewCourse({ ...newCourse, duration: e.target.value, endDate: calculateEndDate(newCourse.startDate, e.target.value) })} className="border rounded p-1.5 text-xs w-20 h-8" /></div>
                                    <div className="flex flex-col"><span className="text-[10px] text-slate-500 font-bold mb-1">結束日期(自動/可改)</span><input type="date" value={newCourse.endDate} onChange={e => setNewCourse({ ...newCourse, endDate: e.target.value, duration: calculateDuration(newCourse.startDate, e.target.value) })} className="border rounded p-1.5 text-xs h-8 bg-slate-50" /></div>
                                    <div className="flex flex-col"><span className="text-[10px] text-slate-500 font-bold mb-1">人數</span><input type="number" value={newCourse.students} onChange={e => setNewCourse({ ...newCourse, students: parseInt(e.target.value) || 0 })} className="border rounded p-1.5 text-xs w-20 h-8" placeholder="0" /></div>
                                    <button onClick={handleAddCourse} className="bg-indigo-600 text-white px-4 py-1.5 rounded text-xs font-bold h-8 hover:bg-indigo-700">新增</button>
                                </div>
                                {errorMsg && <div className="text-rose-500 text-xs font-bold mb-4 px-2">⚠️ {errorMsg}</div>}
                                <div className="overflow-x-auto"><table className="w-full text-xs text-left"><thead className="bg-slate-100 text-slate-600 uppercase"><tr><th className="px-3 py-2 rounded-tl-lg">課程</th><th className="px-3 py-2">期數</th><th className="px-3 py-2">開始</th><th className="px-3 py-2">天數</th><th className="px-3 py-2">結束</th><th className="px-3 py-2">人數</th><th className="px-3 py-2 rounded-tr-lg text-right">操作</th></tr></thead><tbody className="divide-y divide-slate-100">{masterCourses.length === 0 ? (<tr><td colSpan="7" className="px-3 py-4 text-center text-slate-400 italic">尚未新增任何課程，請上方輸入</td></tr>) : (masterCourses.map(c => (<tr key={c.id} className="hover:bg-slate-50"><td className="px-3 py-2 font-bold text-slate-700">{c.name}</td><td className="px-3 py-2 text-slate-500">{c.batch || '-'}</td><td className="px-3 py-2"><input type="date" value={c.startDate} onChange={(e) => handleUpdateCourse(c.id, 'startDate', e.target.value)} className="w-24 border-b border-blue-300 bg-transparent outline-none focus:bg-blue-50"/></td><td className="px-3 py-2"><input type="number" value={c.duration} onChange={(e) => handleUpdateCourse(c.id, 'duration', e.target.value)} className="w-12 border-b border-blue-300 text-center outline-none bg-transparent focus:bg-blue-50"/></td><td className="px-3 py-2"><input type="date" value={c.endDate} onChange={(e) => handleUpdateCourse(c.id, 'endDate', e.target.value)} className="w-24 border-b border-blue-300 bg-transparent outline-none focus:bg-blue-50"/></td><td className="px-3 py-2"><input type="number" value={c.students} onChange={(e) => handleUpdateCourse(c.id, 'students', parseInt(e.target.value) || 0)} className="w-16 border-b border-blue-300 font-bold text-blue-600 text-center outline-none bg-transparent focus:bg-blue-50"/></td><td className="px-3 py-2 text-right"><button onClick={() => handleDeleteCourse(c.id)} className="text-rose-500 hover:text-rose-700 font-bold">刪除</button></td></tr>)))}</tbody></table></div>
                            </div>
                        )}
                    </div>

                    <div className="flex justify-end gap-2 mb-2 px-2">
                        <button onClick={expandAllMonths} className="text-xs bg-white border px-3 py-1 rounded hover:bg-slate-50 text-slate-600 font-bold">全部展開</button>
                        <button onClick={collapseAllMonths} className="text-xs bg-white border px-3 py-1 rounded hover:bg-slate-50 text-slate-600 font-bold">全部收合</button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {schedule.length > 0 ? schedule.map((m, mIdx) => {
                        const periodData = scheduleTotals[mIdx] || { early: {}, mid: {}, late: {} };
                        const isCollapsed = collapsedMonths[mIdx];
                        return (
                          <div key={mIdx} className="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden flex flex-col">
                            <div className="bg-slate-800 text-white px-4 py-3 flex justify-between items-center cursor-pointer hover:bg-slate-700" onClick={() => toggleMonth(mIdx)}>
                               <div className="flex items-center gap-2"><span className={`transition-transform ${isCollapsed ? '-rotate-90' : ''}`}>▼</span><span className="font-black text-lg tracking-widest">{m.month}</span></div>
                               <div className="flex flex-col items-end gap-0.5">{periodData.courseSummary && <span className="text-[10px] bg-slate-600 text-blue-200 px-1.5 rounded border border-slate-500 truncate max-w-[120px]">{periodData.courseSummary}</span>}<div className="flex gap-2 text-[10px] text-slate-400 font-mono"><span>一線:{Math.max(periodData.early.f, periodData.mid.f, periodData.late.f)}</span><span>講師:{Math.max(periodData.early.i, periodData.mid.i, periodData.late.i)}</span></div></div>
                            </div>
                            {!isCollapsed && (
                              <div className="flex-1 flex flex-col animate-in slide-in-from-top-2 duration-200">
                                <div className="flex-1 flex flex-col divide-y divide-slate-100">
                                  {['early', 'mid', 'late'].map((pKey) => {
                                    const pName = pKey === 'early' ? '月初 (1-10)' : pKey === 'mid' ? '月中 (11-20)' : '月底 (21+)';
                                    const data = periodData[pKey];
                                    const fStat = getFrontlineStatus(data.f);
                                    const isTOver = data.i > stats.instructorCount;
                                    return (
                                      <div key={pKey} className="p-3 flex flex-col bg-white">
                                        <div className="flex justify-between items-center mb-2 pb-1 border-b border-slate-50">
                                          <div className="flex items-center gap-2"><span className="font-black text-slate-400 text-[10px] uppercase">{pName}</span><div className="flex gap-1">{data.tags?.map((tag, i) => <span key={i} className="bg-indigo-50 text-indigo-600 text-[9px] px-1 rounded">{tag}</span>)}</div></div>
                                          <div className="flex gap-1"><span className={`px-1.5 py-0.5 rounded text-[9px] font-bold border ${fStat.color}`}>一線:{data.f}</span><span className={`px-1.5 py-0.5 rounded text-[9px] font-bold border ${isTOver ? 'bg-rose-50 text-rose-600 border-rose-100' : 'bg-emerald-50 text-emerald-600 border-emerald-100'}`}>講師:{data.i}</span></div>
                                        </div>
                                        <div className="space-y-1">{m[pKey]?.map((p, pIdx) => (<div key={pIdx} className="bg-slate-50 border border-slate-100 p-1.5 rounded flex justify-between items-center"><div className="flex flex-col"><span className="text-[10px] font-bold text-slate-700">{p.name}</span><span className="text-[9px] text-slate-400">{p.batch}</span></div><span className="text-[10px] font-bold text-blue-600">{p.students}人</span></div>))}</div>
                                      </div>
                                    );
                                  })}
                                </div>
                                <div className="bg-slate-50 border-t border-slate-200 p-3 flex items-center justify-between mt-auto">
                                   <div className="flex items-center gap-2"><span className="text-[10px] font-black text-slate-600 bg-white px-2 py-1 rounded border">月月繪</span><span className="text-[9px] text-slate-400 hidden sm:inline">(師:1/線:1)</span></div>
                                   <div className="flex items-center bg-white border border-slate-300 rounded px-2 py-0.5"><input type="number" value={m.monthly?.[0]?.students || ''} onChange={(e) => handleMonthlyChange(mIdx, parseInt(e.target.value)||0)} className="w-12 text-center text-xs font-black outline-none text-blue-600" placeholder="0" /><span className="text-[9px] text-slate-400 ml-1">人</span></div>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      }) : <div className="col-span-full text-center py-20 text-slate-400">載入中...</div>}
                    </div>
                </div>
            )}

            {/* Modals */}
            {showDeleteModal && (
              <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
                  <h3 className="font-bold mb-2">確認刪除 {deleteTarget?.name}?</h3>
                  <div className="flex gap-2 mt-4"><button onClick={confirmRemovePerson} className="flex-1 bg-rose-500 text-white py-2 rounded">刪除</button><button onClick={() => setShowDeleteModal(false)} className="flex-1 bg-slate-100 py-2 rounded">取消</button></div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
