    const TimelineView = memo(({ masterCourses }) => {
        const [year, setYear] = useState(new Date().getFullYear());
        const months = Array.from({length: 12}, (_, i) => i + 1);
        const getCourseColor = (type) => {
            if (type === 'regular') return 'bg-blue-600 text-white';
            if (type === 'sketch') return 'bg-orange-600 text-white';
            if (type === 'camp30') return 'bg-emerald-600 text-white';
            return 'bg-slate-600 text-white';
        };
        return (
            <div className="bg-slate-900 rounded-xl shadow-sm border border-slate-800 p-4 overflow-x-auto fade-in">
                <div className="min-w-[800px]">
                    <div className="flex items-center justify-between mb-4 px-2">
                        <button onClick={() => setYear(y => y - 1)} className="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white"><Icons.ChevronLeft /></button>
                        <h2 className="text-lg font-bold text-slate-100">{year} 年課程時間軸</h2>
                        <button onClick={() => setYear(y => y + 1)} className="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white"><Icons.ChevronRight /></button>
                    </div>
                    <div className="flex border-b border-slate-800 pb-2 mb-2 sticky top-0 bg-slate-900 z-10">
                        {months.map(m => (<div key={m} className="flex-1 text-center text-xs font-bold text-slate-400 border-r border-slate-800 last:border-0">{m}月</div>))}
                    </div>
                    <div className="space-y-3 relative h-[500px] overflow-y-auto">
                        <div className="absolute inset-0 flex pointer-events-none z-0">{months.map(m => <div key={m} className="flex-1 border-r border-slate-800 last:border-0 h-full"></div>)}</div>
                        {masterCourses.length === 0 && <div className="text-center text-slate-600 py-10">尚無課程資料</div>}
                        {masterCourses.sort((a,b) => new Date(a.startDate) - new Date(b.startDate)).map(course => {
                            if (!course.startDate || !course.endDate) return null;
                            const start = new Date(course.startDate);
                            const end = new Date(course.endDate);
                            if (start.getFullYear() !== year && end.getFullYear() !== year) return null;
                            const yearStart = new Date(year, 0, 1).getTime();
                            const yearEnd = new Date(year, 11, 31).getTime();
                            const duration = yearEnd - yearStart;
                            const cStart = Math.max(start.getTime(), yearStart);
                            const cEnd = Math.min(end.getTime(), yearEnd);
                            if (cEnd < cStart) return null;
                            const left = ((cStart - yearStart) / duration) * 100;
                            const width = ((cEnd - cStart) / duration) * 100;
                            return (
                                <div key={course.id} className="relative h-8 z-10 hover:z-20 group">
                                    <div className={`absolute h-6 rounded-md shadow-sm text-[10px] flex items-center px-2 cursor-pointer transition-all hover:scale-105 ${getCourseColor(course.type)}`} style={{ left: `${left}%`, width: `${width}%`, minWidth: '40px' }} title={course.name}>
                                        <span className="truncate font-bold">{course.name} {course.batch && `(${course.batch})`}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    });

    const WorkScheduleView = memo(({ personnel, categoryGroups, attendanceData, onUpdateAttendance, onBatchUpdate, taskTypes, setShowTaskTypeModal, wsSearchTerm, setWsSearchTerm, dailyStats, wsShowBatchModal, setWsShowBatchModal, wsBatchForm, setWsBatchForm, isEditingAllowed }) => {
        const [selectedMonth, setSelectedMonth] = useState(new Date());
        const [viewMode, setViewMode] = useState('week'); 
        const [expandedGroups, setExpandedGroups] = useState({});
        const [popover, setPopover] = useState(null);
        const [popoverContext, setPopoverContext] = useState("");
        
        useEffect(() => {
           if (Object.keys(expandedGroups).length === 0 && categoryGroups.length > 0) {
               setExpandedGroups(categoryGroups.reduce((acc, g) => ({...acc, [g.name]: true}), {}));
           }
        }, [categoryGroups]);

        const daysInMonth = new Date(selectedMonth.getFullYear(), selectedMonth.getMonth() + 1, 0).getDate();
        const days = Array.from({length: daysInMonth}, (_, i) => i + 1);

        const datesToShow = useMemo(() => {
            if (viewMode === 'month') {
                const year = selectedMonth.getFullYear();
                const month = selectedMonth.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                return Array.from({length: daysInMonth}, (_, i) => new Date(year, month, i + 1));
            } else {
                const start = new Date(selectedMonth);
                const day = start.getDay();
                start.setDate(start.getDate() - day); 
                return Array.from({length: 7}, (_, i) => {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    return d;
                });
            }
        }, [viewMode, selectedMonth]);

        const title = viewMode === 'month' 
           ? `${selectedMonth.getFullYear()}年 ${selectedMonth.getMonth()+1}月`
           : `${datesToShow[0].getMonth()+1}/${datesToShow[0].getDate()} - ${datesToShow[6].getMonth()+1}/${datesToShow[6].getDate()}`;

        const filteredGroups = useMemo(() => categoryGroups.map(g => {
            const filteredItems = g.items.map(cat => ({
                ...cat,
                people: (personnel[cat.id] || []).filter(p => p.name.includes(wsSearchTerm))
            })).filter(cat => cat.people.length > 0);
            return { ...g, items: filteredItems };
        }).filter(g => g.items.length > 0), [categoryGroups, personnel, wsSearchTerm]);
        
        const handleNavigate = (dir) => {
           const d = new Date(selectedMonth);
           if(viewMode === 'month') d.setMonth(d.getMonth() + dir);
           else d.setDate(d.getDate() + dir * 7);
           setSelectedMonth(d);
        };

        const handleCellClick = (e, empId, dateStr, context) => {
            if (!isEditingAllowed) return;
            const rect = e.target.getBoundingClientRect();
            setPopover({ empId, dateStr, x: rect.left, y: rect.bottom + window.scrollY });
            setPopoverContext(context || "");
        };

        const handleSaveCell = (status) => {
           if (popover) {
              onUpdateAttendance(popover.empId, popover.dateStr, status, popoverContext);
              setPopover(null);
              setPopoverContext("");
           }
        };
        
        const handleBatchSubmit = () => {
           if (!wsBatchForm.personId) return;
           const start = new Date(wsBatchForm.startDate);
           const end = new Date(wsBatchForm.endDate);
           const records = [];
           for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                records.push({
                    employee_id: wsBatchForm.personId,
                    date: d.toISOString().split('T')[0],
                    status: wsBatchForm.type,
                    context: wsBatchForm.context
                });
           }
           onBatchUpdate(records);
           setWsShowBatchModal(false);
        };

        return (
            <div className="fade-in space-y-4 pb-20">
                <div className="bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-800 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div className="flex items-center gap-4">
                        <button onClick={() => handleNavigate(-1)} className="p-2 hover:bg-slate-800 rounded-full text-slate-300"><Icons.ChevronLeft /></button>
                        <div className="text-lg font-bold text-slate-100 min-w-[120px] text-center">{title}</div>
                        <button onClick={() => handleNavigate(1)} className="p-2 hover:bg-slate-800 rounded-full text-slate-300"><Icons.ChevronRight /></button>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={() => setViewMode('week')} className={`px-3 py-1.5 text-xs font-bold rounded-lg border ${viewMode === 'week' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>週檢視</button>
                        <button onClick={() => setViewMode('month')} className={`px-3 py-1.5 text-xs font-bold rounded-lg border ${viewMode === 'month' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>月檢視</button>
                    </div>
                    <div className="flex items-center gap-4">
                         {isEditingAllowed && <button onClick={() => setShowTaskTypeModal(true)} className="text-xs text-indigo-400 hover:text-indigo-300 font-bold border border-indigo-900 px-2 py-1 rounded">⚙️ 設定</button>}
                         {isEditingAllowed && <button onClick={() => setWsShowBatchModal(true)} className="flex items-center gap-2 bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-700 shadow-md"><Icons.Plus /> 新增紀錄</button>}
                         <div className="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700"><Icons.Search /><input className="bg-transparent border-none outline-none text-sm w-32 text-slate-200" placeholder="搜尋姓名..." value={wsSearchTerm} onChange={e => setWsSearchTerm(e.target.value)} /></div>
                         <div className="flex gap-4 text-xs font-medium text-slate-400">
                             <span>今日工作: <span className="text-blue-400 font-bold">{dailyStats.workingToday}</span></span>
                             <span>休假: <span className="text-rose-400 font-bold">{dailyStats.leaveToday}</span></span>
                         </div>
                    </div>
                </div>

                <div className={`bg-slate-900 rounded-xl shadow-sm border border-slate-800 overflow-hidden relative ${viewMode === 'month' ? 'view-month' : ''}`}>
                    <div className="overflow-x-auto">
                        <table className="w-full text-xs border-collapse table-fixed">
                            <thead>
                                <tr>
                                    <th className="sticky left-0 bg-slate-900 z-20 border-b border-r border-slate-800 p-3 w-[150px] text-left font-bold text-slate-300">人員</th>
                                    {datesToShow.map(d => {
                                        const dayName = ['日','一','二','三','四','五','六'][d.getDay()];
                                        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                                        return (
                                            <th key={d.toISOString()} className={`border-b border-r border-slate-800 p-1 text-center font-medium ${isWeekend ? 'bg-slate-800/50 text-rose-300' : 'text-slate-400'}`} style={{width: viewMode==='week' ? '12%' : '36px'}}>
                                                <div className="text-[10px]">{d.getMonth()+1}/{d.getDate()}</div>
                                                <div className="text-[9px]">({dayName})</div>
                                            </th>
                                        );
                                    })}
                                </tr>
                            </thead>
                            <tbody>
                                {filteredGroups.map(group => (
                                    <React.Fragment key={group.name}>
                                        <tr className="bg-slate-800/50 cursor-pointer hover:bg-slate-800" onClick={() => setExpandedGroups(prev => ({...prev, [group.name]: !prev[group.name]}))}>
                                            <td className="sticky left-0 bg-slate-900 z-10 border-b border-r border-slate-800 p-2 font-bold text-indigo-400 pl-4 flex items-center gap-2" colSpan={datesToShow.length + 1}>{expandedGroups[group.name] ? <Icons.ChevronDown/> : <Icons.ChevronUp/>} {group.name}</td>
                                        </tr>
                                        {expandedGroups[group.name] && group.items.map(cat => (
                                            cat.people.map(p => (
                                                <tr key={p.id} className="hover:bg-slate-800/30 transition-colors">
                                                    <td className="sticky left-0 bg-slate-900 z-10 border-b border-r border-slate-800 p-2 pl-6 font-medium text-slate-300 shadow-sm"><div className="flex items-center justify-between"><span>{p.name}</span><span className="text-[9px] text-slate-400 bg-slate-800 px-1 rounded border border-slate-700">[{cat.label}]</span></div></td>
                                                    {datesToShow.map(d => {
                                                        const dateStr = d.toISOString().split('T')[0];
                                                        const record = attendanceData[p.id]?.[dateStr];
                                                        const statusConfig = taskTypes.find(t => t.id === record?.status);
                                                        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
                                                        return (
                                                            <td key={dateStr} onClick={(e) => handleCellClick(e, p.id, dateStr, record?.context)} className={`border-b border-r border-slate-800 text-center attendance-cell relative ${isWeekend ? 'bg-slate-800/30' : ''} ${isEditingAllowed ? 'cursor-pointer' : 'cursor-default'}`}>
                                                                {statusConfig ? (
                                                                    <div className={`task-block ${statusConfig.color}`} data-tooltip={`${statusConfig.label} ${record.context ? '- '+record.context : ''}`}>
                                                                        {viewMode === 'week' ? (record.context || statusConfig.label) : (record.context ? record.context.substring(0,2) : statusConfig.label.substring(0,1))}
                                                                    </div>
                                                                ) : <div className="w-full h-full opacity-0 hover:opacity-100 text-slate-600 text-[10px] flex items-center justify-center">+</div>}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))
                                        ))}
                                    </React.Fragment>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    
                    {/* Popover */}
                    {popover && isEditingAllowed && (
                        <div className="fixed z-50 bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-3 w-48 animate-in zoom-in-95 duration-100 flex flex-col gap-2" style={{ top: popover.y + 5, left: Math.min(popover.x - 60, window.innerWidth - 200) }}>
                            <input type="text" placeholder="工作內容..." className="w-full text-xs bg-slate-900 border border-slate-700 rounded p-1.5 mb-1 outline-none focus:border-indigo-500 text-slate-200" autoFocus value={popoverContext} onChange={e => setPopoverContext(e.target.value)} />
                            <div className="grid grid-cols-2 gap-1.5">{taskTypes.map(type => (<button key={type.id} onClick={() => handleSaveCell(type.id)} className={`text-[10px] px-2 py-1.5 rounded text-center font-bold shadow-sm ${type.color} opacity-90 hover:opacity-100`}>{type.label}</button>))}</div>
                            <div className="h-px bg-slate-700 my-1"></div>
                            <button onClick={() => handleSaveCell(null)} className="text-xs px-2 py-1.5 rounded text-center font-medium text-slate-400 hover:bg-slate-700 w-full">清除紀錄</button>
                            <div className="fixed inset-0 z-[-1]" onClick={() => setPopover(null)}></div>
                        </div>
                    )}
                </div>
                
                {/* Batch Modal */}
                {wsShowBatchModal && isEditingAllowed && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                        <div className="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-md p-6 animate-in zoom-in-95 border border-slate-800">
                            <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-slate-100">新增紀錄</h3><button onClick={() => setWsShowBatchModal(false)} className="text-slate-400 hover:text-slate-200"><Icons.X /></button></div>
                            <div className="space-y-4">
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">人員</label><select className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200" value={wsBatchForm.personId} onChange={e => setWsBatchForm({...wsBatchForm, personId: e.target.value})}><option value="">請選擇...</option>{categoryGroups.map(g => (<optgroup key={g.name} label={g.name}>{g.items.map(cat => personnel[cat.id]?.map(p => <option key={p.id} value={p.id}>{p.name} ({cat.label})</option>))}</optgroup>))}</select></div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="block text-xs font-bold text-slate-400 mb-1">開始</label><input type="date" className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200" value={wsBatchForm.startDate} onChange={e => setWsBatchForm({...wsBatchForm, startDate: e.target.value})} /></div>
                                    <div><label className="block text-xs font-bold text-slate-400 mb-1">結束</label><input type="date" className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-slate-200" value={wsBatchForm.endDate} onChange={e => setWsBatchForm({...wsBatchForm, endDate: e.target.value})} /></div>
                                </div>
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">類型</label><div className="flex flex-wrap gap-2">{taskTypes.map(t => (<button key={t.id} onClick={() => setWsBatchForm({...wsBatchForm, type: t.id})} className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors shadow-sm ${wsBatchForm.type === t.id ? 'ring-2 ring-offset-1 ring-slate-400' : 'opacity-80 border-transparent'} ${t.color}`}>{t.label}</button>))}</div></div>
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">內容/備註</label><input type="text" className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200" placeholder="S1助教、備課..." value={wsBatchForm.context} onChange={e => setWsBatchForm({...wsBatchForm, context: e.target.value})} /></div>
                                <button onClick={handleBatchSubmit} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-lg mt-2 transition-colors">確認</button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    });

    const AnalyticsView = memo(({ personnel, attendanceData, taskTypes, categoryGroups, manualStats, onUpdateManualStats }) => {
        const [activeTab, setActiveTab] = useState('overview'); 
        const [selectedMonth, setSelectedMonth] = useState(() => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        });
        const [selectedPersonId, setSelectedPersonId] = useState("");
        const [selectedDailyDate, setSelectedDailyDate] = useState(() => new Date().toISOString().split('T')[0]);
        
        // 用於手動編輯數值的狀態
        const [editingStat, setEditingStat] = useState(null);

        const flatCategories = useMemo(() => categoryGroups.flatMap(g => g.items), [categoryGroups]);

        const allPersonnelList = useMemo(() => {
            let list = [];
            Object.entries(personnel).forEach(([catId, arr]) => {
                arr.forEach(p => {
                    list.push({ ...p, categoryId: catId });
                });
            });
            return list;
        }, [personnel]);

        const analytics = useMemo(() => {
            if (!selectedMonth) return null;
            const [year, month] = selectedMonth.split('-').map(Number);
            
            let weekdays = 0;
            const daysInMonth = new Date(year, month, 0).getDate();
            const daysArray = Array.from({length: daysInMonth}, (_, i) => i + 1);

            for (let i = 1; i <= daysInMonth; i++) {
                const day = new Date(year, month - 1, i).getDay();
                if (day !== 0 && day !== 6) weekdays++;
            }

            const stats = [];
            const globalTaskCounts = {};
            let totalGlobalTasks = 0;

            allPersonnelList.forEach(p => {
                let workDays = 0;
                let leaveDays = 0;
                const personalTaskCounts = {};

                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const record = attendanceData[p.id]?.[dateStr];
                    
                    if (record && record.status) {
                        const isLeave = record.status === 'leave';
                        if (isLeave) leaveDays++;
                        else workDays++;
                        
                        personalTaskCounts[record.status] = (personalTaskCounts[record.status] || 0) + 1;
                        globalTaskCounts[record.status] = (globalTaskCounts[record.status] || 0) + 1;
                        totalGlobalTasks++;
                    }
                }

                stats.push({
                    ...p,
                    workDays,
                    leaveDays,
                    idleDays: Math.max(0, weekdays - workDays - leaveDays),
                    personalTaskCounts,
                    totalPersonalTasks: workDays + leaveDays
                });
            });

            const topActive = [...stats].sort((a, b) => b.workDays - a.workDays).slice(0, 5);
            const topIdle = [...stats].sort((a, b) => b.idleDays - a.idleDays);

            return { year, month, daysArray, weekdays, globalTaskCounts, totalGlobalTasks, stats, topActive, topIdle };
        }, [selectedMonth, allPersonnelList, attendanceData]);

        // 計算單日工作分佈資料
        const dailyData = useMemo(() => {
            let taskCounts = {};
            let totalAssigned = 0;
            let memberTasks = [];

            allPersonnelList.forEach(p => {
                const record = attendanceData[p.id]?.[selectedDailyDate];
                const status = record?.status || null;
                if (status) {
                    taskCounts[status] = (taskCounts[status] || 0) + 1;
                    totalAssigned++;
                }
                memberTasks.push({ ...p, status, context: record?.context });
            });

            memberTasks.sort((a, b) => {
                if (!a.status && !b.status) return 0;
                if (!a.status) return 1;
                if (!b.status) return -1;
                return a.status.localeCompare(b.status);
            });

            return { taskCounts, totalAssigned, memberTasks };
        }, [selectedDailyDate, allPersonnelList, attendanceData]);

        if (!analytics) return null;

        const selectedPersonStat = selectedPersonId ? analytics.stats.find(p => p.id === selectedPersonId) : null;
        
        let workloadRate = "-";
        let mostFrequentTask = "-";
        let idleDays = "-";
        let displayTaskCounts = analytics.globalTaskCounts;
        let totalForBar = analytics.totalGlobalTasks;
        let summaryTitle = "整體工作總結 (任務分佈)";

        if (selectedPersonStat) {
            const wDays = selectedPersonStat.workDays;
            workloadRate = analytics.weekdays > 0 ? Math.round((wDays / analytics.weekdays) * 100) : 0;
            idleDays = selectedPersonStat.idleDays;
            
            const tasks = Object.entries(selectedPersonStat.personalTaskCounts)
                                .filter(([taskId]) => taskId !== 'leave') 
                                .sort((a,b) => b[1] - a[1]);
            if (tasks.length > 0) {
                const tConfig = taskTypes.find(t => t.id === tasks[0][0]);
                mostFrequentTask = tConfig ? tConfig.label : tasks[0][0];
            } else {
                mostFrequentTask = "無排班";
            }

            displayTaskCounts = selectedPersonStat.personalTaskCounts;
            totalForBar = selectedPersonStat.totalPersonalTasks;
            summaryTitle = `${selectedPersonStat.name} 的工作總結 (任務分佈)`;
        }

        // 手動覆寫數值處理
        const calculatedLeave = Object.values(analytics.stats).reduce((a, b) => a + b.leaveDays, 0);
        const displayLeave = manualStats?.[selectedMonth]?.leave !== undefined ? manualStats[selectedMonth].leave : calculatedLeave;
        
        const calculatedIdle = analytics.stats.length ? (analytics.stats.reduce((acc, curr) => acc + curr.idleDays, 0) / analytics.stats.length).toFixed(1) : 0;
        const displayIdle = manualStats?.[selectedMonth]?.idle !== undefined ? manualStats[selectedMonth].idle : calculatedIdle;

        const handleSaveManualStat = (type, value) => {
            const num = parseFloat(value);
            const newStats = { ...manualStats };
            if (!newStats[selectedMonth]) newStats[selectedMonth] = {};
            
            if (isNaN(num)) {
                delete newStats[selectedMonth][type]; // 恢復預設
            } else {
                newStats[selectedMonth][type] = num;
            }
            onUpdateManualStats(newStats);
            setEditingStat(null);
        };

        return (
            <div className="fade-in space-y-6 pb-20 max-w-6xl mx-auto">
                <div className="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-sm flex-wrap gap-4">
                    <div className="flex items-center gap-3">
                        <div className="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg"><Icons.BarChart /></div>
                        <h2 className="text-xl font-black text-slate-100">數據分析中心</h2>
                    </div>
                    <div className="flex items-center gap-4 flex-wrap">
                        <div className="flex items-center gap-2">
                            <span className="text-xs font-bold text-slate-400">分析成員:</span>
                            <select 
                                value={selectedPersonId} 
                                onChange={e => {
                                    setSelectedPersonId(e.target.value);
                                    if(e.target.value && activeTab !== 'personal') setActiveTab('personal');
                                }} 
                                className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 outline-none focus:border-indigo-500 transition-colors"
                            >
                                <option value="">-- 整體概況 (未指定) --</option>
                                {allPersonnelList.map(p => (
                                    <option key={p.id} value={p.id}>{p.name}</option>
                                ))}
                            </select>
                        </div>
                        <div className="flex items-center gap-2 border-l border-slate-700 pl-4">
                            <span className="text-xs font-bold text-slate-400">月份:</span>
                            <input 
                                type="month" 
                                value={selectedMonth} 
                                onChange={e => setSelectedMonth(e.target.value)} 
                                className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 outline-none focus:border-indigo-500 transition-colors"
                            />
                        </div>
                    </div>
                </div>

                {/* Sub-tab Navigation */}
                <div className="flex gap-4 border-b border-slate-800 pb-px mt-2">
                    <button onClick={()=>setActiveTab('overview')} className={`pb-2 text-sm font-bold border-b-2 transition-colors ${activeTab === 'overview' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>總覽數據</button>
                    <button onClick={()=>setActiveTab('daily')} className={`pb-2 text-sm font-bold border-b-2 transition-colors ${activeTab === 'daily' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>單日工作與分佈</button>
                    <button onClick={()=>setActiveTab('personal')} className={`pb-2 text-sm font-bold border-b-2 transition-colors ${activeTab === 'personal' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>單一成員統計圖</button>
                </div>

                {/* Tab 1: Overview */}
                {activeTab === 'overview' && (
                    <div className="space-y-6 fade-in">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-sm flex flex-col justify-center items-center hover:border-slate-700 transition-colors">
                                <span className="text-xs text-slate-400 font-bold mb-1">本月總工作排班</span>
                                <span className="text-4xl font-black text-blue-400">{analytics.totalGlobalTasks} <span className="text-sm text-blue-500/50"> 人次</span></span>
                            </div>
                            
                            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-sm flex flex-col justify-center items-center hover:border-slate-700 transition-colors text-center group">
                                <span className="text-xs text-slate-400 font-bold mb-1 flex items-center gap-1">
                                    本月總休假 <span className="text-slate-600 opacity-0 group-hover:opacity-100 cursor-pointer hover:text-indigo-400" onClick={()=>setEditingStat('leave')} title="手動調整">✎</span>
                                </span>
                                {editingStat === 'leave' ? (
                                    <input autoFocus defaultValue={displayLeave} onBlur={e => handleSaveManualStat('leave', e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSaveManualStat('leave', e.target.value)} className="w-20 text-center bg-slate-800 text-slate-200 border border-indigo-500 rounded px-2 py-1 text-2xl font-black mt-1 outline-none" placeholder="預設" />
                                ) : (
                                    <span className={`text-4xl font-black mt-2 cursor-pointer ${manualStats?.[selectedMonth]?.leave !== undefined ? 'text-indigo-400' : 'text-rose-400'}`} onClick={()=>setEditingStat('leave')} title="點擊修改數值">
                                        {displayLeave}
                                        <span className={`text-sm font-normal ${manualStats?.[selectedMonth]?.leave !== undefined ? 'text-indigo-500/50' : 'text-rose-500/50'}`}> 人次</span>
                                    </span>
                                )}
                            </div>

                            <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-sm flex flex-col justify-center items-center hover:border-slate-700 transition-colors group">
                                <span className="text-xs text-slate-400 font-bold mb-1 flex items-center gap-1">
                                    平均閒置天數 (基準:{analytics.weekdays}天) <span className="text-slate-600 opacity-0 group-hover:opacity-100 cursor-pointer hover:text-indigo-400" onClick={()=>setEditingStat('idle')} title="手動調整">✎</span>
                                </span>
                                {editingStat === 'idle' ? (
                                    <input autoFocus defaultValue={displayIdle} onBlur={e => handleSaveManualStat('idle', e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSaveManualStat('idle', e.target.value)} className="w-20 text-center bg-slate-800 text-slate-200 border border-indigo-500 rounded px-2 py-1 text-2xl font-black mt-1 outline-none" placeholder="預設" />
                                ) : (
                                    <span className={`text-4xl font-black mt-2 cursor-pointer ${manualStats?.[selectedMonth]?.idle !== undefined ? 'text-indigo-400' : 'text-amber-400'}`} onClick={()=>setEditingStat('idle')} title="點擊修改數值">
                                        {displayIdle} 
                                        <span className={`text-sm font-normal ${manualStats?.[selectedMonth]?.idle !== undefined ? 'text-indigo-500/50' : 'text-amber-500/50'}`}> 天/人</span>
                                    </span>
                                )}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-sm">
                                <h3 className="font-bold text-slate-200 mb-6 flex items-center gap-2">
                                    <span className="w-1.5 h-5 bg-blue-500 rounded-full"></span>整體工作總結 (任務分佈)
                                </h3>
                                <div className="space-y-4">
                                    {Object.entries(analytics.globalTaskCounts).sort((a,b)=>b[1]-a[1]).map(([taskId, count]) => {
                                        const task = taskTypes.find(t => t.id === taskId);
                                        const label = task ? task.label : taskId;
                                        const colorClass = task ? task.color.split(' ')[0] : 'bg-slate-600'; 
                                        const percentage = totalForBar > 0 ? Math.round((count / analytics.totalGlobalTasks) * 100) : 0;
                                        return (
                                            <div key={taskId} className="group">
                                                <div className="flex justify-between text-xs mb-1.5">

                                            {addingToCategory === cat.id && (<div className="animate-in fade-in"><input autoFocus value={tempName} onChange={e => setTempName(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleConfirmAddPerson()} onBlur={() => tempName.trim() ? handleConfirmAddPerson() : setAddingToCategory(null)} placeholder="輸入姓名..." className="w-full text-xs p-2 border-2 border-indigo-500 bg-slate-800 text-slate-200 rounded-lg outline-none shadow-sm" /></div>)}
                                            {(!personnel[cat.id]?.length && addingToCategory !== cat.id) && (<div className="h-full flex items-center justify-center text-[10px] text-slate-600 italic pointer-events-none">拖曳至此</div>)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                ))}
            </div>
        );
    });

    const App = () => {
          const [currentView, setCurrentView] = useState('dashboard');

          const [isScrolled, setIsScrolled] = useState(false);
          const [errorMsg, setErrorMsg] = useState('');
          const [confirmDialog, setConfirmDialog] = useState({ show: false, message: '', onConfirm: null });

          const [newCourse, setNewCourse] = useState({
              name: '透視', type: 'regular', batch: '', students: 0, startDate: '', duration: 70, endDate: ''
          });

          const fileInputRef = useRef(null);
          const categories = useMemo(() => categoryGroups.flatMap(g => g.items), [categoryGroups]);

          // ==========================================
          // 核心修正：改用 Supabase 進行跨裝置永久同步

          useEffect(() => {

              const loadData = async () => {

                      const { data, error } = await supabase.from('app_settings').select('*');
                      if (error) throw error;

                      if (data && data.length > 0) {
                          const state = {};
                          data.forEach(row => { state[row.key] = row.value; });
                          
                          if (state.categoryGroups) setCategoryGroups(state.categoryGroups);
                          if (state.taskTypes) setTaskTypes(state.taskTypes);
                          if (state.personnel) {
                              const merged = {};

                              catsToUse.forEach(c => merged[c.id] = state.personnel[c.id] || []);
                              setPersonnel(merged);
                          }
                          if (state.masterCourses) setMasterCourses(state.masterCourses);
                          if (state.attendanceData) setAttendanceData(state.attendanceData);
                          if (state.manualStats) {
                              try {
                                  const parsed = typeof state.manualStats === 'string' ? JSON.parse(state.manualStats) : state.manualStats;
                                  setManualStats(parsed);
                              } catch(e) {}
                          }
                          if (state.monthlyData) {
                              try {
                                  const parsed = typeof state.monthlyData === 'string' ? JSON.parse(state.monthlyData) : state.monthlyData;
                                  setMonthlyData(parsed);
                              } catch(e) { console.error("Parse error", e); }
                          }
                          if (state.courseMappings) {
                              try {
                                  const parsed = typeof state.courseMappings === 'string' ? JSON.parse(state.courseMappings) : state.courseMappings;
                                  setCourseMappings(parsed);
                              } catch(e) {}
                          }
                      }
                      setSyncStatus('✅ 已同步');
                  } catch (err) {
                      console.error("Supabase load error:", err);
                      setSyncStatus('❌ 讀取失敗 (請確認 RLS 權限與資料表設定)');
                  } finally {
                      setLoading(false);
                  }
              };

              loadData();

              // 訂閱 Supabase Realtime 更新
              const channel = supabase.channel('schema-db-changes')
                  .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, (payload) => {
                      const { key, value } = payload.new;
                      if (!key) return;
                      if (key === 'categoryGroups') setCategoryGroups(value);
                      else if (key === 'taskTypes') setTaskTypes(value);
                      else if (key === 'personnel') setPersonnel(value);
                      else if (key === 'masterCourses') setMasterCourses(value);
                      else if (key === 'attendanceData') setAttendanceData(value);
                      else if (key === 'manualStats') {
                          try {
                              const parsed = typeof value === 'string' ? JSON.parse(value) : value;
                              setManualStats(parsed);
                          } catch(e){}
                      }
                      else if (key === 'monthlyData') {
                          try {
                              const parsed = typeof value === 'string' ? JSON.parse(value) : value;
                              setMonthlyData(parsed);
                          } catch(e){}
                      }
                      else if (key === 'courseMappings') {
                          try {
                              const parsed = typeof value === 'string' ? JSON.parse(value) : value;
                              setCourseMappings(parsed);
                          } catch(e){}
                      }
                  })
                  .subscribe();

              return () => {
                  supabase.removeChannel(channel);
              };
          }, []);

          // 將資料儲存至 Supabase
          const saveData = useCallback(async (key, data) => {
              if (!supabase) return;
              setSyncStatus('同步中...');
              try {
                  const { error } = await supabase.from('app_settings').upsert({ key: key, value: data }, { onConflict: 'key' });
                  if (error) throw error;
                  setSyncStatus('✅ 已同步');
              } catch (e) {
                  console.error("Save error:", e);
                  setSyncStatus('❌ 儲存失敗');
              }
          }, []);

          // --- Logic Hooks ---
          const schedule = useMemo(() => {
              const newSchedule = Array.from({ length: 12 }, (_, i) => ({
                  month: `${i + 1}月`,
                  monthly: monthlyData[i] || [{ name: '月月繪', type: 'monthlyActivity', students: 0, batch: '常駐' }],
                  early: [], mid: [], late: []
              }));

              masterCourses.forEach(course => {
                  if (!course.startDate || !course.endDate) return;
                  const start = new Date(course.startDate);
                  const end = new Date(course.endDate);
                  for (let m = 0; m < 12; m++) {
                      const periods = [{ key: 'early', s: 1, e: 10 }, { key: 'mid', s: 11, e: 20 }, { key: 'late', s: 21, e: 31 }];
                      periods.forEach(p => {
                          const testStart = new Date(start.getFullYear(), m, p.s);
                          const testEnd = new Date(start.getFullYear(), m, p.e);
                          if (start <= testEnd && end >= testStart) {
                              newSchedule[m][p.key].push({ name: course.name, type: course.type, students: course.students, batch: course.batch });
                          }
                      });
                  }
              });
              return newSchedule;
          }, [masterCourses, monthlyData]);

          const movePersonToCategory = useCallback((empId, targetCatId) => {
              if (!targetCatId) return;
              setPersonnel(prevPersonnel => {
                  let currentCatId = null;
                  let personObj = null;
                  for (const [catId, list] of Object.entries(prevPersonnel)) {
                      const found = list.find(p => p.id === empId);
                      if (found) { currentCatId = catId; personObj = found; break; }
                  }
                  if (personObj && currentCatId && currentCatId !== targetCatId) {
                      const newPersonnel = { ...prevPersonnel };
                      newPersonnel[currentCatId] = newPersonnel[currentCatId].filter(p => p.id !== empId);
                      if (!newPersonnel[targetCatId]) newPersonnel[targetCatId] = [];
                      newPersonnel[targetCatId] = [...newPersonnel[targetCatId], personObj];
                      saveData('personnel', newPersonnel); 
                      return newPersonnel;
                  }
                  return prevPersonnel;
              });
          }, [saveData]);

          useEffect(() => {
            const handleScroll = () => setIsScrolled(window.scrollY > 10);
            window.addEventListener('scroll', handleScroll, { passive: true });
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          const calculateEndDate = (startStr, days) => { if (!startStr || !days) return ''; const d = new Date(startStr); d.setDate(d.getDate() + parseInt(days) - 1); return d.toISOString().split('T')[0]; };
          const calculateDuration = (startStr, endStr) => { if (!startStr || !endStr) return 0; const s = new Date(startStr), e = new Date(endStr); if (e < s) return 0; return Math.ceil(Math.abs(e - s) / (86400000)) + 1; };

          const handleAddCourse = useCallback(() => { if (!newCourse.name || !newCourse.startDate) { setErrorMsg("請填寫必要資訊"); return; } const updated = [...masterCourses, { ...newCourse, id: generateId() }]; setMasterCourses(updated); saveData('masterCourses', updated); setNewCourse({ ...newCourse, batch: '', students: 0, startDate: '', endDate: '' }); setShowCourseModal(false); setErrorMsg(''); }, [masterCourses, newCourse, saveData]);
          const handleUpdateCourse = useCallback((id, field, val) => { const updated = masterCourses.map(c => { if (c.id !== id) return c; const nc = { ...c, [field]: val }; if (field === 'startDate') nc.endDate = calculateEndDate(val, nc.duration); if (field === 'duration') nc.endDate = calculateEndDate(nc.startDate, val); if (field === 'endDate') nc.duration = calculateDuration(nc.startDate, val); return nc; }); setMasterCourses(updated); saveData('masterCourses', updated); }, [masterCourses, saveData]);
          const handleDeleteCourse = useCallback((id) => { 
              setConfirmDialog({ show: true, message: "確定要刪除此課程嗎？", onConfirm: () => {
                  const updated = masterCourses.filter(c => c.id !== id); setMasterCourses(updated); saveData('masterCourses', updated); 
              }});
          }, [masterCourses, saveData]);
          
          const handleUpdateManualStats = useCallback((newData) => {
              setManualStats(newData);
              saveData('manualStats', newData);
          }, [saveData]);

          const handleMonthlyChange = useCallback((mIdx, val) => { 
              const newData = [...monthlyData];
              const monthArr = newData[mIdx] ? [...newData[mIdx]] : [{ name: '月月繪', type: 'monthlyActivity', students: 0, batch: '常駐' }];
              monthArr[0] = { ...monthArr[0], students: val };
              newData[mIdx] = monthArr;
              setMonthlyData(newData);
              saveData('monthlyData', newData); 
          }, [monthlyData, saveData]);

          const handleConfirmAddPerson = useCallback(() => { if (!tempName.trim() || !addingToCategory) return; const newP = { id: generateId(), name: tempName.trim() }; const newPersonnel = { ...personnel, [addingToCategory]: [...(personnel[addingToCategory] || []), newP] }; setPersonnel(newPersonnel); saveData('personnel', newPersonnel); setTempName(''); setAddingToCategory(null); }, [tempName, addingToCategory, personnel, saveData]);
          const handleRemovePerson = useCallback(() => { if (!deleteTarget) return; const newPersonnel = { ...personnel }; newPersonnel[deleteTarget.categoryId] = newPersonnel[deleteTarget.categoryId].filter(p => p.id !== deleteTarget.personId); setPersonnel(newPersonnel); saveData('personnel', newPersonnel); setShowDeleteModal(false); }, [deleteTarget, personnel, saveData]);
          
          // --- Drag & Drop Handlers ---
          const clearDragStates = useCallback(() => { setDraggedItem(null); setDragOverContainer(null); setDraggedGroupIdx(null); setDraggedCatInfo(null); }, []);
          const onDragStart = useCallback((e, person, fromCategory) => { e.stopPropagation(); setDraggedItem({ person, fromCategory }); e.dataTransfer.effectAllowed = 'move'; }, []);
          const onDragOver = useCallback((e, catId) => { e.preventDefault(); if (dragOverContainer !== catId) setDragOverContainer(catId); }, [dragOverContainer]);
          const onDrop = useCallback((e, toCategory) => { e.preventDefault(); setDragOverContainer(null); if (!draggedItem || draggedItem.fromCategory === toCategory) return; const newPersonnel = { ...personnel }; newPersonnel[draggedItem.fromCategory] = newPersonnel[draggedItem.fromCategory].filter(p => p.id !== draggedItem.person.id); newPersonnel[toCategory] = [...(newPersonnel[toCategory] || []), draggedItem.person]; setPersonnel(newPersonnel); saveData('personnel', newPersonnel); setDraggedItem(null); }, [draggedItem, personnel, saveData]);
          
          const onGroupDragStart = useCallback((e, idx) => { e.stopPropagation(); setDraggedGroupIdx(idx); e.dataTransfer.effectAllowed = 'move'; }, []);
          const onGroupDrop = useCallback((e, dropIdx) => { e.preventDefault(); e.stopPropagation(); if (draggedGroupIdx === null || draggedGroupIdx === dropIdx) { clearDragStates(); return; } const newGroups = [...categoryGroups]; const [moved] = newGroups.splice(draggedGroupIdx, 1); newGroups.splice(dropIdx, 0, moved); setCategoryGroups(newGroups); saveData('categoryGroups', newGroups); clearDragStates(); }, [draggedGroupIdx, categoryGroups, saveData, clearDragStates]);
          const onCatDragStart = useCallback((e, groupIdx, catIdx) => { e.stopPropagation(); setDraggedCatInfo({ groupIdx, catIdx }); e.dataTransfer.effectAllowed = 'move'; }, []);
          const onCatDrop = useCallback((e, targetGroupIdx, targetCatIdx) => { e.preventDefault(); e.stopPropagation(); if (!draggedCatInfo) { clearDragStates(); return; } const { groupIdx: srcG, catIdx: srcC } = draggedCatInfo; if (srcG === targetGroupIdx && srcC === targetCatIdx) { clearDragStates(); return; } const newGroups = JSON.parse(JSON.stringify(categoryGroups)); const [moved] = newGroups[srcG].items.splice(srcC, 1); newGroups[targetGroupIdx].items.splice(targetCatIdx, 0, moved); setCategoryGroups(newGroups); saveData('categoryGroups', newGroups); clearDragStates(); }, [draggedCatInfo, categoryGroups, saveData, clearDragStates]);

          const updateAttendance = useCallback(async (empId, date, status, context) => { 
              setAttendanceData(prev => {
                  const newData = { ...prev };
                  newData[empId] = { ...(newData[empId] || {}) };
                  
                  if (!status) {
                      delete newData[empId][date];
                  } else {
                      newData[empId][date] = { status, context };
                  }
                  
                  saveData('attendanceData', newData);
                  return newData;
              });
              
              if (status) {
                  const taskConfig = taskTypes.find(t => t.id === status);
                  if (taskConfig && taskConfig.targetCategory) movePersonToCategory(empId, taskConfig.targetCategory);
              }
          }, [taskTypes, movePersonToCategory, saveData]);
          
          const batchUpdateAttendance = useCallback(async (records) => { 
              setAttendanceData(prev => {
                  const newData = { ...prev };
                  records.forEach(r => { 
                      newData[r.employee_id] = { ...(newData[r.employee_id] || {}) }; 
                      newData[r.employee_id][r.date] = { status: r.status, context: r.context }; 
                  });
                  saveData('attendanceData', newData);
                  return newData;

              if (records.length > 0) {
                  const taskConfig = taskTypes.find(t => t.id === records[0].status);
                  if (taskConfig && taskConfig.targetCategory) movePersonToCategory(records[0].employee_id, taskConfig.targetCategory);
              }
          }, [taskTypes, movePersonToCategory, saveData]);

          const handleExport = () => { const data = { personnel, masterCourses, attendanceData, monthlyData: schedule.map(m => ({ month_index: parseInt(m.month), students: m.monthly[0].students })), settings: { categoryGroups, taskTypes }, timestamp: new Date().toISOString() }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `backup.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };
          const handleImportClick = () => { fileInputRef.current.click(); }
          const handleFileChange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = async (event) => { try { const imported = JSON.parse(event.target.result); 
                setConfirmDialog({ show: true, message: "確認要匯入並覆蓋目前所有的資料嗎？", onConfirm: async () => {
                     if (imported.settings) { 
                         if (imported.settings.categoryGroups) { setCategoryGroups(imported.settings.categoryGroups); await saveData('categoryGroups', imported.settings.categoryGroups); } 
                         if (imported.settings.taskTypes) { setTaskTypes(imported.settings.taskTypes); await saveData('taskTypes', imported.settings.taskTypes); } 
                     } 
                     if (imported.personnel) { setPersonnel(imported.personnel); await saveData('personnel', imported.personnel); } 
                     if (imported.masterCourses) { setMasterCourses(imported.masterCourses); await saveData('masterCourses', imported.masterCourses); } 
                     if (imported.attendanceData) { setAttendanceData(imported.attendanceData); await saveData('attendanceData', imported.attendanceData); } 
                     if (imported.monthlyData) { await saveData('monthlyData', imported.monthlyData); } 
                     if (imported.manualStats) { setManualStats(imported.manualStats); await saveData('manualStats', imported.manualStats); }
                     if (imported.settings?.courseMappings) { setCourseMappings(imported.settings.courseMappings); await saveData('courseMappings', imported.settings.courseMappings); }
                     setSyncStatus('✅ 匯入完成'); 
                     setForceRefresh(p=>p+1);
                }});
          } catch(e){} }; reader.readAsText(file); e.target.value=''; };
          
          const handleSaveCategories = (newGroups) => { setCategoryGroups(newGroups); saveData('categoryGroups', newGroups); setShowCategoryModal(false); };
          const handleSaveTaskTypes = (newTypes) => { setTaskTypes(newTypes); saveData('taskTypes', newTypes); setShowTaskTypeModal(false); };

          const stats = useMemo(() => {
              let allocated = 0; let frontline = 0;
              categories.forEach(c => { const count = personnel[c.id]?.length || 0; if (c.id !== 'pool') allocated += count; if (c.type === 'frontline') frontline += count; });
              const total = allocated + (personnel['pool']?.length || 0);
              return { total, allocated, unallocated: personnel['pool']?.length || 0, frontline };
          }, [personnel, categories]);
          const studentStats = useMemo(() => { let total = 0; masterCourses.forEach(c => total += (parseInt(c.students) || 0)); return { total }; }, [masterCourses]);
          const dailyStats = useMemo(() => {
              const todayStr = new Date().toISOString().split('T')[0];
              let workingToday = 0; let leaveToday = 0;
              Object.values(attendanceData).forEach(records => {
                  const todayRecord = records[todayStr];
                  if (todayRecord) { if (todayRecord.status === 'leave' || todayRecord.status === 'sick') leaveToday++; else workingToday++; }
              });
              return { workingToday, leaveToday };
          }, [attendanceData]);

          // --- 人力需求試算邏輯 ---
          const calculateManpower = useCallback((courseName, students) => {
              if (!students || students <= 0) return { frontline: 0 };
              let frontline = 0;

              if (courseName.includes('透視')) {
                  frontline = Math.ceil(students / 270);
              } else if (courseName.includes('構成') || (courseName.includes('色彩') && !courseName.includes('營'))) {
                  frontline = Math.ceil(students / 250);
              } else if (courseName.includes('速寫') || courseName.includes('線條訓練營') || courseName.includes('色彩訓練營')) {
                  // 表格 2 的級距
                  if (students <= 3000) frontline = 8;
                  else if (students <= 4000) frontline = 10;
                  else if (students <= 5000) frontline = 12;
                  else if (students <= 6000) frontline = 13;
                  else frontline = 13 + Math.ceil((students - 6000) / 1000) * 2; // 超過6000的簡單估算
              } else if (courseName.includes('月月繪')) {
                  frontline = 1;
              } else {
                  // 未知課程預設使用 250 級距
                  frontline = Math.ceil(students / 250);
              }
              return { frontline };
          }, []);

          const getHealthStatus = (required, available) => {
              if (required === 0) return { text: '無需', class: 'text-slate-500 bg-slate-800 border-slate-700' };
              if (available >= required) return { text: '充足', class: 'text-emerald-400 bg-emerald-900/20 border-emerald-500/30' };
              if (available >= required * 0.75) return { text: '吃緊', class: 'text-amber-400 bg-amber-900/20 border-amber-500/30' };
              return { text: '不足', class: 'text-rose-400 bg-rose-900/20 border-rose-500/30 animate-pulse' };
          };

          if (loading) return <div className="h-screen flex items-center justify-center bg-slate-950 text-slate-400 font-medium">載入中...</div>;

          return (

                                    <div className="flex items-center gap-3">
                                        <span className="text-xs text-emerald-400 bg-emerald-900/20 px-2 py-0.5 rounded border border-emerald-500/20">➔ {categories.find(c=>c.id===catId)?.label || catId}</span>
                                        <button onClick={() => {
                                            const newMap = {...courseMappings}; delete newMap[cName];
                                            setCourseMappings(newMap); saveData('courseMappings', newMap);
                                        }} className="text-slate-500 hover:text-rose-400"><Icons.Trash /></button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                            <h4 className="font-bold text-slate-300 text-sm mb-3">新增連動規則</h4>
                            <div className="space-y-3">
                                <input value={newMapping.courseName} onChange={e=>setNewMapping({...newMapping, courseName: e.target.value})} placeholder="輸入課程名稱 (如: 新手營)" className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-slate-200 outline-none focus:border-indigo-500" />
                                <select value={newMapping.categoryId} onChange={e=>setNewMapping({...newMapping, categoryId: e.target.value})} className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-slate-200 outline-none focus:border-indigo-500">
                                    <option value="">-- 選擇對應的人員分類 --</option>
                                    {categories.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                </select>
                                <button onClick={() => {
                                    if(!newMapping.courseName || !newMapping.categoryId) return;
                                    const newMap = {...courseMappings, [newMapping.courseName]: newMapping.categoryId};
                                    setCourseMappings(newMap); saveData('courseMappings', newMap);
                                    setNewMapping({ courseName: '', categoryId: '' });
                                }} className="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 shadow-md">新增連動</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {/* Modals */}
            {showCourseModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg p-6 animate-in zoom-in-95 duration-200 border border-slate-800">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-slate-100">新增課程計畫</h3><button onClick={() => setShowCourseModal(false)} className="text-slate-400 hover:text-slate-200"><Icons.X /></button></div>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">課程名稱</label><select value={newCourse.name} onChange={e => { const sel = COURSE_TYPES.find(c => c.label === e.target.value); setNewCourse({...newCourse, name:e.target.value, type:sel.value, duration:sel.days}); }} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200">{COURSE_TYPES.map(c => <option key={c.label} value={c.label}>{c.label}</option>)}</select></div>
                                <div><label className="block text-xs font-bold text-slate-400 mb-1">期數 (如 S1)</label><input type="text" value={newCourse.batch} onChange={e => setNewCourse({...newCourse, batch:e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200" placeholder="S1" /></div>
                            </div>
                            <div className="grid grid-cols-3 gap-4">
                                <div className="col-span-1"><label className="block text-xs font-bold text-slate-400 mb-1">開始日期</label><input type="date" value={newCourse.startDate} onChange={e => setNewCourse({...newCourse, startDate:e.target.value, endDate: calculateEndDate(e.target.value, newCourse.duration)})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200" /></div>
                                <div className="col-span-1"><label className="block text-xs font-bold text-slate-500 mb-1">天數</label><input type="number" value={newCourse.duration} onChange={e => setNewCourse({...newCourse, duration:e.target.value, endDate: calculateEndDate(newCourse.startDate, e.target.value)})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-indigo-500 text-slate-200" /></div>
                                <div className="col-span-1"><label className="block text-xs font-bold text-slate-500 mb-1">結束日期 (自動)</label><input type="date" value={newCourse.endDate} readOnly className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-600 outline-none cursor-not-allowed" /></div>
                            </div>
                            <div><label className="block text-xs font-bold text-slate-400 mb-1">預估人數</label><input type="number" value={newCourse.students} onChange={e => setNewCourse({...newCourse, students:parseInt(e.target.value)||0})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-indigo-400" placeholder="0" /></div>
                            {errorMsg && <div className="text-rose-400 text-xs font-bold bg-rose-900/30 p-2 rounded">{errorMsg}</div>}
                            <div className="pt-4 flex gap-3"><button onClick={() => setShowCourseModal(false)} className="flex-1 py-3 rounded-xl font-bold text-slate-400 hover:bg-slate-800 transition-colors">取消</button><button onClick={handleAddCourse} className="flex-1 py-3 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-900/50 transition-all transform active:scale-95">確認新增</button></div>
                        </div>
                    </div>
                </div>
            )}
            
            {showCategoryModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg p-6 animate-in zoom-in-95 duration-200 border border-slate-800 max-h-[80vh] overflow-y-auto custom-scrollbar">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-slate-100">管理人員分類</h3><button onClick={() => setShowCategoryModal(false)} className="text-slate-400 hover:text-slate-200"><Icons.X /></button></div>
                        <div className="space-y-6">
                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                <h4 className="font-bold text-slate-300 text-sm mb-3">新增大分類 (Group)</h4>
                                <div className="flex gap-2">
                                    <input value={newGroupForm} onChange={e=>setNewGroupForm(e.target.value)} placeholder="分類名稱 (如: 實習)" className="flex-1 bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-200 outline-none" />
                                    <button onClick={() => {
                                        if(!newGroupForm) return;
                                        const newGroups = [...categoryGroups, { name: newGroupForm, items: [] }];
                                        handleSaveCategories(newGroups);
                                        setNewGroupForm('');
                                    }} className="bg-indigo-600 text-white px-3 py-2 rounded text-xs font-bold hover:bg-indigo-700">新增</button>
                                </div>
                            </div>

                            {categoryGroups.map((group, idx) => (
                                <div key={idx} className="border-b border-slate-800 pb-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="font-bold text-indigo-400">{group.name}</h4>
                                        <button onClick={() => {
                                            setConfirmDialog({ show: true, message: '確定刪除此分類群組？', onConfirm: () => {
                                                const newGroups = categoryGroups.filter((_, i) => i !== idx);
                                                handleSaveCategories(newGroups);
                                            }});
                                        }} className="text-rose-500 text-xs hover:text-rose-400">刪除群組</button>
                                    </div>
                                    <div className="space-y-2">
                                        {group.items.map(cat => (
                                            <div key={cat.id} className="flex justify-between items-center bg-slate-800 p-2 rounded">
                                                <span className="text-xs text-slate-300">{cat.label} <span className="text-slate-500">({cat.id})</span></span>
                                                <button onClick={() => {
                                                    setConfirmDialog({ show: true, message: '確定刪除此職能？', onConfirm: () => {
                                                        const newGroups = [...categoryGroups];
                                                        newGroups[idx].items = newGroups[idx].items.filter(c => c.id !== cat.id);
                                                        handleSaveCategories(newGroups);
                                                    }});
                                                }} className="text-slate-500 hover:text-rose-500"><Icons.Trash /></button>
                                            </div>
                                        ))}
                                        <div className="flex gap-2 mt-2">
                                            <input value={newCatForm.id} onChange={e=>setNewCatForm({...newCatForm, id:e.target.value})} placeholder="ID (英數)" className="w-1/3 bg-slate-900 border border-slate-600 rounded p-1.5 text-xs text-slate-200" />
                                            <input value={newCatForm.label} onChange={e=>setNewCatForm({...newCatForm, label:e.target.value})} placeholder="名稱" className="flex-1 bg-slate-900 border border-slate-600 rounded p-1.5 text-xs text-slate-200" />
                                            <button onClick={() => {
                                                if(!newCatForm.id || !newCatForm.label) return;
                                                const newGroups = [...categoryGroups];
                                                newGroups[idx].items.push({ id: newCatForm.id, label: newCatForm.label, type: 'frontline' }); // Default type
                                                handleSaveCategories(newGroups);
                                                setNewCatForm({ groupIdx: 0, label: '', id: '' });
                                            }} className="bg-slate-700 text-slate-300 px-3 rounded text-xs hover:bg-slate-600">+</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )}
            
            {showTaskTypeModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg p-6 animate-in zoom-in-95 duration-200 border border-slate-800 max-h-[80vh] overflow-y-auto custom-scrollbar">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold text-slate-100">管理工作類型</h3><button onClick={() => setShowTaskTypeModal(false)} className="text-slate-400 hover:text-slate-200"><Icons.X /></button></div>
                        
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6">
                            <h4 className="font-bold text-slate-300 text-sm mb-3">新增類型</h4>
                            <div className="grid grid-cols-2 gap-3 mb-3">
                                <input value={newTaskForm.id} onChange={e=>setNewTaskForm({...newTaskForm, id:e.target.value})} placeholder="ID (如: meeting)" className="bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-200 outline-none" />
                                <input value={newTaskForm.label} onChange={e=>setNewTaskForm({...newTaskForm, label:e.target.value})} placeholder="名稱 (如: 會議)" className="bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-200 outline-none" />
                            </div>
                            <div className="grid grid-cols-2 gap-3 mb-3">
                                <input value={newTaskForm.color} onChange={e=>setNewTaskForm({...newTaskForm, color:e.target.value})} placeholder="Tailwind Color (如: bg-red-500 text-white)" className="bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-200 outline-none" />
                                <select value={newTaskForm.targetCategory} onChange={e=>setNewTaskForm({...newTaskForm, targetCategory:e.target.value})} className="bg-slate-900 border border-slate-600 rounded p-2 text-xs text-slate-200 outline-none">
                                    <option value="">(無連動)</option>
                                    {categories.map(c => <option key={c.id} value={c.id}>連動到: {c.label}</option>)}
                                </select>
                            </div>
                            <button onClick={() => {
                                if(!newTaskForm.id || !newTaskForm.label) return;
                                const newTypes = [...taskTypes, newTaskForm];
                                handleSaveTaskTypes(newTypes);
                                setNewTaskForm({ id: '', label: '', color: 'bg-indigo-600 text-indigo-50 shadow-sm', targetCategory: '' });
                            }} className="w-full bg-indigo-600 text-white py-2 rounded font-bold hover:bg-indigo-700">新增</button>
                        </div>

                        <div className="space-y-2">
                            {taskTypes.map(task => (
                                <div key={task.id} className="flex justify-between items-center bg-slate-800 p-3 rounded border border-slate-700">
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <span className={`text-[10px] px-2 py-0.5 rounded ${task.color}`}>{task.label}</span>
                                            <span className="text-xs text-slate-500">ID: {task.id}</span>
                                        </div>
                                        {task.targetCategory && <div className="text-[10px] text-emerald-400 mt-1">連動 ➔ {categories.find(c=>c.id===task.targetCategory)?.label || task.targetCategory}</div>}
                                    </div>
                                    <button onClick={() => {
                                        setConfirmDialog({ show: true, message: '確定刪除此工作類型？', onConfirm: () => {
                                            const newTypes = taskTypes.filter(t => t.id !== task.id);
                                            handleSaveTaskTypes(newTypes);
                                        }});
                                    }} className="text-slate-500 hover:text-rose-500"><Icons.Trash /></button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )}
            
            {showDeleteModal && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div className="bg-slate-900 rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-in zoom-in-95 border border-slate-800">
                  <h3 className="font-bold text-lg text-slate-100 mb-2">確認刪除?</h3>
                  <p className="text-slate-400 text-sm mb-6">此動作無法復原，請確認是否要移除此項目。</p>
                  <div className="flex gap-3"><button onClick={() => setShowDeleteModal(false)} className="flex-1 py-2.5 rounded-xl font-bold text-slate-400 hover:bg-slate-800">取消</button><button onClick={handleRemovePerson} className="flex-1 py-2.5 rounded-xl font-bold bg-rose-600 text-white hover:bg-rose-700 shadow-lg shadow-rose-900/50">刪除</button></div>
                </div>
              </div>
            )}
         </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
