    .attendance-cell:hover { background-color: rgba(30, 41, 59, 0.8); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <script type="text/babel" data-type="module">
    const { useState, useMemo, useEffect, useCallback, useRef, memo } = React;

    // --- 圖標集 ---
    const Icons = {

      Users: ({size=20, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
      Calendar: ({size=20, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
      CalendarDays: ({size=20, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>,

      Trash: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
      Edit: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>,
      ChevronDown: ({size=18, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 9 6 6 6-6"/></svg>,
      ChevronUp: ({size=18, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m18 15-6-6-6 6"/></svg>,
      ChevronLeft: ({size=20, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 18-6-6 6-6"/></svg>,
      ChevronRight: ({size=20, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg>,
      Cloud: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.5 19c0-1.7-1.3-3-3-3h-1.1c-.1-2.6-2.1-4.6-4.6-4.8C6 11.3 3.8 13.5 4 16.3c.1 1.5 1.5 2.7 3 2.7h10.5Z"/><path d="M12 3v9"/><path d="m8 8 4-4 4 4"/></svg>,
      X: ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
      Search: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
      Download: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
      Upload: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
      Settings: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
      List: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>,
      BarChart: ({size=20, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>,
      Database: ({size=20, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>,
      Lock: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
      Unlock: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>,
      Key: ({size=16, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>,
    };

    // --- 全域常數 ---
    const DEFAULT_CATEGORY_GROUPS = [
        { name: '管理', items: [{ id: 'supervisor', label: '主管', type: 'admin' }, { id: 'leader', label: '組長', type: 'admin' }] },
        { name: '講師群', items: [{ id: 'lec_persp', label: '透視小灶', type: 'teaching' }, { id: 'lec_color', label: '色彩小灶', type: 'teaching' }] },
        { name: '一線團隊', items: [{ id: 'regular', label: '課件製作', type: 'frontline' }]},
        { name: '待命', items: [{ id: 'pool', label: '尚未分配', type: 'pool' }] }
    ];
    const DEFAULT_TASK_TYPES = [
        { id: 'working', label: '上班', color: 'bg-indigo-600 text-indigo-50', targetCategory: null },
        { id: 'teaching', label: '授課', color: 'bg-purple-600 text-purple-50', targetCategory: null },
        { id: 'leave', label: '休假', color: 'bg-rose-600 text-rose-50', targetCategory: null }
    ];
    const COURSE_TYPES = [
        { label: '透視', value: 'regular', days: 70 },
        { label: '構成', value: 'regular', days: 70 },
        { label: '色彩', value: 'regular', days: 70 },
        { label: '線條訓練營', value: 'camp30', days: 49 },
        { label: '色彩訓練營', value: 'camp30', days: 49 },
        { label: '速寫團練', value: 'sketch', days: 60 },
    ];

    const initialProjects = [{ id: 'P1', name: '2025 透視課件全面翻修', pm: '大雪', status: '進行中', progress: 45, students: 200, startDate: '2025-02-13', endDate: '2025-07-20', docLinks: [] }];
    const initialPersonnel = { 'supervisor': [{ id: 'M1', name: '大雪', customTags: [] }], 'regular': [{ id: 'M3', name: 'YUC', customTags: [] }] };

    // --- 輔助函數 ---
    const calculateEndDate = (startStr, days) => { if (!startStr || !days) return ''; const d = new Date(startStr); d.setDate(d.getDate() + parseInt(days) - 1); return d.toISOString().split('T')[0]; };
    const calculateDuration = (startStr, endStr) => { if (!startStr || !endStr) return 0; const s = new Date(startStr), e = new Date(endStr); if (e < s) return 0; return Math.ceil(Math.abs(e - s) / (86400000)) + 1; };

    // --- UI Components ---
    const KPICard = memo(({ title, value, icon, color, glow, details }) => (
        <div className="relative bg-slate-900/60 backdrop-blur-xl rounded-3xl border border-slate-800/80 shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 group z-10 hover:z-20">
            <div className="absolute inset-0 overflow-hidden rounded-3xl z-0 pointer-events-none">
                <div className={`absolute -right-6 -top-6 w-32 h-32 rounded-full blur-[50px] opacity-20 group-hover:opacity-40 transition-opacity duration-500 ${glow}`}></div>
            </div>
            <div className="p-6 flex items-center gap-5 relative z-10">
                <div className={`p-4 rounded-2xl ${color} shadow-inner`}>{icon}</div>
                <div className="flex flex-col justify-center">
                    <div className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">{title}</div>
                    <div className="text-3xl font-black text-slate-100 drop-shadow-md">{value}</div>
                </div>
            </div>
            {details && (
                <div className="absolute top-[calc(100%+8px)] left-0 w-full opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 translate-y-[-10px] group-hover:translate-y-0 z-50">
                    <div className="bg-slate-800/95 backdrop-blur-xl border border-slate-700/50 p-4 rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.8)]">
                        {details}
                    </div>
                </div>
            )}
        </div>
    ));

    const CourseRow = memo(({ course, onUpdate, onDelete, isEditingAllowed }) => (
        <tr className="border-b border-slate-800/50 last:border-0 hover:bg-slate-800/40 transition-colors group">
            <td className="p-4 pl-6 font-bold text-slate-200">{course.name}</td>
            <td className="p-4 text-slate-400 font-medium"><input type="text" value={course.batch || ''} disabled={!isEditingAllowed} onChange={e => onUpdate(course.id, 'batch', e.target.value)} className="bg-transparent border-b-2 border-transparent hover:border-slate-600 focus:border-indigo-500 outline-none w-[60px] text-sm px-2 py-1.5 rounded-lg transition-all" placeholder="S1" /></td>
            <td className="p-4"><input type="date" value={course.startDate || ''} disabled={!isEditingAllowed} onChange={e => onUpdate(course.id, 'startDate', e.target.value)} className="bg-transparent border-b-2 border-transparent hover:border-slate-600 focus:border-indigo-500 outline-none w-[130px] text-sm px-2 py-1.5 rounded-lg transition-all cursor-pointer" /></td>
            <td className="p-4"><input type="number" value={course.duration || 0} disabled={!isEditingAllowed} onChange={e => onUpdate(course.id, 'duration', e.target.value)} className="bg-transparent border-b-2 border-transparent hover:border-slate-600 focus:border-indigo-500 outline-none w-20 text-center text-sm px-1 py-1.5 rounded-lg transition-all" /></td>
            <td className="p-4"><input type="date" value={course.endDate || ''} disabled={!isEditingAllowed} onChange={e => onUpdate(course.id, 'endDate', e.target.value)} className="bg-transparent border-b-2 border-transparent hover:border-slate-600 focus:border-indigo-500 outline-none w-[130px] text-sm px-2 py-1.5 rounded-lg transition-all cursor-pointer" /></td>
            <td className="p-4"><input type="number" value={course.students || 0} disabled={!isEditingAllowed} onChange={e => onUpdate(course.id, 'students', parseInt(e.target.value) || 0)} className="bg-transparent border-b-2 border-transparent hover:border-indigo-900 focus:border-indigo-400 outline-none w-24 text-center font-bold text-indigo-400 px-1 py-1.5 rounded-lg transition-all" /></td>
            <td className="p-4 text-right pr-6">{isEditingAllowed && <button onClick={() => onDelete(course.id)} className="text-slate-600 hover:text-rose-500 hover:bg-rose-500/10 p-2.5 rounded-xl transition-all opacity-0 group-hover:opacity-100"><Icons.Trash /></button>}</td>
        </tr>
    ));

    // --- 子視圖組件 ---
    const DashboardView = ({ masterCourses, personnel, calculateManpower, getHealthStatus, courseMappings }) => {
        const [selectedMonth, setSelectedMonth] = useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; });
        const monthData = useMemo(() => {
            const [y, m] = selectedMonth.split('-');
            const targetYear = parseInt(y), targetMonth = parseInt(m) - 1;
            const active = (masterCourses || []).filter(c => {
                if(!c.startDate || !c.endDate) return false;
                const s = new Date(c.startDate), e = new Date(c.endDate);
                const startM = s.getFullYear() * 12 + s.getMonth(), endM = e.getFullYear() * 12 + e.getMonth();
                const targetM = targetYear * 12 + targetMonth;
                return targetM >= startM && targetM <= endM;
            });
            return { active, totalStudents: active.reduce((acc, c) => acc + (parseInt(c.students) || 0), 0) };
        }, [masterCourses, selectedMonth]);

        const studentBreakdownUI = useMemo(() => {
            if ((monthData.active || []).length === 0) return <div className="text-xs text-slate-400 text-center">本月無學生資料</div>;
            return (
                <div className="space-y-2 max-h-[200px] overflow-y-auto custom-scrollbar pr-2">
                    <div className="text-xs font-bold text-slate-400 mb-2 border-b border-slate-700/50 pb-2 sticky top-0 bg-slate-800/95 backdrop-blur-xl">本月各課程學生數</div>
                    {[...(monthData.active || [])].sort((a,b) => (b.students || 0) - (a.students || 0)).map(c => (
                        <div key={c.id} className="flex justify-between items-center text-xs gap-6 hover:bg-slate-700/30 p-1.5 rounded-lg transition-colors">
                            <span className="text-slate-300 font-medium">{c.name} {c.batch && <span className="text-[10px] text-slate-500 bg-slate-900 px-1 rounded ml-1 border border-slate-700">{c.batch}</span>}</span>
                            <span className="font-bold text-emerald-400">{c.students || 0} <span className="text-[10px] text-slate-500 font-normal">人</span></span>
                        </div>
                    ))}
                </div>
            );
        }, [monthData.active]);

        return (
            <div className="space-y-6 pb-20 fade-in">
                <div className="flex justify-between items-center bg-slate-900 p-5 rounded-3xl border border-slate-800">
                    <div className="flex items-center gap-4"><div className="p-3 bg-indigo-600 rounded-xl"><Icons.Dashboard /></div><h2 className="text-xl font-black">營運儀表板</h2></div>
                    <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="bg-slate-800 border-none rounded-xl p-2 font-bold text-indigo-400 outline-none cursor-pointer" />
                </div>
                <div className="grid grid-cols-2 gap-6">
                    <KPICard title="本月活躍課程" value={`${monthData.active.length} 門`} icon={<Icons.List size={24} />} color="bg-indigo-900" />
                    <KPICard title="預計帶班學生" value={`${monthData.totalStudents} 人`} icon={<Icons.Users size={24} />} color="bg-emerald-900" details={studentBreakdownUI} />
                </div>
                <div className="bg-slate-900/60 p-6 rounded-3xl border border-slate-800 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {monthData.active.length === 0 ? <div className="col-span-3 text-center text-slate-500 py-10 font-bold">本月無活躍專案</div> : monthData.active.map(c => {
                        const req = calculateManpower(c.name || '', c.students);
                        const mappedCat = (courseMappings || {})[c.name];
                        const available = mappedCat && personnel[mappedCat] ? personnel[mappedCat].length : 0;
                        const status = getHealthStatus(req.frontline, available);
                        return (

    const TimelineView = memo(({ masterCourses }) => {

        const months = Array.from({length: 12}, (_, i) => i + 1);
        
        const getCourseColor = (type) => {
            if (type === 'regular') return 'from-blue-600 to-indigo-600 text-white';
            if (type === 'sketch') return 'from-orange-500 to-amber-600 text-white';
            if (type === 'camp30') return 'from-emerald-500 to-teal-600 text-white';
            return 'from-slate-600 to-slate-700 text-white';
        };
        const validCourses = (masterCourses || []).filter(c => c && c.startDate && c.endDate);

        return (
            <div className="animate-fade-in-up max-w-[1400px] mx-auto space-y-8 pb-24">
                <div className="bg-slate-900/60 backdrop-blur-xl p-5 rounded-3xl shadow-lg border border-slate-800/80 flex items-center gap-4 sticky top-4 z-30">

                <div className="bg-slate-900/60 backdrop-blur-xl rounded-3xl shadow-xl border border-slate-800/80 p-6 overflow-x-auto">
                    <div className="min-w-[900px]">
                        <div className="flex items-center justify-between mb-8 px-4 bg-slate-800/40 p-3 rounded-2xl border border-slate-700/50">
                            <button onClick={() => setYear(y => y - 1)} className="p-2.5 hover:bg-slate-700 rounded-xl text-slate-400 hover:text-white transition-all shadow-sm"><Icons.ChevronLeft /></button>
                            <h2 className="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-400">{year} 年</h2>
                            <button onClick={() => setYear(y => y + 1)} className="p-2.5 hover:bg-slate-700 rounded-xl text-slate-400 hover:text-white transition-all shadow-sm"><Icons.ChevronRight /></button>
                        </div>
                        <div className="flex border-b border-slate-800/80 pb-3 mb-4 sticky top-0 z-10">
                            {months.map(m => (<div key={m} className="flex-1 text-center text-sm font-bold text-slate-400 border-r border-slate-800/50 last:border-0">{m}月</div>))}
                        </div>
                        <div className="space-y-4 relative h-[600px] overflow-y-auto custom-scrollbar pr-2 pt-2">
                            <div className="absolute inset-0 flex pointer-events-none z-0">{months.map(m => <div key={m} className="flex-1 border-r border-slate-800/30 last:border-0 h-full"></div>)}</div>
                            {validCourses.length === 0 && <div className="text-center text-slate-500 py-12 font-medium bg-slate-800/20 rounded-2xl mx-4">該年度尚無課程資料。</div>}
                            {validCourses.sort((a,b) => new Date(a.startDate) - new Date(b.startDate)).map(course => {
                                const start = new Date(course.startDate);
                                const end = new Date(course.endDate);
                                if (start.getFullYear() !== year && end.getFullYear() !== year) return null;
                                const yearStart = new Date(year, 0, 1).getTime();
                                const yearEnd = new Date(year, 11, 31).getTime();
                                const duration = yearEnd - yearStart;
                                const cStart = Math.max(start.getTime(), yearStart);
                                const cEnd = Math.min(end.getTime(), yearEnd);
                                if (cEnd < cStart) return null;
                                const left = ((cStart - yearStart) / duration) * 100;
                                const width = ((cEnd - cStart) / duration) * 100;
                                return (
                                    <div key={course.id} className="relative h-10 z-10 hover:z-20 group">
                                        <div className={`absolute h-8 rounded-lg shadow-md text-xs flex items-center px-3 cursor-pointer transition-all duration-300 hover:scale-[1.03] hover:shadow-lg bg-gradient-to-r ${getCourseColor(course.type)}`} style={{ left: `${left}%`, width: `${width}%`, minWidth: '60px' }} title={`${course.name} (${course.startDate} ~ ${course.endDate})`}>
                                            <span className="truncate font-bold drop-shadow-sm">{course.name} {course.batch && <span className="opacity-80 font-normal ml-1">({course.batch})</span>}</span>

                                );

    const WorkScheduleView = memo(({ personnel, categoryGroups, attendanceData, onUpdateAttendance, onBatchUpdate, taskTypes, setShowTaskTypeModal, wsSearchTerm, setWsSearchTerm, wsShowBatchModal, setWsShowBatchModal, wsBatchForm, setWsBatchForm, isEditingAllowed }) => {
        const [selectedMonth, setSelectedMonth] = useState(new Date());
        const [viewMode, setViewMode] = useState('week'); 
        const [expandedGroups, setExpandedGroups] = useState({});
        const [popover, setPopover] = useState(null);
        const [popoverContext, setPopoverContext] = useState("");
        const [batchError, setBatchError] = useState("");
        
        useEffect(() => {
           if (Object.keys(expandedGroups).length === 0 && (categoryGroups || []).length > 0) {
               setExpandedGroups((categoryGroups || []).reduce((acc, g) => ({...acc, [g.name]: true}), {}));
           }
        }, [categoryGroups]);

        const datesToShow = useMemo(() => {
            if (viewMode === 'month') {
                const year = selectedMonth.getFullYear();
                const month = selectedMonth.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                return Array.from({length: daysInMonth}, (_, i) => new Date(year, month, i + 1));
            } else {
                const start = new Date(selectedMonth);
                const day = start.getDay();
                const offset = day === 6 ? 0 : -(day + 1);
                start.setDate(start.getDate() + offset); 
                return Array.from({length: 7}, (_, i) => {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    return d;
                });
            }
        }, [viewMode, selectedMonth]);

        const title = viewMode === 'month' 
           ? `${selectedMonth.getFullYear()}年 ${selectedMonth.getMonth()+1}月`
           : `${datesToShow[0].getMonth()+1}/${datesToShow[0].getDate()} - ${datesToShow[6].getMonth()+1}/${datesToShow[6].getDate()}`;

        const filteredGroups = useMemo(() => (categoryGroups || []).map(g => {
            const filteredItems = (g.items || []).map(cat => ({
                ...cat,
                people: (personnel[cat.id] || []).filter(p => p.name.includes(wsSearchTerm))
            })).filter(cat => cat.people.length > 0);
            return { ...g, items: filteredItems };
        }).filter(g => g.items.length > 0), [categoryGroups, personnel, wsSearchTerm]);
        
        const handleNavigate = (dir) => {
           const d = new Date(selectedMonth);
           if(viewMode === 'month') d.setMonth(d.getMonth() + dir);
           else d.setDate(d.getDate() + dir * 7);
           setSelectedMonth(d);
        };

        const handleCellClick = (e, empId, dateStr, context) => {
            if (!isEditingAllowed) return;
            const rect = e.currentTarget.getBoundingClientRect();
            setPopover({ empId, dateStr, x: rect.left, y: rect.bottom });
            setPopoverContext(context || "");
        };

        const handleSaveCell = (status) => {
           if (popover) {
              onUpdateAttendance(popover.empId, popover.dateStr, status, popoverContext);
              setPopover(null);
              setPopoverContext("");
           }
        };
        
        const handleBatchSubmit = () => {
           setBatchError("");
           if (!wsBatchForm.personId || !wsBatchForm.startDate || !wsBatchForm.endDate || !wsBatchForm.type) { setBatchError("請完整填寫必填項"); return; }

           const start = new Date(wsBatchForm.startDate);
           const end = new Date(wsBatchForm.endDate);

           if (start > end) { setBatchError("結束日期不能早於開始日期"); return; }

           const records = [];
           for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                records.push({
                    employee_id: wsBatchForm.personId,
                    date: d.toISOString().split('T')[0],
                    status: wsBatchForm.type,
                    context: wsBatchForm.context
                });
           }
           onBatchUpdate(records);
           setWsShowBatchModal(false);
           setWsBatchForm({ personId: '', startDate: '', endDate: '', type: (taskTypes||[])[0]?.id || '', context: '' });
        };

        const [newCustomTag, setNewCustomTag] = useState({ label: '', count: 1 });

        const [personnelSearch, setPersonnelSearch] = useState("");

            const list = [];
            Object.entries(personnel || {}).forEach(([catId, arr]) => {
                const catInfo = categories.find(c => c.id === catId);
                (arr || []).forEach(p => {
                    list.push({ ...p, categoryId: catId, categoryLabel: catInfo ? catInfo.label : '未分類' });
                });
            });
            return list.filter(p => p.name.includes(personnelSearch));
        }, [personnel, categories, personnelSearch]);

        const openEditModal = (person) => {
            setEditingPerson({ ...person, customTags: [...(person.customTags || [])] });
            setNewCustomTag({ label: '', count: 1 });
            setIsAddingNewPerson(false);
            setShowEditModal(true);
        };

        const openAddPersonModal = () => {
            setEditingPerson({ id: generateId(), name: '', categoryId: categories[0]?.id || '', customTags: [] });
            setNewCustomTag({ label: '', count: 1 });
            setIsAddingNewPerson(true);
            setShowEditModal(true);
        };

        const handleSavePerson = () => {
            if (!editingPerson.name.trim() || !editingPerson.categoryId) return;
            const newPersonnel = { ...personnel };
            if (!isAddingNewPerson) {
                for (const [cId, arr] of Object.entries(newPersonnel)) {
                    if (arr.some(p => p.id === editingPerson.id)) {
                        newPersonnel[cId] = newPersonnel[cId].filter(p => p.id !== editingPerson.id);
                        break;
                    }
                }
            }
            if (!newPersonnel[editingPerson.categoryId]) newPersonnel[editingPerson.categoryId] = [];
            newPersonnel[editingPerson.categoryId].push({ id: editingPerson.id, name: editingPerson.name.trim(), customTags: editingPerson.customTags });
            onUpdatePersonnel(newPersonnel);
            setShowEditModal(false);
        };

        const handleDeletePerson = () => {
            if (!window.confirm(`確定要刪除 ${editingPerson.name} 嗎？此動作無法復原。`)) return;
            const newPersonnel = { ...personnel };
            for (const [cId, arr] of Object.entries(newPersonnel)) {
                newPersonnel[cId] = arr.filter(p => p.id !== editingPerson.id);
            }
            onUpdatePersonnel(newPersonnel);
            setShowEditModal(false);
        };
        
        const addTag = () => {
            if (newCustomTag.label.trim()) {
                setEditingPerson(prev => ({
                    ...prev,
                    customTags: [...(prev.customTags || []), { label: newCustomTag.label.trim(), count: newCustomTag.count || 1 }]

                        {showEditModal && editingPerson && (

                                    <div className="flex justify-between items-center mb-6 shrink-0">

                                        <div className="space-y-4">
                                            <div><label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest">人員姓名</label><input value={editingPerson.name} onChange={e => setEditingPerson({...editingPerson, name: e.target.value})} className="w-full bg-slate-950/50 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500" placeholder="輸入姓名..." autoFocus /></div>

                                                {(editingPerson.customTags || []).map((tag, idx) => (

                                                <input type="number" value={newCustomTag.count} onChange={e => setNewCustomTag({...newCustomTag, count: parseInt(e.target.value) || 0})} className="w-16 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs font-bold text-center text-slate-400 outline-none" />
                                                <button type="button" onClick={addTag} className="bg-slate-800 hover:bg-amber-600 text-slate-300 hover:text-white p-1.5 rounded-lg transition-colors"><Icons.Plus /></button>

                                        <button type="button" onClick={() => setShowEditModal(false)} className="flex-1 py-3.5 rounded-xl font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 transition-all">取消</button>
                                        <button type="button" onClick={handleSavePerson} className="flex-1 py-3.5 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-500 shadow-lg active:scale-95 transition-all">儲存</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                )}
            </div>
        );
    });

    const App = () => {
        const [currentView, setCurrentView] = useState('dashboard');
        const [loading, setLoading] = useState(true);
        const [syncStatus, setSyncStatus] = useState('連線中...');
        const [forceRefresh, setForceRefresh] = useState(0); 

        const [isAdmin, setIsAdmin] = useState(false);
        const [adminPassword, setAdminPassword] = useState('admin');
        const [showAuthModal, setShowAuthModal] = useState(false);
        const [showPasswordModal, setShowPasswordModal] = useState(false);
        const [authInput, setAuthInput] = useState('');
        const [newPasswordInput, setNewPasswordInput] = useState('');
        const [authError, setAuthError] = useState(false);

        const [personnel, setPersonnel] = useState({});
        const [categoryGroups, setCategoryGroups] = useState(DEFAULT_CATEGORY_GROUPS);
        const [taskTypes, setTaskTypes] = useState(DEFAULT_TASK_TYPES);
        const [attendanceData, setAttendanceData] = useState({});
        const [masterCourses, setMasterCourses] = useState([]);
        const [monthlyData, setMonthlyData] = useState(() => Array(12).fill([{ name: '月月繪', type: 'monthlyActivity', students: 0, batch: '常駐' }]));
        const [manualStats, setManualStats] = useState({});
        const [courseMappings, setCourseMappings] = useState({
            '透視': 'regular', '構成': 'reg_comp', '色彩': 'reg_color',
            '線條訓練營': 'bootcamp', '色彩訓練營': 'camp_color', '速寫團練': 'sketch', '月月繪': 'lec_monthly'
        });

        const [showMappingModal, setShowMappingModal] = useState(false);
        const [showCourseModal, setShowCourseModal] = useState(false);
        const [showCategoryModal, setShowCategoryModal] = useState(false);
        const [showTaskTypeModal, setShowTaskTypeModal] = useState(false);
        const [wsShowBatchModal, setWsShowBatchModal] = useState(false);
        const [newMapping, setNewMapping] = useState({ courseName: '', categoryId: '' });
        const [newGroupForm, setNewGroupForm] = useState('');
        const [newCatForm, setNewCatForm] = useState({ groupIdx: 0, label: '', id: '' });
        const [newTaskForm, setNewTaskForm] = useState({ id: '', label: '', color: 'bg-indigo-600 text-indigo-50', targetCategory: '' });
        const [newCourse, setNewCourse] = useState({ name: '透視', type: 'regular', batch: '', students: 0, startDate: '', duration: 70, endDate: '' });
        const [wsSearchTerm, setWsSearchTerm] = useState("");
        const [wsBatchForm, setWsBatchForm] = useState({ personId: '', startDate: '', endDate: '', type: 'persp_group', context: '' });
        const [collapsedMonths, setCollapsedMonths] = useState({});
        const [errorMsg, setErrorMsg] = useState('');
        const [confirmDialog, setConfirmDialog] = useState({ show: false, message: '', onConfirm: null });

        const fileInputRef = useRef(null);
        const categories = useMemo(() => (categoryGroups || []).flatMap(g => g.items || []), [categoryGroups]);
        
        useEffect(() => {
            if (!supabaseClient) { 
                setLoading(false); 
                setSyncStatus('⚠️ 離線模式'); 
                return; 
            }

            const loadData = async () => {
                setSyncStatus('連線中...');
                try {
                    const { data, error } = await supabaseClient.from('app_settings').select('*');
                    if (error) throw error;
                    if (data && data.length > 0) {
                        const state = {};
                        data.forEach(row => { state[row.key] = row.value; });
                        if (state.categoryGroups) setCategoryGroups(state.categoryGroups);
                        if (state.taskTypes) setTaskTypes(state.taskTypes);
                        if (state.personnel) {
                            const merged = {};
                            const catsToUse = state.categoryGroups ? state.categoryGroups.flatMap(g=>g.items||[]) : categories;
                            catsToUse.forEach(c => { merged[c.id] = (state.personnel[c.id] || []).map(p => ({ ...p, customTags: p.customTags || [] })); });
                            setPersonnel(merged);
                        }
                        if (state.masterCourses) setMasterCourses(state.masterCourses);
                        if (state.attendanceData) setAttendanceData(state.attendanceData);
                        if (state.monthlyData) { try { setMonthlyData(typeof state.monthlyData === 'string' ? JSON.parse(state.monthlyData) : state.monthlyData); } catch(e) {} }
                        if (state.courseMappings) { try { setCourseMappings(typeof state.courseMappings === 'string' ? JSON.parse(state.courseMappings) : state.courseMappings); } catch(e) {} }
                        if (state.adminPassword) setAdminPassword(state.adminPassword);
                    }
                    setSyncStatus('✅ 已同步');
                } catch (err) {
                    setSyncStatus('❌ 連線失敗');
                } finally {
                    setLoading(false);
                }
            };
            loadData();

            const channel = supabaseClient.channel('schema-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, (payload) => {
                    const { key, value } = payload.new;
                    if (!key) return;
                    if (key === 'categoryGroups') setCategoryGroups(value);
                    else if (key === 'taskTypes') setTaskTypes(value);
                    else if (key === 'personnel') setPersonnel(value);
                    else if (key === 'masterCourses') setMasterCourses(value);
                    else if (key === 'attendanceData') setAttendanceData(value);
                    else if (key === 'monthlyData') { try { setMonthlyData(typeof value === 'string' ? JSON.parse(value) : value); } catch(e){} }
                    else if (key === 'courseMappings') { try { setCourseMappings(typeof value === 'string' ? JSON.parse(value) : value); } catch(e){} }
                    else if (key === 'adminPassword') setAdminPassword(value);
                }).subscribe();
            return () => { supabaseClient.removeChannel(channel); };
        }, [forceRefresh]);

        const saveData = useCallback(async (key, data) => {
            if (!supabaseClient) return;
            setSyncStatus('同步中...');
            try {
                const { error } = await supabaseClient.from('app_settings').upsert({ key: key, value: data }, { onConflict: 'key' });
                if (error) throw error;
                setSyncStatus('✅ 已同步');
            } catch (e) {
                setSyncStatus('❌ 儲存失敗');
            }
        }, []);

        const schedule = useMemo(() => {
            const newSchedule = Array.from({ length: 12 }, (_, i) => ({ month: `${i + 1}月`, monthly: monthlyData[i] || [{ name: '月月繪', type: 'monthlyActivity', students: 0, batch: '常駐' }], early: [], mid: [], late: [] }));
            (masterCourses || []).forEach(course => {
                if (!course.startDate || !course.endDate) return;
                const start = new Date(course.startDate);
                const end = new Date(course.endDate);
                for (let m = 0; m < 12; m++) {
                    const periods = [{ key: 'early', s: 1, e: 10 }, { key: 'mid', s: 11, e: 20 }, { key: 'late', s: 21, e: 31 }];
                    periods.forEach(p => {
                        const testStart = new Date(start.getFullYear(), m, p.s);
                        const testEnd = new Date(start.getFullYear(), m, p.e);
                        if (start <= testEnd && end >= testStart) { newSchedule[m][p.key].push({ name: course.name, type: course.type, students: course.students, batch: course.batch }); }
                    });
                }
            });
            return newSchedule;
        }, [masterCourses, monthlyData]);

        const calculateManpower = useCallback((courseName, students) => {
            if (!students || students <= 0) return { frontline: 0 };
            let frontline = 0;
            if (courseName.includes('透視')) frontline = Math.ceil(students / 270);
            else if (courseName.includes('構成') || (courseName.includes('色彩') && !courseName.includes('營'))) frontline = Math.ceil(students / 250);
            else if (courseName.includes('速寫') || courseName.includes('線條訓練營') || courseName.includes('色彩訓練營')) {
                if (students <= 3000) frontline = 8;
                else if (students <= 4000) frontline = 10;
                else if (students <= 5000) frontline = 12;
                else if (students <= 6000) frontline = 13;
                else frontline = 13 + Math.ceil((students - 6000) / 1000) * 2; 
            } else if (courseName.includes('月月繪')) frontline = 1;
            else frontline = Math.ceil(students / 250);
            return { frontline };
        }, []);

        const getHealthStatus = useCallback((required, available) => {
            if (required === 0) return { text: '無需', class: 'text-slate-500 bg-slate-800/50 border-slate-700/50' };
            if (available >= required) return { text: '充足', class: 'text-emerald-300 bg-emerald-900/40 border-emerald-500/50 shadow-[0_0_10px_rgba(52,211,153,0.15)]' };
            if (available >= required * 0.75) return { text: '吃緊', class: 'text-amber-300 bg-amber-900/40 border-amber-500/50 shadow-[0_0_10px_rgba(251,191,36,0.15)]' };
            return { text: '不足', class: 'text-rose-300 bg-rose-900/40 border-rose-500/50 shadow-[0_0_15px_rgba(244,63,94,0.3)] animate-pulse' };
        }, []);

        const movePersonToCategory = useCallback((empId, targetCatId) => {
            if (!targetCatId) return;
            setPersonnel(prevPersonnel => {
                let currentCatId = null, personObj = null;
                for (const [catId, list] of Object.entries(prevPersonnel || {})) {
                    const found = (list || []).find(p => p.id === empId);
                    if (found) { currentCatId = catId; personObj = found; break; }
                }
                if (personObj && currentCatId && currentCatId !== targetCatId) {
                    const newPersonnel = { ...prevPersonnel };
                    newPersonnel[currentCatId] = newPersonnel[currentCatId].filter(p => p.id !== empId);
                    if (!newPersonnel[targetCatId]) newPersonnel[targetCatId] = [];
                    newPersonnel[targetCatId] = [...newPersonnel[targetCatId], personObj];
                    saveData('personnel', newPersonnel); 
                    return newPersonnel;
                }
                return prevPersonnel;
            });
        }, [saveData]);

        const handleUpdateCourse = useCallback((id, field, val) => { const updated = masterCourses.map(c => { if (c.id !== id) return c; const nc = { ...c, [field]: val }; if (field === 'startDate') nc.endDate = calculateEndDate(val, nc.duration); if (field === 'duration') nc.endDate = calculateEndDate(nc.startDate, val); if (field === 'endDate') nc.duration = calculateDuration(nc.startDate, val); return nc; }); setMasterCourses(updated); saveData('masterCourses', updated); }, [masterCourses, saveData]);
        const handleDeleteCourse = useCallback((id) => { setConfirmDialog({ show: true, message: "確定要刪除此課程嗎？", onConfirm: () => { const updated = masterCourses.filter(c => c.id !== id); setMasterCourses(updated); saveData('masterCourses', updated); }}); }, [masterCourses, saveData]);
        const handleMonthlyChange = useCallback((mIdx, val) => { const newData = [...monthlyData]; const monthArr = newData[mIdx] ? [...newData[mIdx]] : [{ name: '月月繪', type: 'monthlyActivity', students: 0, batch: '常駐' }]; monthArr[0] = { ...monthArr[0], students: val }; newData[mIdx] = monthArr; setMonthlyData(newData); saveData('monthlyData', newData); }, [monthlyData, saveData]);

        const updateAttendance = useCallback(async (empId, date, status, context) => { 
            setAttendanceData(prev => {
                const newData = { ...prev };
                newData[empId] = { ...(newData[empId] || {}) };
                if (!status) delete newData[empId][date];
                else newData[empId][date] = { status, context };
                saveData('attendanceData', newData);
                return newData;
            });
            if (status) { const taskConfig = (taskTypes||[]).find(t => t.id === status); if (taskConfig && taskConfig.targetCategory) movePersonToCategory(empId, taskConfig.targetCategory); }
        }, [taskTypes, movePersonToCategory, saveData]);
        
        const batchUpdateAttendance = useCallback(async (records) => { 
            setAttendanceData(prev => {
                const newData = { ...prev };
                records.forEach(r => { newData[r.employee_id] = { ...(newData[r.employee_id] || {}) }; newData[r.employee_id][r.date] = { status: r.status, context: r.context }; });
                saveData('attendanceData', newData);
                return newData;
            });
            if (records.length > 0) { const taskConfig = (taskTypes||[]).find(t => t.id === records[0].status); if (taskConfig && taskConfig.targetCategory) movePersonToCategory(records[0].employee_id, taskConfig.targetCategory); }
        }, [taskTypes, movePersonToCategory, saveData]);

        const handleUpdatePersonnelState = useCallback((newPersonnelData) => { setPersonnel(newPersonnelData); saveData('personnel', newPersonnelData); }, [saveData]);
        const handleExport = () => { const data = { personnel, masterCourses, attendanceData, monthlyData: schedule.map(m => ({ month_index: parseInt(m.month), students: m.monthly[0].students })), settings: { categoryGroups, taskTypes, courseMappings }, timestamp: new Date().toISOString() }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `hr_backup.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };
        const handleImportClick = () => { fileInputRef.current.click(); }
        const handleFileChange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = async (event) => { try { const imported = JSON.parse(event.target.result); 
              setConfirmDialog({ show: true, message: "確認要匯入並覆蓋目前所有的資料嗎？", onConfirm: async () => {
                   if (imported.settings) { 
                       if (imported.settings.categoryGroups) { setCategoryGroups(imported.settings.categoryGroups); await saveData('categoryGroups', imported.settings.categoryGroups); } 
                       if (imported.settings.taskTypes) { setTaskTypes(imported.settings.taskTypes); await saveData('taskTypes', imported.settings.taskTypes); } 
                       if (imported.settings.courseMappings) { setCourseMappings(imported.settings.courseMappings); await saveData('courseMappings', imported.settings.courseMappings); }
                   } 
                   if (imported.personnel) { setPersonnel(imported.personnel); await saveData('personnel', imported.personnel); } 
                   if (imported.masterCourses) { setMasterCourses(imported.masterCourses); await saveData('masterCourses', imported.masterCourses); } 
                   if (imported.attendanceData) { setAttendanceData(imported.attendanceData); await saveData('attendanceData', imported.attendanceData); } 
                   if (imported.monthlyData) { await saveData('monthlyData', imported.monthlyData); } 
                   if (imported.adminPassword) { setAdminPassword(imported.adminPassword); await saveData('adminPassword', imported.adminPassword); }
                   setSyncStatus('✅ 匯入完成'); 
                   setForceRefresh(p=>p+1);
              }});
        } catch(e){} }; reader.readAsText(file); e.target.value=''; };
        
        const handleSaveCategories = (newGroups) => { setCategoryGroups(newGroups); saveData('categoryGroups', newGroups); setShowCategoryModal(false); };
        const handleSaveTaskTypes = (newTypes) => { setTaskTypes(newTypes); saveData('taskTypes', newTypes); setShowTaskTypeModal(false); };

        const stats = useMemo(() => {
            let allocated = 0, unallocated = 0;
            categories.forEach(c => { const count = (personnel[c.id] || []).length; if (c.id !== 'pool') allocated += count; else unallocated += count; });
            return { total: allocated + unallocated, allocated, unallocated };
        }, [personnel, categories]);

        const dailyStats = useMemo(() => {
            const todayStr = new Date().toISOString().split('T')[0];
            let workingToday = 0; let leaveToday = 0;
            Object.values(attendanceData || {}).forEach(records => {
                const todayRecord = (records || {})[todayStr];
                if (todayRecord) { if (todayRecord.status === 'leave' || todayRecord.status === 'sick') leaveToday++; else workingToday++; }
            });
            return { workingToday, leaveToday };
        }, [attendanceData]);

        if (loading) return <div className="h-screen flex items-center justify-center bg-slate-950 text-indigo-400 font-black tracking-widest text-2xl animate-pulse">載入中，請稍候...</div>;

        return (
             <div className="flex min-h-screen bg-slate-950 text-slate-200 selection:bg-indigo-500/30 font-sans">
                <nav className="fixed md:relative bottom-0 w-full md:w-[260px] bg-slate-900/80 backdrop-blur-3xl border-t md:border-r border-slate-800/80 z-50 flex md:flex-col justify-around md:justify-start p-3 md:p-6 md:space-y-4 shadow-[0_0_40px_rgba(0,0,0,0.5)] md:shadow-none">
                    <div className="hidden md:flex items-center gap-4 px-2 mb-8">
                        <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-indigo-500/30">H</div>
                        <div className="flex flex-col">
                            <span className="font-black text-xl text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-400 tracking-tight leading-none">人力儀表板</span>
                            <span className="text-[10px] text-indigo-400 font-bold mt-0.5 tracking-widest uppercase">HR System</span>
                        </div>
                    </div>

                                </div>
                            </div>
                        </div>

                            <div className="space-y-4">
                                <input value={newMapping.courseName} onChange={e=>setNewMapping({...newMapping, courseName: e.target.value})} placeholder="輸入課程名稱 (如: 新手營)" className="w-full bg-slate-900/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 transition-all placeholder-slate-500" />
                                <select value={newMapping.categoryId} onChange={e=>setNewMapping({...newMapping, categoryId: e.target.value})} className="w-full bg-slate-900/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 transition-all cursor-pointer">
                                    <option value="">-- 選擇對應的人員分類 --</option>
                                    {categories.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                </select>
                                <button onClick={() => { if(!newMapping.courseName || !newMapping.categoryId) return; const newMap = {...courseMappings, [newMapping.courseName]: newMapping.categoryId}; setCourseMappings(newMap); saveData('courseMappings', newMap); setNewMapping({ courseName: '', categoryId: '' }); }} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-500 shadow-lg transition-all active:scale-95">新增連動</button>
                            </div>
                        </div>
                    </div>
                </div>, document.body
            )}
            </div>
        );
    }
    
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
