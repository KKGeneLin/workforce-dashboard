                            const end = new Date(course.endDate);
                            if (start.getFullYear() !== year && end.getFullYear() !== year) return null;
                            const yearStart = new Date(year, 0, 1).getTime();
                            const yearEnd = new Date(year, 11, 31).getTime();
                            const duration = yearEnd - yearStart;
                            const cStart = Math.max(start.getTime(), yearStart);
                            const cEnd = Math.min(end.getTime(), yearEnd);
                            if (cEnd < cStart) return null;
                            const left = ((cStart - yearStart) / duration) * 100;
                            const width = ((cEnd - cStart) / duration) * 100;
                            return (

                    {popover && isEditingAllowed && (

                            <div className="flex justify-between items-center mb-6"><h3 className="text-2xl font-black text-slate-100 tracking-wide">批量排班</h3><button onClick={() => setWsShowBatchModal(false)} className="text-slate-400 hover:text-slate-200 bg-slate-800/50 p-2 rounded-full transition-colors"><Icons.X /></button></div>
                            <div className="space-y-5">

                                <div>

                                        <option value="">-- 請選擇 --</option>
                                        {(categoryGroups||[]).map(g => (

                                    <div><label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest">結束日期</label><input type="date" className="w-full bg-slate-800/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 cursor-pointer" value={wsBatchForm.endDate} onChange={e => setWsBatchForm({...wsBatchForm, endDate: e.target.value})} /></div>

    });

    const AnalyticsView = memo(({ personnel, attendanceData, taskTypes, categoryGroups, manualStats, onUpdateManualStats }) => {
        const [activeTab, setActiveTab] = useState('overview'); 
        const [selectedMonth, setSelectedMonth] = useState(() => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        });
        const [selectedPersonId, setSelectedPersonId] = useState("");
        const [selectedDailyDate, setSelectedDailyDate] = useState(() => new Date().toISOString().split('T')[0]);
        const [editingStat, setEditingStat] = useState(null);

        const flatCategories = useMemo(() => (categoryGroups || []).flatMap(g => g.items || []), [categoryGroups]);

        const allPersonnelList = useMemo(() => {
            let list = [];
            Object.entries(personnel || {}).forEach(([catId, arr]) => {
                (arr || []).forEach(p => { list.push({ ...p, categoryId: catId }); });
            });
            return list;
        }, [personnel]);

        const analytics = useMemo(() => {
            if (!selectedMonth) return null;
            const [year, month] = selectedMonth.split('-').map(Number);
            
            let weekdays = 0;
            const daysInMonth = new Date(year, month, 0).getDate();
            const daysArray = Array.from({length: daysInMonth}, (_, i) => i + 1);

            for (let i = 1; i <= daysInMonth; i++) {
                const day = new Date(year, month - 1, i).getDay();
                if (day !== 0 && day !== 6) weekdays++;
            }

            const stats = [];
            const globalTaskCounts = {};
            let totalGlobalTasks = 0;

            allPersonnelList.forEach(p => {
                let workDays = 0;
                let leaveDays = 0;
                const personalTaskCounts = {};

                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const record = attendanceData?.[p.id]?.[dateStr];
                    
                    if (record && record.status) {
                        const isLeave = record.status === 'leave';
                        if (isLeave) leaveDays++;
                        else workDays++;
                        
                        personalTaskCounts[record.status] = (personalTaskCounts[record.status] || 0) + 1;
                        globalTaskCounts[record.status] = (globalTaskCounts[record.status] || 0) + 1;
                        totalGlobalTasks++;
                    }
                }

                stats.push({
                    ...p, workDays, leaveDays,
                    idleDays: Math.max(0, weekdays - workDays - leaveDays),
                    personalTaskCounts, totalPersonalTasks: workDays + leaveDays
                });
            });

            const topActive = [...stats].sort((a, b) => b.workDays - a.workDays).slice(0, 5);
            const topIdle = [...stats].sort((a, b) => b.idleDays - a.idleDays);

            return { year, month, daysArray, weekdays, globalTaskCounts, totalGlobalTasks, stats, topActive, topIdle };
        }, [selectedMonth, allPersonnelList, attendanceData]);

        const dailyData = useMemo(() => {
            let taskCounts = {};
            let totalAssigned = 0;
            let memberTasks = [];

            allPersonnelList.forEach(p => {
                const record = attendanceData?.[p.id]?.[selectedDailyDate];
                const status = record?.status || null;
                if (status) {
                    taskCounts[status] = (taskCounts[status] || 0) + 1;
                    totalAssigned++;
                }
                memberTasks.push({ ...p, status, context: record?.context });
            });

            memberTasks.sort((a, b) => {
                if (!a.status && !b.status) return 0;
                if (!a.status) return 1;
                if (!b.status) return -1;
                return a.status.localeCompare(b.status);
            });

            return { taskCounts, totalAssigned, memberTasks };
        }, [selectedDailyDate, allPersonnelList, attendanceData]);

        if (!analytics) return <div className="text-slate-500">Loading...</div>;

        const selectedPersonStat = selectedPersonId ? analytics.stats.find(p => p.id === selectedPersonId) : null;
        
        let workloadRate = "-";
        let mostFrequentTask = "-";
        let idleDays = "-";
        let displayTaskCounts = analytics.globalTaskCounts;
        let totalForBar = analytics.totalGlobalTasks;

        if (selectedPersonStat) {
            const wDays = selectedPersonStat.workDays;
            workloadRate = analytics.weekdays > 0 ? Math.round((wDays / analytics.weekdays) * 100) : 0;
            idleDays = selectedPersonStat.idleDays;
            
            const tasks = Object.entries(selectedPersonStat.personalTaskCounts)
                                .filter(([taskId]) => taskId !== 'leave') 
                                .sort((a,b) => b[1] - a[1]);
            if (tasks.length > 0) {
                const tConfig = (taskTypes||[]).find(t => t.id === tasks[0][0]);
                mostFrequentTask = tConfig ? tConfig.label : tasks[0][0];
            } else {
                mostFrequentTask = "無排班";
            }
            displayTaskCounts = selectedPersonStat.personalTaskCounts;

                        </div>
                    </div>
                ))}
                </div>

    });

    const App = () => {
          const [currentView, setCurrentView] = useState('dashboard');

          const [draggedCatInfo, setDraggedCatInfo] = useState(null);

          const [addingToCategory, setAddingToCategory] = useState(null);

          const [showCourseModal, setShowCourseModal] = useState(false);
          const [showDeleteModal, setShowDeleteModal] = useState(false);
          const [deleteTarget, setDeleteTarget] = useState(null);

          });

          const categories = useMemo(() => (categoryGroups || []).flatMap(g => g.items || []), [categoryGroups]);
          
          // ==========================================
          // Supabase Setup
          // ==========================================
          useEffect(() => {
              if (!supabase) { 
                  setLoading(false); 
                  setSyncStatus('⚠️ 離線模式'); 
                  return; 
              }

              const loadData = async () => {
                  setSyncStatus('連線中...');
                  try {
                      const { data, error } = await supabase.from('app_settings').select('*');
                      if (error) throw error;
                      if (data && data.length > 0) {
                          const state = {};
                          data.forEach(row => { state[row.key] = row.value; });
                          if (state.categoryGroups) setCategoryGroups(state.categoryGroups);
                          if (state.taskTypes) setTaskTypes(state.taskTypes);
                          if (state.personnel) {
                              const merged = {};
                              const catsToUse = state.categoryGroups ? state.categoryGroups.flatMap(g=>g.items||[]) : categories;
                              catsToUse.forEach(c => merged[c.id] = state.personnel[c.id] || []);
                              setPersonnel(merged);
                          }
                          if (state.masterCourses) setMasterCourses(state.masterCourses);
                          if (state.attendanceData) setAttendanceData(state.attendanceData);
                          if (state.manualStats) {
                              try { setManualStats(typeof state.manualStats === 'string' ? JSON.parse(state.manualStats) : state.manualStats); } catch(e) {}
                          }
                          if (state.monthlyData) {
                              try { setMonthlyData(typeof state.monthlyData === 'string' ? JSON.parse(state.monthlyData) : state.monthlyData); } catch(e) {}
                          }
                          if (state.courseMappings) {
                              try { setCourseMappings(typeof state.courseMappings === 'string' ? JSON.parse(state.courseMappings) : state.courseMappings); } catch(e) {}
                          }
                      }
                      setSyncStatus('✅ 已同步');
                  } catch (err) {
                      setSyncStatus('❌ 連線失敗');
                  } finally {
                      setLoading(false);
                  }
              };
              loadData();

              const channel = supabase.channel('schema-db-changes')
                  .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, (payload) => {
                      const { key, value } = payload.new;
                      if (!key) return;
                      if (key === 'categoryGroups') setCategoryGroups(value);
                      else if (key === 'taskTypes') setTaskTypes(value);
                      else if (key === 'personnel') setPersonnel(value);
                      else if (key === 'masterCourses') setMasterCourses(value);
                      else if (key === 'attendanceData') setAttendanceData(value);
                      else if (key === 'manualStats') { try { setManualStats(typeof value === 'string' ? JSON.parse(value) : value); } catch(e){} }
                      else if (key === 'monthlyData') { try { setMonthlyData(typeof value === 'string' ? JSON.parse(value) : value); } catch(e){} }
                      else if (key === 'courseMappings') { try { setCourseMappings(typeof value === 'string' ? JSON.parse(value) : value); } catch(e){} }
                  })
                  .subscribe();
              return () => { supabase.removeChannel(channel); };
          }, []);

          const saveData = useCallback(async (key, data) => {
              if (!supabase) return;
              setSyncStatus('同步中...');
              try {
                  const { error } = await supabase.from('app_settings').upsert({ key: key, value: data }, { onConflict: 'key' });
                  if (error) throw error;
                  setSyncStatus('✅ 已同步');
              } catch (e) {
                  setSyncStatus('❌ 儲存失敗');
              }
          }, []);

          // --- Logic Hooks ---
          const schedule = useMemo(() => {
              const newSchedule = Array.from({ length: 12 }, (_, i) => ({
                  month: `${i + 1}月`,
                  monthly: monthlyData[i] || [{ name: '月月繪', type: 'monthlyActivity', students: 0, batch: '常駐' }],
                  early: [], mid: [], late: []
              }));
              (masterCourses || []).forEach(course => {
                  if (!course.startDate || !course.endDate) return;
                  const start = new Date(course.startDate);
                  const end = new Date(course.endDate);
                  for (let m = 0; m < 12; m++) {
                      const periods = [{ key: 'early', s: 1, e: 10 }, { key: 'mid', s: 11, e: 20 }, { key: 'late', s: 21, e: 31 }];
                      periods.forEach(p => {
                          const testStart = new Date(start.getFullYear(), m, p.s);
                          const testEnd = new Date(start.getFullYear(), m, p.e);
                          if (start <= testEnd && end >= testStart) {
                              newSchedule[m][p.key].push({ name: course.name, type: course.type, students: course.students, batch: course.batch });
                          }
                      });
                  }
              });
              return newSchedule;
          }, [masterCourses, monthlyData]);

          const movePersonToCategory = useCallback((empId, targetCatId) => {
              if (!targetCatId) return;
              setPersonnel(prevPersonnel => {
                  let currentCatId = null;
                  let personObj = null;
                  for (const [catId, list] of Object.entries(prevPersonnel || {})) {
                      const found = (list || []).find(p => p.id === empId);
                      if (found) { currentCatId = catId; personObj = found; break; }
                  }
                  if (personObj && currentCatId && currentCatId !== targetCatId) {
                      const newPersonnel = { ...prevPersonnel };
                      newPersonnel[currentCatId] = newPersonnel[currentCatId].filter(p => p.id !== empId);
                      if (!newPersonnel[targetCatId]) newPersonnel[targetCatId] = [];
                      newPersonnel[targetCatId] = [...newPersonnel[targetCatId], personObj];
                      saveData('personnel', newPersonnel); 
                      return newPersonnel;
                  }
                  return prevPersonnel;
              });
          }, [saveData]);

          const calculateEndDate = (startStr, days) => { if (!startStr || !days) return ''; const d = new Date(startStr); d.setDate(d.getDate() + parseInt(days) - 1); return d.toISOString().split('T')[0]; };
          const calculateDuration = (startStr, endStr) => { if (!startStr || !endStr) return 0; const s = new Date(startStr), e = new Date(endStr); if (e < s) return 0; return Math.ceil(Math.abs(e - s) / (86400000)) + 1; };

          const handleAddCourse = useCallback(() => { if (!newCourse.name || !newCourse.startDate) { setErrorMsg("請填寫必要資訊"); return; } const updated = [...masterCourses, { ...newCourse, id: generateId() }]; setMasterCourses(updated); saveData('masterCourses', updated); setNewCourse({ ...newCourse, batch: '', students: 0, startDate: '', endDate: '' }); setShowCourseModal(false); setErrorMsg(''); }, [masterCourses, newCourse, saveData]);
          const handleUpdateCourse = useCallback((id, field, val) => { const updated = masterCourses.map(c => { if (c.id !== id) return c; const nc = { ...c, [field]: val }; if (field === 'startDate') nc.endDate = calculateEndDate(val, nc.duration); if (field === 'duration') nc.endDate = calculateEndDate(nc.startDate, val); if (field === 'endDate') nc.duration = calculateDuration(nc.startDate, val); return nc; }); setMasterCourses(updated); saveData('masterCourses', updated); }, [masterCourses, saveData]);
          const handleDeleteCourse = useCallback((id) => { 
              setConfirmDialog({ show: true, message: "確定要刪除此課程嗎？", onConfirm: () => {
                  const updated = masterCourses.filter(c => c.id !== id); setMasterCourses(updated); saveData('masterCourses', updated); 
              }});
          }, [masterCourses, saveData]);
          
          const handleUpdateManualStats = useCallback((newData) => { setManualStats(newData); saveData('manualStats', newData); }, [saveData]);

          const handleMonthlyChange = useCallback((mIdx, val) => { 
              const newData = [...monthlyData];
              const monthArr = newData[mIdx] ? [...newData[mIdx]] : [{ name: '月月繪', type: 'monthlyActivity', students: 0, batch: '常駐' }];
              monthArr[0] = { ...monthArr[0], students: val };
              newData[mIdx] = monthArr;
              setMonthlyData(newData);
              saveData('monthlyData', newData); 
          }, [monthlyData, saveData]);

          const handleConfirmAddPerson = useCallback(() => { if (!tempName.trim() || !addingToCategory) return; const newP = { id: generateId(), name: tempName.trim() }; const newPersonnel = { ...personnel, [addingToCategory]: [...(personnel[addingToCategory] || []), newP] }; setPersonnel(newPersonnel); saveData('personnel', newPersonnel); setTempName(''); setAddingToCategory(null); }, [tempName, addingToCategory, personnel, saveData]);
          const handleRemovePerson = useCallback(() => { if (!deleteTarget) return; const newPersonnel = { ...personnel }; newPersonnel[deleteTarget.categoryId] = newPersonnel[deleteTarget.categoryId].filter(p => p.id !== deleteTarget.personId); setPersonnel(newPersonnel); saveData('personnel', newPersonnel); setShowDeleteModal(false); }, [deleteTarget, personnel, saveData]);
          
          const clearDragStates = useCallback(() => { setDraggedItem(null); setDragOverContainer(null); setDraggedGroupIdx(null); setDraggedCatInfo(null); }, []);
          const onDragStart = useCallback((e, person, fromCategory) => { e.stopPropagation(); setDraggedItem({ person, fromCategory }); e.dataTransfer.effectAllowed = 'move'; }, []);
          const onDragOver = useCallback((e, catId) => { e.preventDefault(); if (dragOverContainer !== catId) setDragOverContainer(catId); }, [dragOverContainer]);
          const onDrop = useCallback((e, toCategory) => { e.preventDefault(); setDragOverContainer(null); if (!draggedItem || draggedItem.fromCategory === toCategory) return; const newPersonnel = { ...personnel }; newPersonnel[draggedItem.fromCategory] = newPersonnel[draggedItem.fromCategory].filter(p => p.id !== draggedItem.person.id); newPersonnel[toCategory] = [...(newPersonnel[toCategory] || []), draggedItem.person]; setPersonnel(newPersonnel); saveData('personnel', newPersonnel); setDraggedItem(null); }, [draggedItem, personnel, saveData]);
          
          const onGroupDragStart = useCallback((e, idx) => { e.stopPropagation(); setDraggedGroupIdx(idx); e.dataTransfer.effectAllowed = 'move'; }, []);
          const onGroupDrop = useCallback((e, dropIdx) => { e.preventDefault(); e.stopPropagation(); if (draggedGroupIdx === null || draggedGroupIdx === dropIdx) { clearDragStates(); return; } const newGroups = [...categoryGroups]; const [moved] = newGroups.splice(draggedGroupIdx, 1); newGroups.splice(dropIdx, 0, moved); setCategoryGroups(newGroups); saveData('categoryGroups', newGroups); clearDragStates(); }, [draggedGroupIdx, categoryGroups, saveData, clearDragStates]);
          const onCatDragStart = useCallback((e, groupIdx, catIdx) => { e.stopPropagation(); setDraggedCatInfo({ groupIdx, catIdx }); e.dataTransfer.effectAllowed = 'move'; }, []);
          const onCatDrop = useCallback((e, targetGroupIdx, targetCatIdx) => { e.preventDefault(); e.stopPropagation(); if (!draggedCatInfo) { clearDragStates(); return; } const { groupIdx: srcG, catIdx: srcC } = draggedCatInfo; if (srcG === targetGroupIdx && srcC === targetCatIdx) { clearDragStates(); return; } const newGroups = JSON.parse(JSON.stringify(categoryGroups)); const [moved] = newGroups[srcG].items.splice(srcC, 1); newGroups[targetGroupIdx].items.splice(targetCatIdx, 0, moved); setCategoryGroups(newGroups); saveData('categoryGroups', newGroups); clearDragStates(); }, [draggedCatInfo, categoryGroups, saveData, clearDragStates]);

          const updateAttendance = useCallback(async (empId, date, status, context) => { 
              setAttendanceData(prev => {
                  const newData = { ...prev };
                  newData[empId] = { ...(newData[empId] || {}) };
                  if (!status) delete newData[empId][date];
                  else newData[empId][date] = { status, context };
                  saveData('attendanceData', newData);
                  return newData;
              });
              if (status) {
                  const taskConfig = (taskTypes||[]).find(t => t.id === status);
                  if (taskConfig && taskConfig.targetCategory) movePersonToCategory(empId, taskConfig.targetCategory);
              }

          const batchUpdateAttendance = useCallback(async (records) => { 
              setAttendanceData(prev => {
                  const newData = { ...prev };
                  records.forEach(r => { 
                      newData[r.employee_id] = { ...(newData[r.employee_id] || {}) }; 
                      newData[r.employee_id][r.date] = { status: r.status, context: r.context };

              if (records.length > 0) {
                  const taskConfig = (taskTypes||[]).find(t => t.id === records[0].status);
                  if (taskConfig && taskConfig.targetCategory) movePersonToCategory(records[0].employee_id, taskConfig.targetCategory);
              }
          }, [taskTypes, movePersonToCategory, saveData]);

          const handleExport = () => { const data = { personnel, masterCourses, attendanceData, monthlyData: schedule.map(m => ({ month_index: parseInt(m.month), students: m.monthly[0].students })), settings: { categoryGroups, taskTypes, courseMappings }, timestamp: new Date().toISOString() }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `backup.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };
          const handleImportClick = () => { fileInputRef.current.click(); }
          const handleFileChange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = async (event) => { try { const imported = JSON.parse(event.target.result); 
                setConfirmDialog({ show: true, message: "確認要匯入並覆蓋目前所有的資料嗎？", onConfirm: async () => {
                     if (imported.settings) { 
                         if (imported.settings.categoryGroups) { setCategoryGroups(imported.settings.categoryGroups); await saveData('categoryGroups', imported.settings.categoryGroups); } 
                         if (imported.settings.taskTypes) { setTaskTypes(imported.settings.taskTypes); await saveData('taskTypes', imported.settings.taskTypes); } 
                         if (imported.settings.courseMappings) { setCourseMappings(imported.settings.courseMappings); await saveData('courseMappings', imported.settings.courseMappings); }
                     } 
                     if (imported.personnel) { setPersonnel(imported.personnel); await saveData('personnel', imported.personnel); } 
                     if (imported.masterCourses) { setMasterCourses(imported.masterCourses); await saveData('masterCourses', imported.masterCourses); } 
                     if (imported.attendanceData) { setAttendanceData(imported.attendanceData); await saveData('attendanceData', imported.attendanceData); } 
                     if (imported.monthlyData) { await saveData('monthlyData', imported.monthlyData); } 
                     if (imported.manualStats) { setManualStats(imported.manualStats); await saveData('manualStats', imported.manualStats); }
                     setSyncStatus('✅ 匯入完成'); 
                     setForceRefresh(p=>p+1);
                }});
          } catch(e){} }; reader.readAsText(file); e.target.value=''; };
          
          const handleSaveCategories = (newGroups) => { setCategoryGroups(newGroups); saveData('categoryGroups', newGroups); setShowCategoryModal(false); };
          const handleSaveTaskTypes = (newTypes) => { setTaskTypes(newTypes); saveData('taskTypes', newTypes); setShowTaskTypeModal(false); };

          const stats = useMemo(() => {
              let allocated = 0; let frontline = 0;
              categories.forEach(c => { const count = personnel[c.id]?.length || 0; if (c.id !== 'pool') allocated += count; if (c.type === 'frontline') frontline += count; });
              const total = allocated + (personnel['pool']?.length || 0);
              return { total, allocated, unallocated: personnel['pool']?.length || 0, frontline };
          }, [personnel, categories]);
          
          const studentStats = useMemo(() => { 
              let total = 0; 
              const breakdown = {};
              (masterCourses||[]).forEach(c => { 
                  const count = parseInt(c.students) || 0;
                  total += count; 
                  if (count > 0) {
                      breakdown[c.name] = (breakdown[c.name] || 0) + count;
                  }
              }); 
              return { total, breakdown }; 
          }, [masterCourses]);

          const studentBreakdownUI = useMemo(() => {
              const entries = Object.entries(studentStats.breakdown);
              if (entries.length === 0) return <div className="text-xs text-slate-400 text-center">無學生資料</div>;
              return (
                  <div className="space-y-2">
                      <div className="text-xs font-bold text-slate-400 mb-2 border-b border-slate-700/50 pb-2">各課程學生數</div>
                      {entries.sort((a,b) => b[1] - a[1]).map(([name, count]) => (
                          <div key={name} className="flex justify-between items-center text-xs gap-6">
                              <span className="text-slate-300 font-medium">{name}</span>
                              <span className="font-bold text-indigo-400">{count} <span className="text-[10px] text-slate-500 font-normal">人</span></span>
                          </div>
                      ))}
                  </div>
              );
          }, [studentStats.breakdown]);
          
          const dailyStats = useMemo(() => {
              const todayStr = new Date().toISOString().split('T')[0];
              let workingToday = 0; let leaveToday = 0;
              Object.values(attendanceData || {}).forEach(records => {
                  const todayRecord = (records || {})[todayStr];
                  if (todayRecord) { if (todayRecord.status === 'leave' || todayRecord.status === 'sick') leaveToday++; else workingToday++; }
              });
              return { workingToday, leaveToday };

              else if (courseName.includes('速寫') || courseName.includes('線條訓練營') || courseName.includes('色彩訓練營')) {
                  if (students <= 3000) frontline = 8;
                  else if (students <= 4000) frontline = 10;
                  else if (students <= 5000) frontline = 12;
                  else if (students <= 6000) frontline = 13;
                  else frontline = 13 + Math.ceil((students - 6000) / 1000) * 2; 
              } else if (courseName.includes('月月繪')) frontline = 1;
              else frontline = Math.ceil(students / 250);
              return { frontline };
          }, []);

          const getHealthStatus = (required, available) => {

                                                                const availF = mappedCat && personnel[mappedCat] ? personnel[mappedCat].length : 0;
                                                                const status = getHealthStatus(reqF, availF);
                                                                return (
                                                                    <div className="flex justify-between items-center text-xs font-bold text-slate-400 pl-4 mt-1">
                                                                        <span className="flex items-center gap-1.5">一線人力: <span className="font-black text-slate-100 text-sm">{availF}</span> <span className="text-[10px] text-slate-500">/ 需 1</span></span>
                                                                        <span className={`px-3 py-1 rounded-lg tracking-widest text-[10px] ${status.class}`}>{status.text}</span>
                                                                    </div>
                                                                );
                                                            })()}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {currentView === 'attendance' && <WorkScheduleView personnel={personnel} categoryGroups={categoryGroups} attendanceData={attendanceData} onUpdateAttendance={updateAttendance} onBatchUpdate={batchUpdateAttendance} taskTypes={taskTypes} setShowTaskTypeModal={setShowTaskTypeModal} wsSearchTerm={wsSearchTerm} setWsSearchTerm={setWsSearchTerm} dailyStats={dailyStats} wsShowBatchModal={wsShowBatchModal} setWsShowBatchModal={setWsShowBatchModal} wsBatchForm={wsBatchForm} setWsBatchForm={setWsBatchForm} isEditingAllowed={true} />}
                    {currentView === 'personnel' && <PersonnelView personnel={personnel} categoryGroups={categoryGroups} setAddingToCategory={setAddingToCategory} setTempName={setTempName} addingToCategory={addingToCategory} tempName={tempName} handleConfirmAddPerson={handleConfirmAddPerson} setDeleteTarget={setDeleteTarget} setShowDeleteModal={setShowDeleteModal} onPersonDragStart={onDragStart} onDragOver={onDragOver} onPersonDrop={onDrop} dragOverContainer={dragOverContainer} setShowCategoryModal={setShowCategoryModal} setCollapsedPersonnelGroups={setCollapsedPersonnelGroups} collapsedPersonnelGroups={collapsedPersonnelGroups} draggedItem={draggedItem} draggedCatInfo={draggedCatInfo} draggedGroupIdx={draggedGroupIdx} onGroupDragStart={onGroupDragStart} onGroupDrop={onGroupDrop} onCatDragStart={onCatDragStart} onCatDrop={onCatDrop} clearDragStates={clearDragStates} isEditingAllowed={true} />}
                    {currentView === 'timeline' && <TimelineView masterCourses={masterCourses} />}
                    {currentView === 'analytics' && <AnalyticsView personnel={personnel} attendanceData={attendanceData} taskTypes={taskTypes} categoryGroups={categoryGroups} manualStats={manualStats} onUpdateManualStats={handleUpdateManualStats} />}
                </main>

            {/* General Confirm Modal */}
            {confirmDialog.show && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[110] flex items-center justify-center p-4 animate-in fade-in duration-200">
                    <div className="bg-slate-900/90 backdrop-blur-2xl rounded-3xl p-8 w-full max-w-sm shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] border border-slate-700/50">
                        <h3 className="font-black text-xl text-slate-100 mb-3 tracking-wide">確認操作</h3>
                        <p className="text-slate-400 text-sm mb-8 font-medium">{confirmDialog.message}</p>
                        <div className="flex gap-4"><button onClick={() => setConfirmDialog({ ...confirmDialog, show: false })} className="flex-1 py-3 rounded-xl font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 transition-all">取消</button><button onClick={() => { if(confirmDialog.onConfirm) confirmDialog.onConfirm(); setConfirmDialog({ ...confirmDialog, show: false }); }} className="flex-1 py-3 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-500 shadow-lg shadow-indigo-900/40 transition-all active:scale-95">確認</button></div>
                    </div>
                </div>
            )}

            {/* 新增/連動 Mapping Modal */}
            {showMappingModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-in fade-in duration-200">
                    <div className="bg-slate-900/90 backdrop-blur-2xl rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] w-full max-w-md p-8 border border-slate-700/50">
                        <div className="flex justify-between items-center mb-6"><h3 className="text-2xl font-black text-slate-100 tracking-wide">人力連動設定</h3><button onClick={() => setShowMappingModal(false)} className="text-slate-400 hover:text-slate-200 transition-colors bg-slate-800/50 p-2 rounded-full"><Icons.X /></button></div>
                        <p className="text-sm text-slate-400 mb-6 font-medium leading-relaxed">設定課程名稱對應到人員名單中的哪一個分類，系統才能正確試算該課程的一線人力是否充足。</p>
                        <div className="space-y-3 max-h-[40vh] overflow-y-auto custom-scrollbar pr-3 mb-6">
                            {Object.entries(courseMappings).map(([cName, catId]) => (
                                <div key={cName} className="flex justify-between items-center bg-slate-800/50 p-3.5 rounded-2xl border border-slate-700/50 shadow-sm"><span className="font-black text-slate-200 text-sm tracking-wide">{cName}</span><div className="flex items-center gap-3"><span className="text-xs font-bold text-emerald-400 bg-emerald-900/20 px-3 py-1 rounded-lg border border-emerald-500/20 shadow-inner">➔ {categories.find(c=>c.id===catId)?.label || catId}</span><button onClick={() => { const newMap = {...courseMappings}; delete newMap[cName]; setCourseMappings(newMap); saveData('courseMappings', newMap); }} className="text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 p-2 rounded-lg transition-colors"><Icons.Trash /></button></div></div>
                            ))}
                        </div>
                        <div className="bg-slate-800/30 p-5 rounded-2xl border border-slate-700/50">
                            <h4 className="font-black text-slate-300 text-sm mb-4">新增連動規則</h4>
                            <div className="space-y-4">
                                <input value={newMapping.courseName} onChange={e=>setNewMapping({...newMapping, courseName: e.target.value})} placeholder="輸入課程名稱 (如: 新手營)" className="w-full bg-slate-900/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 transition-all placeholder-slate-500" />
                                <select value={newMapping.categoryId} onChange={e=>setNewMapping({...newMapping, categoryId: e.target.value})} className="w-full bg-slate-900/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 transition-all cursor-pointer">
                                    <option value="">-- 選擇對應的人員分類 --</option>
                                    {categories.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                </select>
                                <button onClick={() => { if(!newMapping.courseName || !newMapping.categoryId) return; const newMap = {...courseMappings, [newMapping.courseName]: newMapping.categoryId}; setCourseMappings(newMap); saveData('courseMappings', newMap); setNewMapping({ courseName: '', categoryId: '' }); }} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-500 shadow-lg transition-all active:scale-95">新增連動</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {/* 新增課程 Modal */}
            {showCourseModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-in fade-in duration-200">
                    <div className="bg-slate-900/90 backdrop-blur-2xl rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] w-full max-w-xl p-8 border border-slate-700/50">
                        <div className="flex justify-between items-center mb-8"><h3 className="text-2xl font-black text-slate-100 tracking-wide">新增課程計畫</h3><button onClick={() => setShowCourseModal(false)} className="text-slate-400 hover:text-slate-200 bg-slate-800/50 p-2 rounded-full transition-colors"><Icons.X /></button></div>
                        <div className="space-y-6">
                            <div className="grid grid-cols-2 gap-5">
                                <div><label className="block text-xs font-bold text-slate-400 mb-2 tracking-widest uppercase">課程名稱</label><input type="text" list="course-presets" value={newCourse.name} onChange={e => { const val = e.target.value; const sel = COURSE_TYPES.find(c => c.label === val); if (sel) { setNewCourse({...newCourse, name: val, type: sel.value, duration: sel.days, endDate: calculateEndDate(newCourse.startDate, sel.days)}); } else { setNewCourse({...newCourse, name: val, type: 'custom'}); } }} className="w-full bg-slate-800/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 placeholder-slate-500" placeholder="選擇或手動輸入..." /><datalist id="course-presets">{COURSE_TYPES.map(c => <option key={c.label} value={c.label} />)}</datalist></div>
                                <div><label className="block text-xs font-bold text-slate-400 mb-2 tracking-widest uppercase">期數</label><input type="text" value={newCourse.batch} onChange={e => setNewCourse({...newCourse, batch:e.target.value})} className="w-full bg-slate-800/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 placeholder-slate-500" placeholder="如: S1" /></div>
                            </div>
                            <div className="grid grid-cols-3 gap-5">
                                <div className="col-span-1"><label className="block text-xs font-bold text-slate-400 mb-2 tracking-widest uppercase">開始日期</label><input type="date" value={newCourse.startDate} onChange={e => setNewCourse({...newCourse, startDate:e.target.value, endDate: calculateEndDate(e.target.value, newCourse.duration)})} className="w-full bg-slate-800/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 cursor-pointer" /></div>
                                <div className="col-span-1"><label className="block text-xs font-bold text-slate-400 mb-2 tracking-widest uppercase">天數</label><input type="number" value={newCourse.duration} onChange={e => setNewCourse({...newCourse, duration:e.target.value, endDate: calculateEndDate(newCourse.startDate, e.target.value)})} className="w-full bg-slate-800/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500" /></div>
                                <div className="col-span-1"><label className="block text-xs font-bold text-slate-500 mb-2 tracking-widest uppercase">結束日期</label><input type="date" value={newCourse.endDate} readOnly className="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl p-3 text-sm font-bold text-slate-500 outline-none cursor-not-allowed" /></div>
                            </div>
                            <div><label className="block text-xs font-bold text-slate-400 mb-2 tracking-widest uppercase">預估人數</label><input type="number" value={newCourse.students} onChange={e => setNewCourse({...newCourse, students:parseInt(e.target.value)||0})} className="w-full bg-slate-800/80 border border-slate-600 rounded-xl p-3 text-lg font-black text-indigo-400 outline-none focus:border-indigo-500 text-center tracking-widest" placeholder="0" /></div>
                            {errorMsg && <div className="text-rose-400 text-sm font-bold bg-rose-950/50 border border-rose-900/50 p-3 rounded-xl flex items-center justify-center gap-2"><span className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>{errorMsg}</div>}
                            <div className="pt-6 flex gap-4"><button onClick={() => setShowCourseModal(false)} className="flex-1 py-3.5 rounded-xl font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 transition-all">取消</button><button onClick={handleAddCourse} className="flex-1 py-3.5 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-500 shadow-lg active:scale-95">確認新增</button></div>
                        </div>
                    </div>
                </div>
            )}
            
            {/* 分類管理 Modal */}
            {showCategoryModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-in fade-in duration-200">
                    <div className="bg-slate-900/90 backdrop-blur-2xl rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] w-full max-w-xl p-8 border border-slate-700/50 max-h-[85vh] flex flex-col">
                        <div className="flex justify-between items-center mb-6 shrink-0"><h3 className="text-2xl font-black text-slate-100 tracking-wide">管理人員分類</h3><button onClick={() => setShowCategoryModal(false)} className="text-slate-400 hover:text-slate-200 bg-slate-800/50 p-2 rounded-full transition-colors"><Icons.X /></button></div>
                        <div className="space-y-8 overflow-y-auto custom-scrollbar pr-4 flex-1">
                            <div className="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/50">
                                <h4 className="font-black text-slate-200 text-sm mb-4">新增大分類 (Group)</h4>
                                <div className="flex gap-3"><input value={newGroupForm} onChange={e=>setNewGroupForm(e.target.value)} placeholder="分類名稱 (如: 實習)" className="flex-1 bg-slate-900/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 transition-all" /><button onClick={() => { if(!newGroupForm) return; const newGroups = [...categoryGroups, { name: newGroupForm, items: [] }]; handleSaveCategories(newGroups); setNewGroupForm(''); }} className="bg-indigo-600 text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-indigo-500 transition-all active:scale-95 shadow-md">新增</button></div>
                            </div>
                            <div className="space-y-6">
                            {(categoryGroups||[]).map((group, idx) => (
                                <div key={idx} className="border-b border-slate-800/80 pb-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <h4 className="font-black text-lg text-indigo-300 tracking-wide flex items-center gap-2"><span className="w-1.5 h-5 bg-indigo-500 rounded-full"></span>{group.name}</h4>
                                        <button onClick={() => { setConfirmDialog({ show: true, message: `確定要刪除「${group.name}」這個分類群組嗎？`, onConfirm: () => { const newGroups = categoryGroups.filter((_, i) => i !== idx); handleSaveCategories(newGroups); }}); }} className="text-rose-400 text-xs font-bold hover:text-rose-300 bg-rose-950/30 px-3 py-1.5 rounded-lg border border-rose-900/50 transition-colors">刪除整個群組</button>
                                    </div>
                                    <div className="space-y-3">
                                        {(group.items||[]).map(cat => (
                                            <div key={cat.id} className="flex justify-between items-center bg-slate-800/40 p-3 rounded-xl border border-slate-700/50 hover:bg-slate-800/60 transition-colors"><div className="flex items-center gap-3"><span className="text-sm font-bold text-slate-200">{cat.label}</span><span className="text-[10px] font-black tracking-widest text-slate-500 bg-slate-900/50 px-2 py-0.5 rounded-md">ID: {cat.id}</span></div><button onClick={() => { setConfirmDialog({ show: true, message: `確定要刪除「${cat.label}」嗎？`, onConfirm: () => { const newGroups = [...categoryGroups]; newGroups[idx].items = newGroups[idx].items.filter(c => c.id !== cat.id); handleSaveCategories(newGroups); }}); }} className="text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 p-2 rounded-lg transition-colors"><Icons.Trash /></button></div>
                                        ))}
                                        <div className="flex gap-3 mt-4"><input value={newCatForm.id} onChange={e=>setNewCatForm({...newCatForm, id:e.target.value})} placeholder="ID (純英數)" className="w-1/3 bg-slate-900/80 border border-slate-600 rounded-xl p-2.5 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 placeholder-slate-500" /><input value={newCatForm.label} onChange={e=>setNewCatForm({...newCatForm, label:e.target.value})} placeholder="分類名稱" className="flex-1 bg-slate-900/80 border border-slate-600 rounded-xl p-2.5 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 placeholder-slate-500" /><button onClick={() => { if(!newCatForm.id || !newCatForm.label) return; const newGroups = [...categoryGroups]; newGroups[idx].items.push({ id: newCatForm.id, label: newCatForm.label, type: 'frontline' }); handleSaveCategories(newGroups); setNewCatForm({ groupIdx: 0, label: '', id: '' }); }} className="bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold px-4 rounded-xl transition-colors shadow-sm">+</button></div>
                                    </div>
                                </div>
                            ))}
                            </div>
                        </div>
                    </div>
                </div>
            )}
            
            {/* 工作類型管理 Modal */}
            {showTaskTypeModal && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-in fade-in duration-200">
                    <div className="bg-slate-900/90 backdrop-blur-2xl rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] w-full max-w-xl p-8 border border-slate-700/50 max-h-[85vh] flex flex-col">
                        <div className="flex justify-between items-center mb-6 shrink-0"><h3 className="text-2xl font-black text-slate-100 tracking-wide">管理工作類型標籤</h3><button onClick={() => setShowTaskTypeModal(false)} className="text-slate-400 hover:text-slate-200 bg-slate-800/50 p-2 rounded-full transition-colors"><Icons.X /></button></div>
                        <div className="overflow-y-auto custom-scrollbar pr-4 flex-1 space-y-8">
                            <div className="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/50">
                                <h4 className="font-black text-slate-200 text-sm mb-4">新增自訂標籤</h4>
                                <div className="grid grid-cols-2 gap-4 mb-4"><input value={newTaskForm.id} onChange={e=>setNewTaskForm({...newTaskForm, id:e.target.value})} placeholder="ID (如: meeting)" className="bg-slate-900/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 placeholder-slate-500" /><input value={newTaskForm.label} onChange={e=>setNewTaskForm({...newTaskForm, label:e.target.value})} placeholder="顯示名稱 (如: 會議)" className="bg-slate-900/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 placeholder-slate-500" /></div>
                                <div className="grid grid-cols-2 gap-4 mb-5"><input value={newTaskForm.color} onChange={e=>setNewTaskForm({...newTaskForm, color:e.target.value})} placeholder="Tailwind 顏色類別 (如: bg-red-500 text-white)" className="bg-slate-900/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 text-[11px]" /><select value={newTaskForm.targetCategory} onChange={e=>setNewTaskForm({...newTaskForm, targetCategory:e.target.value})} className="bg-slate-900/80 border border-slate-600 rounded-xl p-3 text-sm font-bold text-slate-200 outline-none focus:border-indigo-500 cursor-pointer"><option value="">(排班時不連動人員轉移)</option>{categories.map(c => <option key={c.id} value={c.id}>自動轉移至 ➔ {c.label}</option>)}</select></div>
                                <button onClick={() => { if(!newTaskForm.id || !newTaskForm.label) return; const newTypes = [...taskTypes, newTaskForm]; handleSaveTaskTypes(newTypes); setNewTaskForm({ id: '', label: '', color: 'bg-indigo-600 text-indigo-50', targetCategory: '' }); }} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-500 shadow-md active:scale-95">新增標籤</button>
                            </div>
                            <div>
                                <h4 className="font-black text-slate-300 text-sm mb-4 flex items-center gap-2"><span className="w-1.5 h-4 bg-slate-500 rounded-full"></span>現有標籤清單</h4>
                                <div className="space-y-3">
                                    {(taskTypes||[]).map(task => (
                                        <div key={task.id} className="flex justify-between items-center bg-slate-800/40 p-4 rounded-xl border border-slate-700/50 hover:bg-slate-800/60 transition-colors"><div className="flex flex-col gap-2"><div className="flex items-center gap-3"><div className={`text-xs font-black px-3 py-1.5 rounded-lg shadow-sm border border-black/10 ${task.color}`}>{task.label}</div><span className="text-[10px] font-black tracking-widest text-slate-500 bg-slate-900/50 px-2 py-0.5 rounded-md">ID: {task.id}</span></div>{task.targetCategory && <div className="text-[11px] font-bold text-emerald-400 flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>排班時連動轉移 ➔ {categories.find(c=>c.id===task.targetCategory)?.label || task.targetCategory}</div>}</div><button onClick={() => { setConfirmDialog({ show: true, message: `確定要刪除「${task.label}」嗎？`, onConfirm: () => { const newTypes = taskTypes.filter(t => t.id !== task.id); handleSaveTaskTypes(newTypes); }}); }} className="text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 p-2.5 rounded-xl transition-colors"><Icons.Trash /></button></div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            )}
            
            {showDeleteModal && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[110] flex items-center justify-center p-4 animate-in fade-in duration-200">
                <div className="bg-slate-900/90 backdrop-blur-2xl rounded-3xl p-8 w-full max-w-sm shadow-[0_20px_60px_-15px_rgba(0,0,0,0.8)] border border-slate-700/50">
                  <div className="w-12 h-12 rounded-full bg-rose-500/20 text-rose-500 flex items-center justify-center mb-4 mx-auto"><Icons.Trash /></div>
                  <h3 className="font-black text-xl text-center text-slate-100 mb-2 tracking-wide">確定要移除此人員嗎？</h3>
                  <p className="text-slate-400 text-sm text-center mb-8 font-medium">此動作無法復原，請確認。</p>
                  <div className="flex gap-4"><button onClick={() => setShowDeleteModal(false)} className="flex-1 py-3 rounded-xl font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 transition-all">取消</button><button onClick={handleRemovePerson} className="flex-1 py-3 rounded-xl font-bold bg-rose-600 text-white hover:bg-rose-500 shadow-lg active:scale-95">確認移除</button></div>
                </div>
              </div>
            )}
         </div>
      );
    }
    
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
