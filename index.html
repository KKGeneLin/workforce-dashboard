  <script src="https://cdn.tailwindcss.com"></script>  
  <script>  
    tailwind.config = {  
      darkMode: 'class',  
      theme: {  
        extend: {  
          colors: {  
            slate: {  
              850: '#1e293b',   
              900: '#0f172a',  
              950: '#020617',

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <!-- 引入 Supabase -->

  <style>  
    body { background-color: #020617; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #e2e8f0; }  
      
    ::-webkit-scrollbar { width: 6px; height: 6px; }  
    ::-webkit-scrollbar-track { background: #0f172a; }  
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }  
    ::-webkit-scrollbar-thumb:hover { background: #475569; }  
      
    .dragging { opacity: 0.5; }  
    .header-transition { transition: all 0.3s ease-in-out; }  
    .stats-container { transition: max-height 0.3s ease-in-out, opacity 0.2s ease-in-out, margin 0.3s ease-in-out; overflow: hidden; }  
    .stats-visible { max-height: 500px; opacity: 1; margin-bottom: 1.5rem; }  
    .stats-hidden { max-height: 0; opacity: 0; margin-bottom: 0; }  
    .timeline-grid { background-image: linear-gradient(to right, #1e293b 1px, transparent 1px); background-size: 8.33% 100%; }  
      
    /* Attendance Grid Styles */  
    .attendance-cell {  
      transition: all 0.1s;  
      cursor: pointer;  
      height: 48px;   
      vertical-align: middle;  
      padding: 2px;  
      border-right: 1px solid #1e293b;  
      border-bottom: 1px solid #1e293b;  
    }  
    .attendance-cell:hover {  
      background-color: #1e293b;  
    }  
    .task-block {  
      width: 100%;  
      height: 100%;  
      display: flex;  
      align-items: center;  
      justify-content: center;  
      font-size: 11px;  
      font-weight: 600;  
      border-radius: 6px;  
      overflow: hidden;  
      white-space: nowrap;  
      text-overflow: ellipsis;  
      transition: transform 0.1s, box-shadow 0.1s;  
      padding: 0 4px;  
      position: relative;  
    }  
    .task-block:hover {  
        transform: translateY(-1px);  
        z-index: 20;  
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);  
    }  
    .view-month .task-block:hover::after {  
        content: attr(data-tooltip);  
        position: absolute;  
        bottom: 100%;  
        left: 50%;  
        transform: translateX(-50%);  
        background-color: #f1f5f9;  
        color: #0f172a;  
        padding: 4px 8px;  
        border-radius: 4px;  
        font-size: 10px;  
        white-space: nowrap;  
        margin-bottom: 4px;  
        pointer-events: none;  
        z-index: 50;  
        font-weight: bold;  
    }  
  </style>  
</head>  
<body class="dark">

  <script type="text/babel" data-type="module">  
    const { useState, useMemo, useEffect, useRef } = React;  
    // --- Supabase 配置 - 使用環境變數 ---  
    const SUPABASE_URL = process.env.REACT_APP_SUPABASE_URL || 'https://vbhnboegowulvgckjlyg.supabase.co';  
    const SUPABASE_KEY = process.env.REACT_APP_SUPABASE_ANON_KEY || 'sb_publishable_8fAfsHCXZ45iJY6_t4rTLQ_uvJ6Izb2';  
      
    let supabase = null;  
    try {  
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const generateId = () => Math.random().toString(36).substr(2, 9);

      ChevronUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>,

      Cloud: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19c0-1.7-1.3-3-3-3h-1.1c-.1-2.6-2.1-4.6-4.6-4.8C6 11.3 3.8 13.5 4 16.3c.1 1.5 1.5 2.7 3 2.7h10.5Z"/><path d="M12 3v9"/><path d="m8 8 4-4 4 4"/></svg>,  
      X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,  
      Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,  
      Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,  
      Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>  
    };  
    // --- 工作類型與連動設定 ---  
    const TASK_TYPES = [  
        { id: 'persp_group', label: '透視群', color: 'bg-blue-600 text-blue-50 shadow-sm shadow-blue-900/50', targetCategory: 'regular' },  
        { id: 'color_group', label: '色彩群', color: 'bg-pink-600 text-pink-50 shadow-sm shadow-pink-900/50', targetCategory: 'reg_color' },  
        { id: 'comp_group', label: '構成群', color: 'bg-amber-600 text-amber-50 shadow-sm shadow-amber-900/50', targetCategory: 'reg_comp' },  
        { id: 'sketch_camp', label: '速寫營', color: 'bg-orange-600 text-orange-50 shadow-sm shadow-orange-900/50', targetCategory: 'sketch' },  
        { id: 'line_camp', label: '線條營', color: 'bg-emerald-600 text-emerald-50 shadow-sm shadow-emerald-900/50', targetCategory: 'bootcamp' },  
        { id: 'color_camp', label: '色彩營', color: 'bg-purple-600 text-purple-50 shadow-sm shadow-purple-900/50', targetCategory: 'camp_color' },  
        { id: 'monthly_paint', label: '月月繪', color: 'bg-cyan-600 text-cyan-50 shadow-sm shadow-cyan-900/50', targetCategory: 'monthly' },  
        { id: 'leave', label: '休假', color: 'bg-rose-600 text-rose-50 shadow-sm shadow-rose-900/50', targetCategory: null },   
    ];  
    const COURSE_TYPES = [  
        { label: '透視', value: 'regular', days: 70 },  
        { label: '構成', value: 'regular', days: 70 },  
        { label: '色彩', value: 'regular', days: 70 },  
        { label: '線條訓練營', value: 'camp30', days: 49 },  
        { label: '色彩訓練營', value: 'camp30', days: 49 },  
        { label: '速寫團練', value: 'sketch', days: 60 },  
    ];  
    // --- External Components ---  
    const KPICard = ({ title, value, icon, color }) => (  
        <div className="bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-800 flex items-center gap-4 transition-transform hover:scale-[1.02]">  
            <div className={`p-3 rounded-lg ${color}`}>{icon}</div>  
            <div>  
                <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">{title}</div>  
                <div className="text-2xl font-black text-white">{value}</div>  
            </div>  
        </div>  
    );  
    const CourseRow = ({ course, onUpdate, onDelete }) => (  
        <tr className="border-b border-slate-800 last:border-0 hover:bg-slate-800/50 transition-colors">  
            <td className="p-3 font-bold text-slate-200">{course.name}</td>  
            <td className="p-3 text-slate-400">{course.batch || '-'}</td>  
            <td className="p-3"><input type="date" value={course.startDate} onChange={e => onUpdate(course.id, 'startDate', e.target.value)} className="bg-transparent border-b border-dashed border-slate-600 focus:border-indigo-400 outline-none w-28 text-sm text-slate-300" /></td>  
            <td className="p-3"><input type="number" value={course.duration} onChange={e => onUpdate(course.id, 'duration', e.target.value)} className="bg-transparent border-b border-dashed border-slate-600 focus:border-indigo-400 outline-none w-12 text-center text-sm text-slate-300" /></td>  
            <td className="p-3"><input type="date" value={course.endDate} onChange={e => onUpdate(course.id, 'endDate', e.target.value)} className="bg-transparent border-b border-dashed border-slate-600 focus:border-indigo-400 outline-none w-28 text-sm text-slate-300" /></td>  
            <td className="p-3"><input type="number" value={course.students} onChange={e => onUpdate(course.id, 'students', parseInt(e.target.value) || 0)} className="bg-transparent font-bold text-indigo-400 border-b border-dashed border-indigo-900 focus:border-indigo-400 outline-none w-16 text-center" /></td>  
            <td className="p-3 text-right">  
                <button onClick={() => onDelete(course.id)} className="text-slate-500 hover:text-rose-500 transition-colors p-1"><Icons.Trash /></button>  
            </td>  
        </tr>  
    );  
    const App = () => {  
      // --- State ---  
      const [loading, setLoading] = useState(true);  
      const [syncStatus, setSyncStatus] = useState('連線中...');  
      const [currentView, setCurrentView] = useState('dashboard');  
      const [forceRefresh, setForceRefresh] = useState(0);   
        
      const [masterCourses, setMasterCourses] = useState([]);  
      const [schedule, setSchedule] = useState([]);  
      const [personnel, setPersonnel] = useState({});  
      const [attendanceData, setAttendanceData] = useState({});   
        
      const [draggedItem, setDraggedItem] = useState(null);  
      const [dragOverContainer, setDragOverContainer] = useState(null);  
      const [addingToCategory, setAddingToCategory] = useState(null);  
      const [tempName, setTempName] = useState('');  
        
      const [showCourseModal, setShowCourseModal] = useState(false);  
      const [showDeleteModal, setShowDeleteModal] = useState(false);  
      const [deleteTarget, setDeleteTarget] = useState(null);  
        
      const [collapsedMonths, setCollapsedMonths] = useState({});  
      const [collapsedPersonnelGroups, setCollapsedPersonnelGroups] = useState({});  
      const [isMasterCollapsed, setIsMasterCollapsed] = useState(false);  
      const [isScrolled, setIsScrolled] = useState(false);  
      const [errorMsg, setErrorMsg] = useState('');  
      const [newCourse, setNewCourse] = useState({  
          name: '透視', type: 'regular', batch: '', students: 0, startDate: '', duration: 70, endDate: ''  
      });  
        
      // Work Schedule UI State  
      const [wsSelectedMonth, setWsSelectedMonth] = useState(new Date());  
      const [wsSearchTerm, setWsSearchTerm] = useState("");  
      const [wsViewMode, setWsViewMode] = useState('week');   
      const [wsExpandedGroups, setWsExpandedGroups] = useState({});  
      const [wsPopover, setWsPopover] = useState(null);  
      const [wsPopoverContext, setWsPopoverContext] = useState("");  
      const [wsShowBatchModal, setWsShowBatchModal] = useState(false);  
      const [wsBatchForm, setWsBatchForm] = useState({ personId: '', startDate: '', endDate: '', type: 'persp_group', context: '' });  
        
      const [timelineYear, setTimelineYear] = useState(new Date().getFullYear());  
      const fileInputRef = useRef(null);  
      // --- Category Definition ---  
      const categoryGroups = useMemo(() => [  
        { name: '管理', items: [{ id: 'supervisor', label: '主管', type: 'admin' }] },  
        { name: '專項', items: [  
            { id: 'marketing', label: '行銷', type: 'admin' },  
            { id: 'content', label: '內容', type: 'admin' },  
            { id: 'instructor', label: '講師', type: 'teaching' },  
            { id: 'captain', label: '隊長', type: 'frontline' },  
            { id: 'innovation', label: '創新', type: 'admin' }  
        ]},  
        { name: '專案', items: [  
            { id: 'bootcamp', label: '線條訓練營', type: 'frontline' },   
            { id: 'camp_color', label: '色彩訓練營', type: 'frontline' },  
            { id: 'sketch', label: '速寫團練', type: 'frontline' },  
            { id: 'monthly', label: '月月繪', type: 'frontline' }  
        ]},  
        { name: '正課', items: [  
            { id: 'regular', label: '透視', type: 'frontline' },   
            { id: 'reg_comp', label: '構成', type: 'frontline' },  
            { id: 'reg_color', label: '色彩', type: 'frontline' },  
            { id: 'dlc', label: 'DLC', type: 'frontline' }  
        ]},  
        { name: '待命', items: [{ id: 'pool', label: '尚未分配', type: 'pool' }] }  
      ], []);  
      const categories = useMemo(() => categoryGroups.flatMap(g => g.items), [categoryGroups]);  
      // --- Initialization ---  
      useEffect(() => {  
        const handleScroll = () => setIsScrolled(window.scrollY > 10);  
        window.addEventListener('scroll', handleScroll, { passive: true });  
        return () => window.removeEventListener('scroll', handleScroll);  
      }, []);  
        
      useEffect(() => {  
         if (Object.keys(wsExpandedGroups).length === 0 && categoryGroups.length > 0) {  
             setWsExpandedGroups(categoryGroups.reduce((acc, g) => ({...acc, [g.name]: true}), {}));  
         }  
      }, [categoryGroups]);  
      // --- Main Data Loading ---  
      useEffect(() => {  
        const initializeData = async () => {  
          setLoading(true);  
          setSyncStatus('同步中...');  
          if (!supabase) {  
            setSyncStatus('❌ Supabase 未初始化');  
            setLoading(false);  
            return;  
          }  
          const safeFetch = async (table, options = {}) => {  
              try {  
                const query = supabase.from(table).select('*');  
                if (options.order) query.order(options.order, { ascending: true });  
                const { data, error } = await query;  
                if (error) {  
                    console.warn(`Supabase: 讀取 ${table} 失敗 (${error.code})`);  
                    return [];   
                }  
                return data || [];  
              } catch (e) {  
                console.warn(`Supabase Exception`, e);  
                return [];  
              }  
          };  
          try {  
            const [pData, cData, mData, attData] = await Promise.all([  
                safeFetch('personnel'),  
                safeFetch('courses'),  
                safeFetch('monthly_data', { order: 'month_index' }),  
                safeFetch('attendance')  
            ]);  
            // Personnel  
            if (pData.length > 0) {  
                const grouped = {};  
                categories.forEach(c => grouped[c.id] = []);  
                pData.forEach(p => {  
                    if (grouped[p.category_id]) grouped[p.category_id].push({ id: p.id, name: p.name });  
                });  
                setPersonnel(grouped);  
            } else {  
                const grouped = {}; categories.forEach(c => grouped[c.id] = []);  
                setPersonnel(grouped);  
            }  
            // Courses  
            if (cData.length > 0) {  
                setMasterCourses(cData.map(c => ({  
                    id: c.id, name: c.name, type: c.type, batch: c.batch,  
                    students: c.students, startDate: c.start_date, endDate: c.end_date, duration: c.duration  
                })));  
            }  
            // Schedule  
            const initSchedule = Array.from({ length: 12 }, (_, i) => ({  
                month: `${i + 1}月`,  
                monthly: [{ name: '月月繪', type: 'monthlyActivity', students: mData?.find(m => m.month_index === i)?.students || 0, batch: '常駐' }],  
                early: [], mid: [], late: []  
            }));  
            setSchedule(initSchedule);  
            // Attendance  
            if (attData.length > 0) {  
                const attMap = {};  
                attData.forEach(record => {  
                    if (!attMap[record.employee_id]) attMap[record.employee_id] = {};  
                    attMap[record.employee_id][record.date] = { status: record.status, context: record.context || '' };  
                });  
                setAttendanceData(attMap);  
            }  
            setSyncStatus('✅ 已同步');  
          } catch (err) {  
            console.error("Init Error", err);  
            setSyncStatus('⚠️ 部分功能受限');  
          } finally {  
            setLoading(false);  
          }  
        };  
        initializeData();  
      }, [forceRefresh, categories]);  
      // --- Schedule Logic ---  
      useEffect(() => {  
          setSchedule(prev => {  
              const newSchedule = prev.length > 0 ? JSON.parse(JSON.stringify(prev)) : [];  
              if(newSchedule.length===0) return [];  
              newSchedule.forEach(m => { m.early = []; m.mid = []; m.late = []; });  
              masterCourses.forEach(course => {  
                  if (!course.startDate || !course.endDate) return;  
                  const start = new Date(course.startDate);  
                  const end = new Date(course.endDate);  
                  for (let m = 0; m < 12; m++) {  
                      const periods = [{ key: 'early', s: 1, e: 10 }, { key: 'mid', s: 11, e: 20 }, { key: 'late', s: 21, e: 31 }];  
                      periods.forEach(p => {  
                          const testStart = new Date(start.getFullYear(), m, p.s);  
                          const testEnd = new Date(start.getFullYear(), m, p.e);  
                          if (start <= testEnd && end >= testStart) {  
                              newSchedule[m][p.key].push({ name: course.name, type: course.type, students: course.students, batch: course.batch });  
                          }  
                      });  
                  }  
              });  
              return newSchedule;  
          });  
      }, [masterCourses]);  
      // --- Helpers & DB ---  
      const calculateEndDate = (startStr, days) => {  
          if (!startStr || !days) return '';  
          const d = new Date(startStr);  
          d.setDate(d.getDate() + parseInt(days) - 1);  
          return d.toISOString().split('T')[0];  
      };  
        
      const calculateDuration = (startStr, endStr) => {  
          if (!startStr || !endStr) return 0;  
          const start = new Date(startStr);  
          const end = new Date(endStr);  
          return Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;  
      };  
        
      const syncDB = async (table, data, deleteFilter = {}) => {  
        setSyncStatus('同步中...');  
        if (!supabase) { setSyncStatus('❌ Supabase 未初始化'); return; }  
          
        try {  
            if (table === 'personnel') {  
                await supabase.from('personnel').delete().neq('id', '0');  
                const records = [];  
                Object.entries(data).forEach(([catId, list]) => list.forEach(p => records.push({ id: p.id, category_id: catId, name: p.name })));  
                if(records.length) await supabase.from('personnel').insert(records);  
            }  
            else if (table === 'courses') {  
                await supabase.from('courses').delete().neq('id', '0');  
                const records = data.map(c => ({

                    students: c.students, start_date: c.startDate, end_date: c.endDate, duration: c.duration  
                }));  
                if(records.length) await supabase.from('courses').insert(records);  
            }  
            else if (table === 'monthly_data') {  
                await supabase.from('monthly_data').delete().neq('id', '0');  
                const records = data.map((m, i) => ({ month_index: i, students: m[0]?.students || 0 }));  
                if(records.length) await supabase.from('monthly_data').insert(records);

      const movePersonToCategory = (empId, taskType) => {  
          const taskConfig = TASK_TYPES.find(t => t.id === taskType);  
          if (!taskConfig || !taskConfig.targetCategory) return;   
          const targetCatId = taskConfig.targetCategory;  
          let currentCatId = null;  
          let personObj = null;  
          for (const [catId, list] of Object.entries(personnel)) {  
              const found = list.find(p => p.id === empId);  
              if (found) {  
                  currentCatId = catId;  
                  personObj = found;  
                  break;  
              }  
          }  
          if (personObj && currentCatId && currentCatId !== targetCatId) {  
              const newPersonnel = { ...personnel };  
              newPersonnel[currentCatId] = newPersonnel[currentCatId].filter(p => p.id !== empId);  
              if (!newPersonnel[targetCatId]) newPersonnel[targetCatId] = [];  
              newPersonnel[targetCatId] = [...newPersonnel[targetCatId], personObj];  
              setPersonnel(newPersonnel);  
              syncDB('personnel', newPersonnel);  
          }  
      };  
        
      const updateAttendance = async (empId, date, status, context) => {  
          const newData = { ...attendanceData };  
          if (!newData[empId]) newData[empId] = {};  
            
          if (!status) delete newData[empId][date];   
          else newData[empId][date] = { status, context };  
            
          setAttendanceData(newData);  
          setSyncStatus('同步中...');  
            
          if (status) movePersonToCategory(empId, status);  
            
          if (!supabase) { setSyncStatus('❌ Supabase 未初始化'); return; }  
            
          try {  
            if (!status) {  
                await supabase.from('attendance').delete().match({ employee_id: empId, date: date });  
            } else {  
                await supabase.from('attendance').upsert({ employee_id: empId, date: date, status: status, context: context }, { onConflict: 'employee_id, date' });  
            }  
            setSyncStatus('✅ 已同步');  
          } catch(e) { setSyncStatus('❌ 儲存失敗'); }  
      };  
        
      const batchUpdateAttendance = async (records) => {  
          setSyncStatus('批量更新中...');  
          const newData = { ...attendanceData };  
          records.forEach(r => {  
             if (!newData[r.employee_id]) newData[r.employee_id] = {};  
             newData[r.employee_id][r.date] = { status: r.status, context: r.context };  
          });  
          setAttendanceData(newData);  
          if (records.length > 0) {  
             const firstRecord = records[0];  
             movePersonToCategory(firstRecord.employee_id, firstRecord.status);  
          }  
          if (!supabase) { setSyncStatus('❌ Supabase 未初始化'); return; }  
          try {  
             const { error } = await supabase.from('attendance').upsert(records, { onConflict: 'employee_id, date' });  
             if (error) throw error;  
             setSyncStatus('✅ 批量完成');  
          } catch(e) { console.error(e); setSyncStatus('❌ 批量失敗'); }  
      };
